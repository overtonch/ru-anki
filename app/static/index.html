let progClientStart = 0;
function startProgress(v, ex) {
  progClientStart = Date.now() - (ex.elapsed || 0) * 1000;
  paintProgress(ex);
  if (sse) sse.close();
  sse = new EventSource(`/videos/${v.id}/extract/events`);
  sse.onmessage = e => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    if (d.state === 'idle') { sse.close(); sse = null; return; }
    if (d.elapsed) progClientStart = Date.now() - d.elapsed * 1000;
    paintProgress(d);
    if (d.added != null && d.added !== (v._lastAdded || 0)) { v._lastAdded = d.added; loadCandidates(); }
    if (d.state === 'done' || d.state === 'error') {
      sse.close(); sse = null;
      clearInterval(tickTimer); tickTimer = null;
      loadCandidates();
      loadVideosQuiet();
    }
  };
  sse.onerror = () => { /* EventSource auto-retries */ };
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    const el = $('#pElapsed');
    if (el) el.textContent = fmtTime((Date.now() - progClientStart) / 1000);
  }, 1000);
}
function paintProgress(ex) {
  const panel = $('#progressPanel');
  if (ex.state === 'done' || ex.state === 'error') { renderProgressDone(ex); return; }
  const starting = ex.state === 'queued' || !ex.chunks_total;
  panel.innerHTML = `
    <div class="panel">
      <h3><span class="spin"></span> ${starting ? 'Reading the video…' : 'Finding vocabulary'}</h3>
      ${bar(ex)}
      <div class="pmeta">
        ${ex.chunks_total ? `${ex.chunks_done}/${ex.chunks_total} sections · ` : ''}
        <b>${ex.added || 0}</b> words found ·
        <span id="pElapsed">${fmtTime(ex.elapsed)}</span>
      </div>
    </div>`;
}
function renderProgressDone(ex) {
  const panel = $('#progressPanel');
  if (!ex || ex.state === 'idle') {
    // never extracted (or the in-memory status was lost on a restart) — offer it
    // unless candidates already exist
    const pend = (DETAIL_V && DETAIL_V.pending) || 0;
    panel.innerHTML = pend > 0 ? '' :
      `<div class="panel"><div class="pmeta">No card suggestions yet for this one.</div>
       <div style="margin-top:.55rem"><button class="btn sm" onclick="retryExtract()">Suggest vocabulary cards</button></div></div>`;
    return;
  }
  if (ex.state === 'error') {
    panel.innerHTML = `<div class="panel"><h3 style="color:var(--no)">Extraction failed</h3>
      <div class="pmeta">${escapeHtml(ex.detail || '')}</div>
      <div style="margin-top:.5rem"><button class="btn sm" onclick="retryExtract()">Retry</button></div></div>`;
    return;
  }
  const u = ex.usage;
  const cost = u ? ` · ${(u.in/1000).toFixed(1)}k in / ${(u.out/1000).toFixed(1)}k out · ~$${u.cost_est.toFixed(3)}` : '';
  panel.innerHTML = `<div class="panel ok"><h3>✓ Extraction complete</h3>
    <div class="pmeta">${escapeHtml(ex.detail || '')}${ex.elapsed ? ' · '+fmtTime(ex.elapsed) : ''}${cost}</div>
    <div style="margin-top:.5rem"><button class="btn sm ghost" onclick="retryExtract()">Re-extract</button></div></div>`;
}
async function retryExtract() {
  try {
    const m = $('#model') ? $('#model').value : 'sonnet';
    await api(`/videos/${CURRENT}/extract?model=${m}`, {method:'POST'});
    const v = VIDEOS.find(x => x.id === CURRENT) || await api(`/videos/${CURRENT}`);
    startProgress(v, {state:'queued', added:0, elapsed:0});
  } catch (e) { toast('error: ' + e.message, 3500); }
}
async function loadVideosQuiet() {
  try { VIDEOS = await api('/videos'); } catch { VIDEOS = await offlineVideoList(); }
}

/* videos usable with no connection: anything with cached captions, a saved
   transcript, or a downloaded file — merged by id across the idb entry shapes */
async function offlineVideoList() {
  const byId = new Map();
  for (const o of await idbAll('offline')) {
    const vv = o && o.video;
    if (!vv || vv.id == null) continue;
    const cur = byId.get(vv.id) || {};
    Object.assign(cur, vv);   // merge meta from whichever entry has more
    if (Array.isArray(o.lines)) cur.lines = o.lines.length;
    cur._offline = true;
    byId.set(vv.id, cur);
  }
  try {   // downloaded files with no cached meta still get a card
    for await (const name of (await opfsDir()).keys()) {
      const m = /^(\d+)\.mp4$/.exec(name);
      if (m && !byId.has(+m[1]))
        byId.set(+m[1], { id: +m[1], title: 'video ' + m[1], _offline: true });
    }
  } catch {}
  return [...byId.values()];
}

// Make the DOM match the server's pending list exactly: drop stale cards, add
// missing ones, leave anything mid-dismiss alone. Single source of truth.
function reconcileCards(box, rows) {
  box.querySelectorAll('.center-spin, .empty').forEach(el => el.remove());
  const wanted = new Map(rows.map(c => [String(c.id), c]));
  box.querySelectorAll('.card').forEach(el => {
    if (!wanted.has(el.dataset.id) && !el.classList.contains('leaving')) el.remove();
  });
  const present = new Set([...box.querySelectorAll('.card')].map(el => el.dataset.id));
  let added = 0;
  rows.forEach(c => {
    if (present.has(String(c.id))) return;
    try {
      const el = renderCard(c);
      el.style.animationDelay = Math.min(added++, 8) * 30 + 'ms';
      box.appendChild(el);
    } catch (e) { console.error('renderCard', c && c.id, e); }
  });
  refreshReviewHead();
}
function refreshReviewHead() {
  const box = $('#cards');
  const n = box.querySelectorAll('.card:not(.leaving)').length;
  const collapsed = $('#reviewPanel').classList.contains('collapsed');
  $('#reviewHead').textContent = `${collapsed ? '▸' : '▾'} Review (${n})`;
  if (!n && !box.querySelector('.card'))

function renderCard(c) {
  const el = document.createElement('div');
  el.className = 'card' + (c.duplicate ? ' dup' : '');
  el.dataset.id = c.id;
  const badge = c.duplicate ? ' · <span class="dupbadge">already have a card</span>' : '';
  const fq = c.freq ? ` · <span class="fq ${c.freq.band}">${escapeHtml(c.freq.label)}</span>` : '';
  const rec = c.count > 1 ? ` · <span class="rec">heard ${c.count}×</span>` : '';
  const secs = c.timestamp_start != null ? hmsToSec(c.timestamp_start) : null;
  const clip = secs != null ? `
    <button class="clip" title="watch this moment">
      <img loading="lazy" src="/videos/${CURRENT}/frame?t=${secs}" alt=""

  el.innerHTML = `

    ${clip}
    <div class="sent">${c.front_html}</div>

    <div class="tr">${escapeHtml(c.translation || '')}</div>
    <div class="meta">${c.is_phrase ? 'phrase' : 'word'} · <button class="wordlink">${escapeHtml(c.span_text)}</button>${fq}${rec}${c.bolded ? '' : ' · ⚠ not bolded'}${badge}</div>
    <div class="decide">
      ${c.duplicate ? '' : '<button class="y">Make card</button>'}
      <button class="n">Discard</button>
    </div>`;
  const y = el.querySelector('.y');
  if (y) y.onclick = () => decide(c.id, 'yes', el);
  el.querySelector('.n').onclick = () => decide(c.id, 'no', el);
  const clipBtn = el.querySelector('.clip');
  if (clipBtn && secs != null) clipBtn.onclick = () => jumpTo(secs);
  const pb = el.querySelector('.pickbtn');
  if (pb) pb.onclick = () => pickSentence(c.id, el, c.span_text, c.is_phrase);
  const wl = el.querySelector('.wordlink');
  if (wl) wl.onclick = () => openWord(c.span_text);

async function pickSentence(candId, el, span, isPhrase) {
  const existing = el.querySelector('.sentopts');
  if (existing) { existing.remove(); el.querySelector('.pickbtn').classList.remove('on'); return; }
  const pb = el.querySelector('.pickbtn');
  pb.classList.add('on');
  const wrap = document.createElement('div');
  wrap.className = 'sentopts';
  wrap.innerHTML = '<div class="wait"><span class="spin"></span> reading every place it’s said…</div>';
  pb.after(wrap);
  let d;
  try { d = await api(`/candidates/${candId}/sentences`); }
  catch (e) { wrap.innerHTML = `<div class="wait">couldn’t load — ${escapeHtml(e.message)}</div>`; return; }
  if (!d.options || !d.options.length) { wrap.innerHTML = '<div class="wait">no good alternatives found</div>'; return; }
  const cur = (el._sentence || d.current || '').trim();
  wrap.innerHTML = d.options.map((o, i) => {
    const chosen = o.sentence.trim() === cur || (!cur && i === 0);
    return `<label class="sentopt">
      <input type="radio" name="so${candId}" value="${i}"${chosen ? ' checked' : ''}>
      <span class="so-body"><span class="so-txt">${o.front_html}</span>
        <span class="so-meta">${i === 0 ? '<b class="tag">best</b> ' : ''}${escapeHtml(o.timestamp || '')}</span></span>
    </label>`;
  }).join('');
  const apply = i => {
    el._sentence = d.options[i].sentence;
    el.querySelector('.sent').innerHTML = d.options[i].front_html;
  };
  const checked = wrap.querySelector('input:checked');
  if (checked) apply(+checked.value);
  wrap.querySelectorAll('input').forEach(inp => inp.onchange = () => apply(+inp.value));
}

/* swipe right = make card, left = discard */
function attachSwipe(el, id) {
  let x0 = null, y0 = 0, dx = 0, active = false, committed = false;
  el.addEventListener('pointerdown', e => {
    if (el.dataset.busy || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest('.sentopts, .pickbtn, .clip')) return;   // let the controls work
    x0 = e.clientX; y0 = e.clientY; dx = 0; active = committed = false;
    el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => {
    if (x0 === null || committed) return;
    const ax = e.clientX - x0, ay = e.clientY - y0;
    if (!active) {
      if (Math.abs(ax) < 8) return;
      if (Math.abs(ay) > Math.abs(ax)) { x0 = null; return; }   // vertical scroll
      active = true;
      try { el.setPointerCapture(e.pointerId); } catch {}
    }
    dx = ax;
    el.style.transform = `translateX(${dx}px) rotate(${dx * 0.025}deg)`;
    el.classList.toggle('sw-yes', dx < -40);
    el.classList.toggle('sw-no', dx > 40);
    const p = Math.min(Math.abs(dx) / 95, 1);
    el.style.setProperty('--sw', p.toFixed(2));
  });
  const end = e => {
    if (x0 === null) return;
    try { el.releasePointerCapture(e.pointerId); } catch {}
    if (active && Math.abs(dx) > 95 && !committed && !el.dataset.busy) {
      committed = true;
      swipeCommit(el, id, dx < 0 ? 'yes' : 'no', dx);
    } else {
      el.style.transition = 'transform .18s ease';
      el.style.transform = '';
      el.classList.remove('sw-yes', 'sw-no');
    }
    x0 = null; active = false;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
async function swipeCommit(el, id, decision, dx) {
  el.dataset.busy = '1';
  el.querySelectorAll('button').forEach(b => b.disabled = true);
  el.classList.add('act', decision);
  const dir = dx > 0 ? 1 : -1;
  el.style.transition = 'transform .26s ease, opacity .26s ease';
  requestAnimationFrame(() => {
    el.style.transform = `translateX(${dir * (innerWidth + 100)}px) rotate(${dir * 10}deg)`;
    el.style.opacity = '0';
  });
  try {
    await api(`/candidates/${id}/decision`, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ decision, sentence: decision === 'yes' ? (el._sentence || null) : null })
    });
    setTimeout(() => collapseGap(el), 200);
  } catch (e) {
    toast('couldn’t save — ' + e.message, 3500);
    el.remove();
    loadCandidates();
  }
}
function collapseGap(el) {
  el.style.height = el.offsetHeight + 'px';
  el.style.overflow = 'hidden';
  requestAnimationFrame(() => {
    el.style.transition = 'height .18s ease, margin .18s ease, padding .18s ease';
    el.style.height = '0px';
    el.style.marginTop = el.style.marginBottom = '0px';
    el.style.paddingTop = el.style.paddingBottom = '0px';
  });
  setTimeout(() => { el.remove(); refreshReviewHead(); }, 200);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function decide(id, decision, el) {
  if (el.dataset.busy) return;
  el.dataset.busy = '1';
  el.querySelectorAll('button').forEach(b => b.disabled = true);
  el.style.animation = 'none';
  el.style.height = el.offsetHeight + 'px';
  el.classList.add('act', decision);          // instant solid green / red flash
  try {
    await Promise.all([
      api(`/candidates/${id}/decision`, {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ decision, sentence: decision === 'yes' ? (el._sentence || null) : null })
      }),
      sleep(140),                              // let the flash register
    ]);
    collapseCard(el);                          // confirmed — slide away
    if (decision === 'yes') refreshStudyBanner();
  } catch (e) {
    toast('couldn’t save — ' + e.message, 3500);   // revert this card, in place
    el.classList.remove('act', decision);
    el.style.height = ''; el.style.animation = '';
    delete el.dataset.busy;
    el.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}
function collapseCard(el) {
  void el.offsetHeight;
  el.classList.add('leaving');
  requestAnimationFrame(() => {
    el.style.height = '0px';
    el.style.paddingTop = el.style.paddingBottom = '0px';
    el.style.marginTop = el.style.marginBottom = '0px';
    el.style.opacity = '0';
  });
  setTimeout(() => { el.remove(); refreshReviewHead(); }, 190);
}

/* ---------------- search (local-first, works offline) ---------------- */
const rnorm = s => String(s).toLowerCase().replace(/ё/g, 'е').trim();

function localSearch(lines, q, limit=40) {
  const qn = rnorm(q);
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    if (rnorm(lines[i].text).includes(qn)) {
      const ctx = lines.slice(Math.max(0, i-1), i+2).map(l => l.text).join(' ').trim();
      out.push({ id: lines[i].id, start_time: lines[i].t || lines[i].start_time,
                 text: ctx, html: highlightHTML(ctx, q) });
      if (out.length >= limit) break;
    }
  }
  return out;
}
function highlightHTML(text, q) {
  const ft = rnorm(text), fq = rnorm(q);
  if (!fq) return escapeHtml(text);
  let out = '', i = 0, j;
  while ((j = ft.indexOf(fq, i)) >= 0) {
    out += escapeHtml(text.slice(i, j)) + '<b>' + escapeHtml(text.slice(j, j+fq.length)) + '</b>';
    i = j + fq.length;
  }
  return out + escapeHtml(text.slice(i));
}

function debouncedSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 220); }
async function runSearch() {
  const q = $('#q').value.trim();
  const box = $('#results');
  if (!CURRENT || q.length < 2) { box.innerHTML = ''; return; }
  let rows;
  const off = await idbGet('offline', CURRENT);
  if (off) rows = localSearch(off.lines, q);
  else {
    try { rows = await api(`/videos/${CURRENT}/search?q=${encodeURIComponent(q)}`); }
    catch (e) { box.innerHTML = '<div class="empty">offline — save this video for offline search</div>'; return; }
  }
  box.innerHTML = rows.length ? '' : '<div class="empty">no matches</div>';
  for (const r of rows) {
    const el = document.createElement('div');
    el.className = 'line';

    el.onclick = () => openCardModal(r);

/* ---------------- card modal (tap words to pick the phrase) ---------------- */
let MODAL = null;
const stripPunct = s => String(s).replace(/^[^\p{L}\d-]+|[^\p{L}\d-]+$/gu, '');

function openCardModal(row, forceWord) {
  const tokens = row.text.split(/(\s+)/);          // words + the gaps between them
  const wordTok = [];                              // token index of each Nth word
  tokens.forEach((t, i) => { if (t && !/^\s+$/.test(t)) wordTok.push(i); });
  MODAL = { tokens, wordTok, sentence: row.text, lineId: row.id,
            timestamp: row.start_time || null, compact: !!forceWord,
            anchor: null, focus: null, scatter: null, _edited: false,
            preview: null, previewFor: null, pvTimer: null, pvSeq: 0, _firstSync: true };
  $('#modalPreview').innerHTML = '';
  $('#modalSpan').value = '';
  $('#modalWrap').classList.toggle('compact', MODAL.compact);

  // pick the word to pre-select: an exact tapped word, else the searched prefix
  if (forceWord) {
    const fw = rnorm(stripPunct(forceWord));
    const hit = wordTok.findIndex(ti => rnorm(stripPunct(tokens[ti])) === fw);
    if (hit >= 0) { MODAL.anchor = hit; MODAL.focus = hit; }
    else { MODAL._edited = true; $('#modalSpan').value = stripPunct(forceWord); }
  } else {
    const pfx = rnorm($('#q').value || '');
    const matches = pfx ? wordTok
      .map((ti, wi) => ({ wi, w: rnorm(stripPunct(tokens[ti])) }))
      .filter(x => x.w && x.w.startsWith(pfx)).map(x => x.wi) : [];
    if (matches.length === 1) { MODAL.anchor = matches[0]; MODAL.focus = matches[0]; }
    else if (matches.length > 1) { MODAL.scatter = new Set(matches); }
  }

  renderModalSent();
  syncModalSpan();
  $('#modalWrap').hidden = false;
}

function selectedWords() {
  if (MODAL.scatter) return MODAL.scatter;
  if (MODAL.anchor === null) return new Set();
  const b = MODAL.focus ?? MODAL.anchor;
  const out = new Set();
  for (let i = Math.min(MODAL.anchor, b); i <= Math.max(MODAL.anchor, b); i++) out.add(i);
  return out;
}
function selConsecutive() {
  const s = selectedWords();
  if (!s.size) return false;
  return Math.max(...s) - Math.min(...s) + 1 === s.size;
}

function renderModalSent() {
  const host = $('#modalSent');
  host.innerHTML = '';
  if (MODAL.compact) return;   // single-word flow — no sentence picker
  const sel = selectedWords();
  const scattered = !!MODAL.scatter;
  let wi = -1;
  MODAL.tokens.forEach(tok => {
    if (!tok || /^\s+$/.test(tok)) { host.appendChild(document.createTextNode(tok)); return; }
    wi++;
    const my = wi;
    const s = document.createElement('span');
    s.className = 'w' + (sel.has(my) ? ' sel' : '') + (sel.has(my) && scattered ? ' warn' : '');
    s.textContent = tok;
    s.onclick = () => pickWord(my);
    host.appendChild(s);
  });
}
function pickWord(wi) {
  if (MODAL.scatter || MODAL.anchor === null || MODAL.focus !== null) {
    MODAL.scatter = null; MODAL.anchor = wi; MODAL.focus = null;
  } else {
    MODAL.focus = wi;
  }
  MODAL._edited = false;
  renderModalSent();
  syncModalSpan();
}
function syncModalSpan() {
  const sel = selectedWords();
  if (!MODAL._edited) {
    let span = '';
    if (sel.size) {
      const lo = MODAL.wordTok[Math.min(...sel)], hi = MODAL.wordTok[Math.max(...sel)];
      span = stripPunct(MODAL.tokens.slice(lo, hi + 1).join(''));
    }
    $('#modalSpan').value = span;
  }
  const ok = MODAL._edited ? !!$('#modalSpan').value.trim() : selConsecutive();
  $('#modalOk').disabled = !ok;
  $('#modalHint').textContent = ok ? ''
    : (sel.size ? 'Those words aren’t next to each other — tap the phrase you want.'
                : 'Tap the word or phrase you want.');
  const now = MODAL._firstSync; MODAL._firstSync = false;
  updatePreview(ok ? $('#modalSpan').value.trim() : '', now);
}

const PVCACHE = new Map();
function pvHtml(p) {
  const fq = p.freq;
  const fqHtml = fq && fq.label
    ? ` <span class="fq ${fq.band || ''}">${escapeHtml(fq.label)}</span>` : '';
  const norm = s => (s || '').toLowerCase().replace(/[́ё]/g, m => m === 'ё' ? 'е' : '');
  const stress = p.stressed && norm(p.stressed) !== norm(p.translation)
    ? `<div class="pv-acc">${escapeHtml(p.stressed)}</div>` : '';
  const g = p.gloss && norm(p.gloss) !== norm(p.translation)
    ? `<div class="pv-quick">${escapeHtml(p.gloss)} <span class="qtag">dict</span></div>` : '';
  return `<div class="pv"><div class="sent">${p.front_html}</div>
    ${stress}
    <div class="tr">${escapeHtml(p.translation || '')}${fqHtml}</div>
    ${g}</div>`;
}
function updatePreview(span, immediate) {
  clearTimeout(MODAL.pvTimer);
  const box = $('#modalPreview');
  if (!span) { box.innerHTML = ''; MODAL.preview = MODAL.previewFor = null; return; }
  if (MODAL.previewFor === span) return;            // already showing / fetching this
  const ck = (MODAL.textId ? 't' + MODAL.textId : CURRENT) + '|' + span + '|' + (MODAL.sentence || '');
  if (PVCACHE.has(ck)) {                            // instant on repeat
    const p = PVCACHE.get(ck);
    MODAL.preview = p; MODAL.previewFor = span;
    box.innerHTML = pvHtml(p);
    return;
  }
  MODAL.preview = null;
  if (!navigator.onLine) {
    box.innerHTML = '<div class="wait">ⓘ translation preview isn’t available offline — the card will be translated when it uploads</div>';
    return;
  }
  box.innerHTML = '<div class="wait"><span class="spin"></span> translating…</div>';
  const seq = ++MODAL.pvSeq;
  // instant best-effort gloss from the local dictionary while the LLM runs
  api('/gloss?span=' + encodeURIComponent(span)).then(g => {
    if (seq === MODAL.pvSeq && !MODAL.preview && g && g.gloss)
      box.innerHTML = `<div class="pv quick">
        <div class="tr">${escapeHtml(g.gloss)} <span class="qtag">quick</span></div>
        <div class="wait" style="margin-top:.45rem"><span class="spin"></span> full translation…</div>
      </div>`;
  }).catch(() => {});
  MODAL.pvTimer = setTimeout(async () => {
    try {
      const p = MODAL.textId
        ? await api(`/texts/${MODAL.textId}/translate`, {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ span, sentence: MODAL.sentence }) })
        : await api('/translate', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ video_id: CURRENT, span,
              subtitle_line_id: MODAL.lineId ?? null,
              timestamp: MODAL.timestamp, sentence: MODAL.sentence }) });
      PVCACHE.set(ck, p);
      if (seq !== MODAL.pvSeq) return;              // superseded
      MODAL.preview = p; MODAL.previewFor = span;
      box.innerHTML = pvHtml(p);
    } catch (e) {
      if (seq === MODAL.pvSeq)
        box.innerHTML = `<div class="wait">couldn’t preview (${escapeHtml(e.message)}) — card will still translate on save</div>`;
    }
  }, immediate ? 0 : 200);
}

function closeCardModal(resume = true) {
  const wasWatch = MODAL && MODAL.watchCue != null;
  if (MODAL) clearTimeout(MODAL.pvTimer);
  $('#modalWrap').hidden = true;

async function confirmCard() {

      markReadCarded(r.span_text || span);

    api(`/videos/${vid}/make-card`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ span: tappedSpan, subtitle_line_id: lineId, sentence,
        span_text: pv ? pv.span_text : null,
        translation: pv ? pv.translation : null,
        is_phrase: pv ? pv.is_phrase : null }),
    }).then(r => { toast(`✓ ${r.span_text} — ${r.translation || ''}`);
      refreshReader(); refreshStudyBanner(); })
      .catch(e => toast('couldn’t make card — ' + e.message, 3500));
    return;
  }

  const item = {
    client_id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6),
    video_id: CURRENT, span,
    subtitle_line_id: MODAL.lineId ?? null,
    timestamp: MODAL.timestamp,
    sentence: pv ? pv.sentence : MODAL.sentence,
    span_text: pv ? pv.span_text : null,
    translation: pv ? pv.translation : null,
    is_phrase: pv ? pv.is_phrase : null,
    created_at: Date.now(),
  };
  closeCardModal(false);
  await idbPut('queue', item.client_id, item);
  await refreshQueuePill();
  toast(pv ? `carded: ${pv.span_text} — ${pv.translation}`
           : (navigator.onLine ? 'card queued' : 'saved — translates when online'));
  flushQueue();

  if (watchCue != null && WP) {
    // replay the line you just carded
    wPausedForModal = false;
    markWordCarded(span);
    try { WP.seek(WCUES[watchCue].s); WP.play(); } catch {}
  } else {
    $('#q').value = ''; $('#results').innerHTML = '';   // clear the search
  }
}

function hms(sec) {

async function openWatch(id, seekTo) {

    startPlayer(id, resumeAt);

    prepAudio(id);   // ready an audio source so backgrounding keeps playing
  }
}

function hmsToSec(hms) {
  const p = String(hms || '').split(':').map(Number);

       : p.length === 2 ? p[0] * 60 + p[1] : (p[0] || 0);
}

let STUDY = null;   // { queue:[cardview], i, revealed, shownAt, history:[id], done }

function etaText(seconds) {
  const m = Math.round(seconds / 60);
  if (m < 1) return 'under a min';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60);
  return h + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
}

async function refreshStudyBanner() {

const SRS_MEDIA_CACHE = 'ru-anki-srs-media';
let _bundleSyncAt = 0, _bundleSyncing = false;
/* Pull the next few days of due cards + their audio clips onto the device so a
   review session runs with no connection. Safe to call often — throttled. */
async function syncOfflineSRS(force) {
  if (_bundleSyncing || !navigator.onLine) return;
  if (!force && Date.now() - _bundleSyncAt < 15 * 60 * 1000) return;
  _bundleSyncing = true;
  try {
    const b = await api('/srs/offline?days=2');
    _bundleSyncAt = Date.now();
    await idbPut('srsCache', 'bundle', b).catch(() => {});
    const { cards: _c, media: _m, ...st } = b;
    await idbPut('srsCache', 'stats', st).catch(() => {});
    if (!('caches' in window)) return;
    const cache = await caches.open(SRS_MEDIA_CACHE);
    const want = new Set((b.media || []).slice(0, 200));   // ~100 cards, earliest-due first
    const existing = await cache.keys();
    const have = new Set(existing.map(r => { const u = new URL(r.url); return u.pathname + u.search; }));
    for (const r of existing) {                 // drop clips we no longer need
      const u = new URL(r.url); const k = u.pathname + u.search;
      if (!want.has(k)) cache.delete(r);
    }
    let n = 0;
    for (const u of want) {
      if (have.has(u)) continue;
      try { await cache.add(u); } catch {}
      if (++n % 6 === 0) await sleep(120);
    }
  } catch { /* offline or server down — try again later */ }
  finally { _bundleSyncing = false; }
}

async function flushSrs() {
  let items;
  try { items = await idbAll('srsOut'); } catch { return; }
  if (!items || !items.length) return;
  try {
    await api('/srs/reviews/flush', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ reviews: items.map(i => ({ card_id: i.card_id, rating: i.rating,
        elapsed_ms: i.elapsed_ms, reviewed_at: i.reviewed_at })) }),
    });
    for (const i of items) await idbDel('srsOut', i.client_id);
  } catch { /* still offline — try again next time */ }
}

function clipUrl(c) {
  if (!c) return null;
  if (c.clip) return c.clip;                    // exact string the offline bundle pre-cached
  return c.seconds != null && c.video_id != null
    ? `/videos/${c.video_id}/clip?t=${Math.round(c.seconds)}&w=${encodeURIComponent(c.normalized_text || '')}` : null;
}
let STUDY_AUDIO_FIRST = (() => { try { return localStorage.getItem('studyAudioFirst') === '1'; } catch { return false; } })();
function setAudioFirst(on) {
  STUDY_AUDIO_FIRST = on;
  try { localStorage.setItem('studyAudioFirst', on ? '1' : '0'); } catch {}
}
function playStudyAudio() {
  const a = $('#studyAudio');
  if (a) { a.currentTime = 0; a.play().catch(() => {}); }
}
function prefetchStudyNext() {
  const nx = STUDY && STUDY.queue[STUDY.i + 1];
  const u = clipUrl(nx);
  if (u) fetch(u).catch(() => {});
  if (nx && nx.seconds != null) fetch(`/videos/${nx.video_id}/frame?t=${Math.round(nx.seconds)}`).catch(() => {});
}

function renderStudyCard() {
  const c = studyCard();
  $('#studyUndo').disabled = !STUDY.history.length;
  $('#studyDelete').disabled = !c;
  $('#studyEdit').disabled = !c;
  if (!c) return renderStudyDone();
  STUDY.revealed = false;
  STUDY.shownAt = Date.now();
  const left = STUDY.queue.length - STUDY.i;
  // pace: this session's real rate once there's enough of it, else the rolling median
  const pace = (STUDY.done >= 5 && STUDY.startedAt)
    ? (Date.now() - STUDY.startedAt) / 1000 / STUDY.done
    : (STUDY.paceS || 6);
  const eta = left > 1 ? ` · ~${etaText(left * pace)} left` : '';
  $('#studyProg').innerHTML = `<b>${STUDY.done}</b> done · ${left} left${eta}${STUDY.offline ? ' · <span style="color:var(--muted)">offline</span>' : ''}`;
  const cu = clipUrl(c);
  const audioFirst = STUDY_AUDIO_FIRST && cu;
  const q = audioFirst
    ? `<div class="study-listen">
         <audio id="studyAudio" src="${cu}" preload="auto"></audio>
         <button class="listen-btn" onclick="event.stopPropagation();playStudyAudio()">🔊 listen</button>
         <div class="listen-hint">tap anywhere to reveal</div>
       </div>`
    : `<div class="study-q">${c.front_html}</div>`;
  $('#studyBody').innerHTML = `
    <div class="study-scroll study-tap" onclick="studyReveal()">${q}</div>
    <div class="study-foot"><button class="study-show" onclick="studyReveal()">Show answer</button></div>`;
  if (audioFirst) playStudyAudio();
  prefetchStudyNext();
}

function studyReveal() {
  const c = studyCard();
  if (!c) return;
  STUDY.revealed = true;
  const p = c.preview || {};
  const cu = clipUrl(c);
  const clip = c.seconds != null ? `
    <button class="a-clip" onclick="studyJump(${c.video_id}, ${c.seconds})">
      <img loading="lazy" src="/videos/${c.video_id}/frame?t=${Math.round(c.seconds)}" alt=""
           onerror="this.closest('.a-clip').classList.add('noimg')">
      <span class="a-play">▶ ${fmtTime(c.seconds)}${c.video_title ? ' · ' + escapeHtml(c.video_title) : ''}</span>
    </button>` : '';
  $('#studyBody').innerHTML = `
    <div class="study-scroll">
      <div class="study-q" style="font-size:1.05rem;margin:0;color:var(--muted)">${c.front_html}</div>
      <div class="study-a">
        ${cu ? `<audio id="studyAudio" src="${cu}" preload="auto"></audio>
                <button class="a-replay" onclick="playStudyAudio()">🔊 replay line</button>` : ''}
        <div class="a-tr">${escapeHtml(c.translation || '—')}</div>
        ${c.accented ? `<div class="a-acc">${escapeHtml(c.accented)}</div>` : ''}
        ${clip}
        <div class="a-links"><button onclick="studyOpenWord('${encodeURIComponent(c.normalized_text)}')">all places “${escapeHtml(c.span_text)}” is said →</button></div>
      </div>
    </div>
    <div class="study-foot"><div class="study-rate">
      <button class="again" onclick="studyRate(1)"><span class="rl">Again</span><span class="ri">${p[1] || ''}</span></button>
      <button class="good" onclick="studyRate(3)"><span class="rl">Good</span><span class="ri">${p[3] || ''}</span></button>
      <button onclick="studyRate(4)"><span class="rl">Easy</span><span class="ri">${p[4] || ''}</span></button>
    </div></div>`;
  if (cu && !STUDY_AUDIO_FIRST) playStudyAudio();   // in audio-first it already played on the question
}

async function studyRate(rating) {
  const c = studyCard();
  if (!c || STUDY._busy) return;
  STUDY._busy = true;
  $('#studyBody').querySelectorAll('.study-rate button').forEach(b => b.disabled = true);
  const elapsed = Date.now() - STUDY.shownAt;
  let queuedOffline = false;
  try {
    await api(`/srs/cards/${c.id}/review`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ rating, elapsed_ms: elapsed }),
    });
  } catch (e) {
    const off = NET === 'offline' || NET === 'noserver' || navigator.onLine === false
      || /network|failed to fetch|load failed|timed out/i.test(e.message || '');
    if (!off) { toast('review failed — ' + e.message, 3000); STUDY._busy = false;
      $('#studyBody').querySelectorAll('.study-rate button').forEach(b => b.disabled = false); return; }
    const cid = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await idbPut('srsOut', cid, { client_id: cid, card_id: c.id, rating,
      elapsed_ms: elapsed, reviewed_at: new Date().toISOString() }).catch(() => {});
    queuedOffline = true;
    STUDY.offline = true;
  }
  STUDY.history.push({ card: c, rating, offline: queuedOffline });
  if (!STUDY.startedAt) STUDY.startedAt = STUDY.shownAt || Date.now();
  STUDY.done++;
  STUDY.queue.splice(STUDY.i, 1);
  if (rating === 1) STUDY.queue.push(c);   // "Again" — see it again later this session
  else if (STUDY.i >= STUDY.queue.length) STUDY.i = 0;
  STUDY._busy = false;
  if (!STUDY.queue.length && !STUDY.offline) await loadStudyQueue();
  else renderStudyCard();
  refreshStudyBanner();
  refreshQueuePill();
}

function studyEditCard() {
  const c = studyCard();
  if (!c) return;
  openCardList('all', 'Edit card', c.span_text, c.id);
}

async function studyDelete() {
  const c = studyCard();
  if (!c || STUDY._busy) return;
  if (!confirm(`Delete this card for “${c.span_text}”?\n\nIt won’t be suggested again (add it later from the word page if you change your mind).`)) return;
  STUDY._busy = true;
  try { await api(`/srs/cards/${c.id}`, { method: 'DELETE' }); }
  catch (e) { toast('couldn’t delete — ' + e.message, 3000); STUDY._busy = false; return; }
  STUDY._busy = false;
  STUDY.queue = STUDY.queue.filter(x => x.id !== c.id);
  STUDY.history = STUDY.history.filter(h => h.card.id !== c.id);
  if (STUDY.i >= STUDY.queue.length) STUDY.i = 0;
  toast('card deleted', 1800);
  if (!STUDY.queue.length && !STUDY.offline) loadStudyQueue(); else renderStudyCard();
  refreshStudyBanner();
}

async function studyUndo() {
  if (!STUDY || !STUDY.history.length) return;
  const h = STUDY.history[STUDY.history.length - 1];
  const id = h.card.id;
  let card = h.card;
  if (h.offline) {
    const pend = (await idbAll('srsOut').catch(() => []))
      .filter(x => x.card_id === id).sort((a, b) => (a.reviewed_at < b.reviewed_at ? 1 : -1))[0];
    if (pend) await idbDel('srsOut', pend.client_id).catch(() => {});
  } else {
    try { const d = await api(`/srs/cards/${id}/undo`, { method: 'POST' }); card = d.card || h.card; }
    catch (e) { toast('couldn’t undo — need a connection', 2500); return; }
  }
  STUDY.history.pop();
  STUDY.done = Math.max(0, STUDY.done - 1);
  STUDY.queue = STUDY.queue.filter(x => x.id !== id);
  STUDY.queue.unshift(card);
  STUDY.i = 0;
  renderStudyCard();
  studyReveal();          // show it answered so they can re-grade
  refreshStudyBanner();
  refreshQueuePill();
}

function studyJump(videoId, secs) {
  CURRENT = videoId;
  DETAIL_V = VIDEOS.find(x => x.id === videoId) || { id: videoId };
  openWatch(videoId, Math.max(0, secs - 1.5));   // #studyView stays underneath; back returns to it
}
function studyOpenWord(enc) { openWord(decodeURIComponent(enc)); }

                 onchange="setNewPerDay(this.value)"></label>
        <label class="study-set"><input type="checkbox" ${STUDY_AUDIO_FIRST ? 'checked' : ''}

async function setDualWrite(on) {
  try { await api('/settings', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ key: 'anki_dual_write', value: on }) });
    toast(on ? 'new cards will also go to Anki' : 'new cards stay in-app only', 2600);
  } catch (e) { toast('couldn’t save — ' + e.message, 3000); }
}
async function setNewPerDay(v) {
  const n = Math.max(0, Math.min(999, parseInt(v, 10) || 0));
  try { await api('/settings', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ key: 'new_per_day', value: n }) });
    toast(`${n} new cards/day`, 2000); refreshStudyBanner();

}

/* ---- progress / stats ---- */
async function openStats() {
  $('#statsView').hidden = false;
  $('#statsBody').innerHTML = SPINNER;
  let d;
  try { d = await api('/srs/analytics'); }
  catch (e) { $('#statsBody').innerHTML = `<div class="empty">couldn’t load — ${escapeHtml(e.message)}</div>`; return; }
  renderStats(d);
}
function closeStats() { $('#statsView').hidden = true; }
function renderStats(d) {
  const cn = d.counts, mx = cn.total || 1;
  const max = Math.max(1, ...d.reviews_by_day.map(x => x.count));
  const bars = d.reviews_by_day.map(x =>
    `<i class="${x.count ? '' : 'z'}" style="height:${Math.round(x.count / max * 100)}%" title="${x.date}: ${x.count}"></i>`).join('');
  const first = d.reviews_by_day[0].date.slice(5), last = d.reviews_by_day[d.reviews_by_day.length - 1].date.slice(5);
  const seg = (n, cls) => n ? `<i class="${cls}" style="flex:${n}"></i>` : '';
  const cell = (v, k, filt, title) => `<div class="stat-cell${filt ? ' tap' : ''}"${filt ? ` onclick="openCardList('${filt}','${title}')"` : ''}><div class="v">${v}</div><div class="k">${k}</div></div>`;
  $('#statsBody').innerHTML = `
    <div class="stat-grid">
      ${cell(d.streak, 'day streak', '', '')}
      ${cell(d.reviews_today, 'reviews today', 'today', 'Reviewed today')}
      ${cell(d.retention != null ? Math.round(d.retention * 100) + '%' : '—', 'retention', '', '')}
      ${cell(cn.total, 'cards', 'all', 'All cards')}
      ${cell(cn.mature, 'mature', 'mature', 'Mature')}
      ${cell(d.total_reviews, 'reviews', 'reviewed', 'Reviewed')}
    </div>
    <div class="stat-h">reviews · last ${d.reviews_by_day.length} days</div>
    <div class="cal">${bars}</div>
    <div class="cal-x"><span>${first}</span><span>${last}</span></div>
    <div class="stat-h">collection</div>
    <div class="mix">
      ${seg(cn.new, 'mnew')}${seg(cn.learning, 'mlearn')}
      ${seg(cn.review - cn.mature, 'mrev')}${seg(cn.mature, 'mmat')}
    </div>
    <div class="mix-legend">
      <span class="lnew tap" onclick="openCardList('new','New')">${cn.new} new</span>
      <span class="llearn tap" onclick="openCardList('learning','Learning')">${cn.learning} learning</span>
      <span class="lrev tap" onclick="openCardList('young','Young')">${Math.max(0, cn.review - cn.mature)} young</span>
      <span class="lmat tap" onclick="openCardList('mature','Mature')">${cn.mature} mature</span>
      ${cn.suspended ? `<span class="tap" onclick="openCardList('suspended','Suspended')">${cn.suspended} suspended</span>` : ''}
    </div>`;
}

/* ---- card list ---- */
let CL = { filter: 'all', title: 'Cards', autoEdit: null };
function openCardList(filter, title, search, autoEditId) {
  CL = { filter, title: title || 'Cards', autoEdit: autoEditId || null };
  $('#clTitle').textContent = CL.title;
  $('#clSearch').value = search || '';
  $('#cardsView').hidden = false;
  loadCardList();
}
function closeCardList() { $('#cardsView').hidden = true; }
let _clTimer = null;
function clSearchDebounced() { clearTimeout(_clTimer); _clTimer = setTimeout(loadCardList, 300); }
async function loadCardList() {
  $('#clBody').innerHTML = SPINNER;
  const q = $('#clSearch').value.trim(), sort = $('#clSort').value;
  let d;
  try { d = await api(`/srs/cards?filter=${encodeURIComponent(CL.filter)}&sort=${sort}&q=${encodeURIComponent(q)}`); }
  catch (e) { $('#clBody').innerHTML = `<div class="empty">couldn’t load — ${escapeHtml(e.message)}</div>`; return; }
  renderCardList(d);
}
function renderCardList(d) {
  if (!d.cards.length) { $('#clBody').innerHTML = '<div class="empty">no cards</div>'; return; }
  const rows = d.cards.map(c => {
    const badge = c.suspended ? '<span class="cl-badge">suspended</span>'
      : c.is_new ? '<span class="cl-badge new">new</span>'
      : c.overdue ? '<span class="cl-badge due">due</span>'
      : c.due_in ? `<span class="cl-badge">${c.due_in}</span>` : '';
    const warn = c.bolded ? '' : '<span class="cl-badge due" title="target word not bolded">⚠</span>';
    const jump = c.seconds != null && c.video_id != null
      ? `<button class="cl-jump" onclick="event.stopPropagation();clJump(${c.video_id},${c.seconds})">▶ watch</button>` : '';
    return `<div class="cl-row" data-id="${c.id}" data-name="${escapeHtml(c.span_text)}">
      <div class="cl-del-rail">delete</div>
      <div class="cl-inner">
        <div class="cl-top">
          <span class="cl-w${c.suspended ? ' sus' : ''}">${escapeHtml(c.span_text)}</span>
          <span class="cl-tr">${escapeHtml(c.translation || '')}</span>${warn}${badge}
        </div>
        <div class="cl-exp">
          <div class="cl-sent">${c.front_html || ''}</div>
          ${c.accented ? `<div class="cl-acc">${escapeHtml(c.accented)}</div>` : ''}
          <div class="cl-acts">
            ${jump}
            <button onclick="event.stopPropagation();clEdit(${c.id})">✏️ edit</button>
            <button onclick="event.stopPropagation();clSuspend(${c.id},${c.suspended ? 0 : 1})">${c.suspended ? 'unsuspend' : 'suspend'}</button>
            <button class="cl-del" onclick="event.stopPropagation();clDelete(${c.id})">delete</button>
          </div>
          <div class="cl-edit">
            <label>word / phrase<input class="ce-span" value="${escapeHtml(c.span_text)}"></label>
            <label>sentence<textarea class="ce-sent" rows="2">${escapeHtml(c.sentence || '')}</textarea></label>
            <label>translation<input class="ce-tr" value="${escapeHtml(c.translation || '')}"></label>
            <div class="cl-acts">
              <button onclick="event.stopPropagation();clSaveEdit(${c.id})" class="ce-save">save</button>
              <button onclick="event.stopPropagation();this.closest('.cl-row').classList.remove('editing')">cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  const orphanBar = (CL.filter === 'orphan' && d.total)
    ? `<div class="cl-orphan-bar">These cards' source video was deleted — no jump-to-the-moment, clip or context.
         <button onclick="purgeOrphans()">Delete all ${d.total}</button></div>` : '';
  $('#clBody').innerHTML = `${orphanBar}<div class="cl-count">${d.shown} of ${d.total}${d.shown < d.total ? ' (refine to see more)' : ''}</div>${rows}`;
  attachCardListSwipe();
  if (CL.autoEdit) { const id = CL.autoEdit; CL.autoEdit = null; clEdit(id);
    const r = $('#clBody').querySelector(`.cl-row[data-id="${id}"]`); if (r) r.scrollIntoView({ block: 'center' }); }
}
function clEdit(id) {
  const row = $('#clBody').querySelector(`.cl-row[data-id="${id}"]`);
  if (row) { row.classList.add('open', 'editing'); row.querySelector('.ce-sent').focus(); }
}
async function clSaveEdit(id) {
  const row = $('#clBody').querySelector(`.cl-row[data-id="${id}"]`);
  if (!row) return;
  const btn = row.querySelector('.ce-save'); btn.disabled = true;
  const body = {
    span_text: row.querySelector('.ce-span').value.trim(),
    sentence: row.querySelector('.ce-sent').value.trim(),
    translation: row.querySelector('.ce-tr').value.trim(),
  };
  let d;
  try { d = await api(`/srs/cards/${id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); }
  catch (e) { btn.disabled = false; toast('couldn’t save — ' + e.message, 3000); return; }
  row.querySelector('.cl-w').textContent = d.span_text;
  row.querySelector('.cl-tr').textContent = d.translation || '';
  row.querySelector('.cl-sent').innerHTML = d.front_html;
  row.dataset.name = d.span_text;
  const w = row.querySelector('.cl-top .cl-badge.due');
  if (d.bolded && w && w.textContent === '⚠') w.remove();
  row.classList.remove('editing');
  toast(d.bolded ? 'saved' : 'saved — still not bolded, check the word', d.bolded ? 1400 : 3000);
}
async function purgeOrphans() {
  if (!confirm('Delete every study card whose source video was removed? This can’t be undone.')) return;
  try {
    const r = await api('/srs/cards/orphans/delete', { method: 'POST' });
    toast(`deleted ${r.deleted} card${r.deleted === 1 ? '' : 's'}`);
    refreshStudyBanner();
    loadCardList();
  } catch (e) { toast('couldn’t — ' + e.message, 2500); }
}
function clJump(vid, secs) {
  CURRENT = vid; DETAIL_V = VIDEOS.find(x => x.id === vid) || { id: vid };
  $('#cardsView').hidden = true; $('#statsView').hidden = true;
  openWatch(vid, Math.max(0, secs - 1.5));
}
async function clSuspend(id, on) {
  try { await api(`/srs/cards/${id}/suspend?on=${on ? 'true' : 'false'}`, { method: 'POST' }); loadCardList(); }
  catch (e) { toast('couldn’t — ' + e.message, 2500); }
}
async function clDelete(id, needConfirm) {
  const row = $('#clBody') && $('#clBody').querySelector(`.cl-row[data-id="${id}"]`);
  const name = row ? row.dataset.name : 'this word';
  if (needConfirm && !confirm(`Delete the card for “${name}”? It won’t be suggested again.`)) {
    if (row) row.classList.remove('swiped');
    return;
  }
  if (row) { row.style.height = row.offsetHeight + 'px'; row.classList.add('deleting'); }
  try { await api(`/srs/cards/${id}`, { method: 'DELETE' }); }
  catch (e) { toast('couldn’t delete — ' + e.message, 2500);
    if (row) { row.classList.remove('deleting', 'swiped'); row.style.height = ''; } return; }
  if (row) { requestAnimationFrame(() => { row.style.height = '0'; }); setTimeout(() => row.remove(), 200); }
  toast(`deleted “${name}”`, 1600);
  refreshStudyBanner();
}
function attachCardListSwipe() {
  const box = $('#clBody');
  if (!box || box._clw) return;
  box._clw = true;
  let row, inner, x0, y0, dx, mode, r_full = false;   // mode: null | 'h' | 'v'
  const closeAll = except => box.querySelectorAll('.cl-row.swiped').forEach(r => {
    if (r !== except) r.classList.remove('swiped');
  });
  box.addEventListener('pointerdown', e => {
    if (e.target.closest('button, .cl-del-rail, .cl-exp')) { row = null; return; }
    inner = e.target.closest('.cl-inner');
    row = inner && inner.closest('.cl-row');
    if (!row) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null;
  });
  box.addEventListener('pointermove', e => {
    if (!row) return;
    const ax = e.clientX - x0, ay = e.clientY - y0;
    if (!mode) {
      if (Math.abs(ax) < 6 && Math.abs(ay) < 6) return;
      mode = Math.abs(ax) > Math.abs(ay) ? 'h' : 'v';
      if (mode === 'h') { inner.classList.add('dragging'); try { box.setPointerCapture(e.pointerId); } catch {} closeAll(row); }
    }
    if (mode !== 'h') return;
    e.preventDefault();
    dx = Math.min(0, ax);                       // only leftward (raw)
    let shown = dx;
    if (shown < -96) shown = -96 + (shown + 96) * 0.4;   // rubber-band past the rail
    inner.style.transform = `translateX(${shown}px)`;
    r_full = dx < -innerWidth * 0.5;            // far enough = delete on release
    inner.classList.toggle('will-del', r_full);
  });
  const end = e => {
    if (!row) return;
    const r = row, inn = inner; row = null;
    inn.classList.remove('dragging', 'will-del');
    inn.style.transform = '';
    try { box.releasePointerCapture(e.pointerId); } catch {}
    if (mode === 'h') {
      if (r_full) { r.classList.add('swiped'); clDelete(+r.dataset.id, false); }
      else if (dx < -52) r.classList.add('swiped');   // settle open, rail showing
      else r.classList.remove('swiped');
      r_full = false;
    } else if (mode === null) {                   // a tap
      if (r.classList.contains('swiped')) r.classList.remove('swiped');
      else r.classList.toggle('open');
    }
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
  box.addEventListener('click', e => {           // tap the revealed rail = delete

  if (cur && $('#capOverlay').textContent !== 'tap to play') {
    const hold = Math.min(5.5, Math.max(2, (cur.re || cur.e) - cur.s + 1));
    const past = WP.time() > cur.s + hold;
    if (past && !capHidden) { renderCaption(-1); capHidden = true; }
    else if (!past && capHidden) { renderCaption(wActive); capHidden = false; }
  }

  const idx = cueIdxAt(WP.time());
  if (idx === wActive) return;
  wActive = idx;
  capHidden = false;
  const c = $('#capOverlay');
  if (c.textContent !== 'tap to play') renderCaption(idx);
  const box = $('#transcript');
  box.querySelectorAll('.cue.on').forEach(e => e.classList.remove('on'));
  if (idx < 0) return;
  const el = box.querySelector(`.cue[data-i="${idx}"]`);

    const line = document.createElement('div');

    };
    (cue.words || []).forEach((w, wi) => {
      const sp = document.createElement('span');
      sp.className = 'cw' + (w.c ? ' has-card' : (w.p ? ' pending' : ''));
      if (w.p) sp.dataset.cand = w.p;

      sp.textContent = w.t;

/* drag across words in the transcript → highlight the phrase, translate + card it */
let _phraseSel = null, _phraseDoneAt = 0;

function attachTranscriptSelect(box) {
  box = box || $('#transcript');
  if (!box || box._selWired) return;
  box._selWired = true;
  const wc = box.id === 'readBody' ? '.rw' : '.cw';
  const wordAt = (x, y) => {
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest(wc) : null;
  };
  const reader = box.id === 'readBody';
  box.addEventListener('pointerdown', e => {
    const sp = e.target.closest && e.target.closest(wc);

                   active: false, pid: e.pointerId };
  });

      const fastVert = dt < 160 && Math.abs(dy) > 22 && Math.abs(dy) > Math.abs(dx) * 1.4;
      // reader: only a quick vertical flick is "scroll" (so you can drag-select
      // down across lines); transcript: any early-vertical move is scroll
      if (reader ? fastVert : (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx))) {

    }

  });

    try { box.releasePointerCapture(_phraseSel.pid); } catch {}
    if (wasActive) {
      const range = phraseSelRange();
      clearPhraseSel();
      _phraseSel = null;

      if (range && range.words.length >= 2) openPhraseCard(range);

    const cue = WCUES[ci]; const cw = (cue && cue.words) || []; if (!cw.length) continue;
    const lo = ci === aci ? awi : 0;
    const hi = ci === bci ? bwi : (cw.length - 1);

}

  const cs = range.startCi, ce = range.endCi;

    .filter(c => c && c.text).map(c => c.text).join(' ');

let _transRange = null;

                  WCUES[ci].words[wi].t);

function markWordCarded(span) {

    if (hit(sp.textContent)) sp.classList.add('has-card');

/* route a tapped word to the right action */
function wordAction(w, sp, ci, wi) {
  if (w.p && !w.c) return inlineDecide(w.p, sp);
  if (w.cc) return inlineUndo(w.cc, sp, 'carded', w.tr);
  if (w.dd && !w.c) return inlineUndo(w.dd, sp, 'skipped', w.tr);
  if (w.c) return inlineGreen(w, sp, ci, wi);   // globally green, no candidate here

    `<button class="id-no" onclick="greenDiscard()">not learning</button>
     <button class="id-yes" onclick="greenCard()">✎ card</button>`);

    const tr = d && (d.translation || d.gloss);

  catch (e) { toast('couldn’t update — ' + e.message, 3000); return; }

/* ---- inline approve/deny for a suggested (pending) card ---- */
function inlineDecide(candId, anchor) {

    toast('reopen the video to review this one');

  }
  const fq = cand.freq;
  $('#inlineDecide').dataset.cand = candId;
  _openInlinePop(anchor, cand.span, cand.tr ? '— ' + cand.tr : '',
    fq && fq.label ? `<span class="fq ${fq.band || ''}">${escapeHtml(fq.label)}</span>` : '',
    `<button class="id-no" onclick="inlineCommit('no')">✕ skip</button>
     <button class="id-yes" onclick="inlineCommit('yes')">✓ add card</button>`);
}

  const fallback = kind === 'carded' ? '— you have a card for this' : '— you skipped this';
  _openInlinePop(anchor, word, tr ? '— ' + tr : fallback, '',
    `<button class="id-no" onclick="closeInline(true)">keep</button>
     <button class="id-yes" onclick="inlineUndoCommit('${kind}')">${kind === 'carded' ? 'remove card' : 'add back to review'}</button>`);
  if (!tr) api('/words/' + encodeURIComponent(word)).then(d => {
    const t = d && (d.translation || d.gloss);

/* ================= reader (video-of-kind-text) ================= */

  if (title) {

    box.appendChild(h);

  const paras = ch.body.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const seen = new Set();
  for (const para of paras) {
    if (title && para.toLowerCase() === title.toLowerCase()) continue;
    const p = document.createElement('p');
    // split into sentences so each tapped word carries its own context
    const sents = para.match(/[^.!?…]+[.!?…]*\s*/g) || [para];
    for (const sent of sents) {
      const stext = sent.trim();
      for (const tok of sent.split(/(\s+)/)) {
        if (!tok) continue;
        if (/^\s+$/.test(tok) || !/[А-Яа-яЁёA-Za-z]/.test(tok)) {
          p.appendChild(document.createTextNode(tok));
          continue;

        const sp = document.createElement('span');

        sp.className = 'rw';

          if (READ.carded.has(core.toLowerCase().replace(/ё/g, 'е'))) sp.classList.add('carded');
          sp.onclick = () => readTapWord(sp);

/* ---------------- offline queue + flush ---------------- */
async function refreshQueuePill() {
  const nc = (await idbAll('queue')).length;
  const nr = (await idbAll('srsOut').catch(() => [])).length;
  const n = nc + nr;
  const pill = $('#queuePill');
  if (!n) { pill.hidden = true; return; }
  pill.hidden = false;
  const label = nc && nr ? `${nc} card${nc > 1 ? 's' : ''} + ${nr} review${nr > 1 ? 's' : ''}`
    : nc ? `${nc} card${nc > 1 ? 's' : ''} to upload`
    : `${nr} review${nr > 1 ? 's' : ''} to sync`;
  pill.innerHTML = flushing ? `<span class="spin"></span> syncing ${n}…` : label;
}
let flushing = false;
async function flushQueue(manual) {
  if (flushing || !navigator.onLine) { if (manual && !navigator.onLine) toast('still offline'); return; }
  const items = await idbAll('queue');
  if (!items.length) return;
  flushing = true;
  refreshQueuePill();
  try {
    const res = await api('/cards/flush', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ items })
    });
    let ok = 0, retry = 0, dropped = 0;
    const byId = Object.fromEntries(items.map(i => [i.client_id, i]));
    for (const r of res.results) {
      if (r.ok) { await idbDel('queue', r.client_id); ok++; continue; }
      // server reachable but this item failed (dup, deleted video, …).
      // keep retrying a few times, then give up so the pill can clear.
      const it = byId[r.client_id]; if (!it) continue;
      it.tries = (it.tries || 0) + 1; it.last_error = r.error;
      if (it.tries >= 4) { await idbDel('queue', r.client_id); dropped++; }
      else { await idbPut('queue', r.client_id, it); retry++; }
    }
    await refreshQueuePill();
    const bits = [];
    if (ok) bits.push(`${ok} added to Anki`);
    if (retry) bits.push(`${retry} will retry`);
    if (dropped) bits.push(`${dropped} gave up (${res.results.find(r=>!r.ok)?.error || 'error'})`);
    if (bits.length) toast(bits.join(' · '), dropped || retry ? 4000 : 2400);
  } catch (e) {
    if (manual) toast('upload failed — Anki reachable? will retry', 3000);
  } finally { flushing = false; refreshQueuePill(); }
}

/* ---------------- offline VIDEO FILE (OPFS) ---------------- */
async function opfsDir() {
  const root = await navigator.storage.getDirectory();
  return root.getDirectoryHandle('media', { create: true });
}
async function opfsSize(id) {
  try { return (await (await (await opfsDir()).getFileHandle(id + '.mp4')).getFile()).size; }
  catch { return 0; }
}
// "has" now means *fully* downloaded — a partial (resumable) file doesn't count
async function opfsHas(id) {
  const sz = await opfsSize(id);
  if (!sz) return false;
  let want = 0; try { want = +(localStorage.getItem('msz:' + id) || 0); } catch {}
  return want ? sz >= want - 4 : true;   // no stored size (old download) → trust existence
}
async function opfsURL(id) {
  const f = await (await (await opfsDir()).getFileHandle(id + '.mp4')).getFile();
  return URL.createObjectURL(f);
}
async function opfsDelete(id) {
  try { await (await opfsDir()).removeEntry(id + '.mp4'); } catch {}
}
async function rangeGet(id, start, end) {
  let err;
  for (let a = 0; a < 5; a++) {
    try {
      const res = await fetch(`/videos/${id}/media`, {
        headers: { Range: `bytes=${start}-${end}` }, cache: 'no-store' });
      if (res.status !== 206 && res.status !== 200) throw new Error('HTTP ' + res.status);
      return await res.arrayBuffer();
    } catch (e) { err = e; await sleep(700 * (a + 1)); }
  }
  throw err || new Error('range fetch failed');
}

// Save the server-side media file into OPFS in small ranged chunks. On Safari
// this uses a sync access handle so it *resumes* across an app kill; each ~6 MB
// fetch is short enough that backgrounding rarely drops one, and drops are
// retried. `onProgress(frac, bytes)`.
async function opfsSave(id, onProgress, shouldStop) {
  const CHUNK = 6 * 1024 * 1024;
  const fh = await (await opfsDir()).getFileHandle(id + '.mp4', { create: true });

  let total = 0;
  try {
    const h = await fetch(`/videos/${id}/media`, { method: 'HEAD', cache: 'no-store' });
    if (h.ok) total = +h.headers.get('content-length') || 0;
  } catch {}
  if (!total) {   // HEAD unavailable — probe with a 1-byte range, read the total off Content-Range
    try {
      const p = await fetch(`/videos/${id}/media`, { headers: { Range: 'bytes=0-0' }, cache: 'no-store' });
      const cr = p.headers.get('content-range');
      total = (cr && +cr.split('/')[1]) || +p.headers.get('content-length') || 0;
    } catch {}
  }
  if (!total) {   // last resort — one stream (the pre-existing behaviour)
    const res = await fetch(`/videos/${id}/media`);
    if (!res.ok) throw new Error('server has no file yet');
    const w = await fh.createWritable();
    const rd = res.body.getReader();
    let got = 0;
    try {
      for (;;) { const { done, value } = await rd.read(); if (done) break;
        await w.write(value); got += value.length; onProgress && onProgress(0, got); }
      await w.close();
    } catch (e) { try { await w.abort(); } catch {} throw e; }
    return got;
  }

  try { localStorage.setItem('msz:' + id, String(total)); } catch {}
  let have = await opfsSize(id);
  if (have > total) { await opfsDelete(id); have = 0; }
  if (have >= total) { onProgress && onProgress(1, have); return have; }

  let ah = null;
  try { ah = await fh.createSyncAccessHandle(); } catch {}
  logClient('opfs.save', { message: ah ? 'sync-handle' : 'writable-fallback' }, { id, total, have });

  if (ah) {                       // durable + resumable (Safari)
    try {
      have = ah.getSize();
      if (have > total) { ah.truncate(0); have = 0; }
      while (have < total) {
        if (shouldStop && shouldStop()) throw new Error('cancelled');
        const end = Math.min(have + CHUNK, total) - 1;
        const buf = await rangeGet(id, have, end);
        ah.write(new Uint8Array(buf), { at: have });
        ah.flush();
        have += buf.byteLength;
        onProgress && onProgress(have / total, have);
      }
      return have;
    } finally { try { ah.close(); } catch {} }
  }

  // fallback: one writable held open, chunked ranged fetches (each short enough
  // to survive backgrounding); resumes from the on-disk size on a retry
  const w = await fh.createWritable({ keepExistingData: true });
  try {
    await w.seek(have);
    while (have < total) {
      if (shouldStop && shouldStop()) throw new Error('cancelled');
      const end = Math.min(have + CHUNK, total) - 1;
      const buf = await rangeGet(id, have, end);
      await w.write(new Uint8Array(buf));
      have += buf.byteLength;
      onProgress && onProgress(have / total, have);
    }
    await w.close();
    return have;
  } catch (e) {
    // commit what we've written so a retry resumes from here
    try { await w.close(); } catch { try { await w.abort(); } catch {} }
    throw e;
  }
}

let mediaDL = {};      // id -> true while this tab is driving the download+save
let mediaCancel = {};  // id -> true to stop it

function renderMediaProgress(id, phase, pct, mb) {
  const row = $('#mediaRow');
  const pc = Math.max(0.8, Math.min(100, pct || 0));
  const label = phase === 'phone' ? 'saving to phone' : 'downloading on server';
  // build the bar once, then only nudge width + label so the CSS transition
  // animates smoothly between updates instead of the whole node being replaced
  if (row.dataset.mp !== id + ':' + phase || !row.querySelector('.pfill')) {
    row.dataset.mp = id + ':' + phase;
    row.innerHTML = `<div class="pbar"><div class="pfill"></div></div>
      <div class="pmeta"><span class="spin"></span> <span class="mp-l"></span>
        · <button class="backlink" onclick="cancelMedia(${id})">cancel</button></div>`;
    row.querySelector('.pfill').style.width = pc.toFixed(1) + '%';   // no 0→n jump on first paint
  }
  const f = row.querySelector('.pfill');
  // long linear glide while polling the server (~1.5s between updates),
  // snappier on device where updates are frequent
  f.style.transition = phase === 'phone'
    ? 'width .6s cubic-bezier(.3,.7,.3,1)' : 'width 2s linear';
  requestAnimationFrame(() => { f.style.width = pc.toFixed(1) + '%'; });
  row.querySelector('.mp-l').textContent =
    `${label} · ${Math.round(pc)}%${mb ? ` · ${mb} MB` : ''}`;
}
function cancelMedia(id) { mediaCancel[id] = true; }

async function renderMediaRow(id) {
  if (mediaDL[id]) return;   // an active download owns this row
  const row = $('#mediaRow');
  delete row.dataset.mp;     // any progress bar in here is stale now
  const v = VIDEOS.find(x => x.id === id) || DETAIL_V || { id };
  if (await opfsHas(id)) {
    const mb = Math.round((await opfsSize(id)) / 1e6);
    row.innerHTML = `📥 video saved (${mb} MB) — plays offline ·
      <button class="backlink" onclick="removeMedia(${id})">remove</button>`;
    return;
  }
  if (!navigator.onLine) { row.textContent = ''; return; }
  if (!window.isSecureContext || !navigator.storage || !navigator.storage.getDirectory) {
    row.innerHTML = `<span style="opacity:.7">offline video needs an https:// address —
      set up <code>tailscale serve</code> (see deploy/RELIABILITY.md)</span>`;
    return;
  }
  // already downloading somewhere (this tab, another device, a server kick)?
  let s = null;
  try { s = await api(`/videos/${id}/download`); } catch {}
  if (s && s.state === 'running') {
    renderMediaProgress(id, 'server', s.pct);
    downloadMedia(id);        // attach to it
    return;
  }
  const estMb = v.duration ? Math.round(v.duration / 60 * 3.4) : null;
  if (s && s.state === 'done') {          // on the server, not yet fully on this phone
    const part = await opfsSize(id);
    let want = 0; try { want = +(localStorage.getItem('msz:' + id) || 0); } catch {}
    if (part > 0 && want && part < want) {
      renderMediaProgress(id, 'phone', part / want * 100, Math.round(part / 1e6));
      downloadMedia(id);                  // resume automatically
      return;
    }
    row.innerHTML = `<button class="btn sm ghost" id="dlBtn" onclick="downloadMedia(${id})">
      ${DL_ICON} ${part > 0 ? 'Resume saving' : 'Save to phone'}${estMb ? ` · ~${estMb} MB` : ''}</button>`;
    return;
  }
  let q = 240; try { q = +(localStorage.getItem('dlq') || 240); } catch {}
  const perMin = { 144: 1.4, 240: 2.3, 360: 3.4 }[q] || 2.3;
  const est = v.duration ? Math.round(v.duration / 60 * perMin) : null;
  row.innerHTML = `<button class="btn sm ghost" id="dlBtn" onclick="downloadMedia(${id})">
      ${DL_ICON} Download${est ? ` · ~${est} MB` : ''}</button>
    <select class="minisel" id="dlQ" onchange="try{localStorage.setItem('dlq',this.value)}catch{};renderMediaRow(${id})"
      style="margin-left:.5rem">
      <option value="144"${q===144?' selected':''}>144p</option>
      <option value="240"${q===240?' selected':''}>240p</option>
      <option value="360"${q===360?' selected':''}>360p</option>
    </select>
    ${!v.youtube_id ? '<span class="pmeta" style="display:block;margin-top:.3rem">optional — streams fine without it; download only for offline. captions render separately so low res is OK</span>' : ''}`;
}

async function downloadMedia(id) {
  if (mediaDL[id]) return;
  mediaDL[id] = true;
  mediaCancel[id] = false;
  let q = 240; try { q = +(localStorage.getItem('dlq') || 240); } catch {}
  try {
    let s = await api(`/videos/${id}/download`).catch(() => ({ state: 'idle' }));
    if (s.state !== 'done') {              // server needs to fetch it first
      if (s.state === 'idle' || s.state === 'error') {
        renderMediaProgress(id, 'server', 0);
        s = await api(`/videos/${id}/download?q=${q}`, { method: 'POST' });
      }
      for (;;) {
        if (mediaCancel[id]) throw new Error('cancelled');
        s = await api(`/videos/${id}/download`);
        if (s.state === 'error') throw new Error(s.detail || 'server download failed');
        if (s.state === 'done') break;
        renderMediaProgress(id, 'server', s.pct);
        await sleep(2000);
      }
    }
    let last = -2;
    renderMediaProgress(id, 'phone', 0);
    await opfsSave(id, (p, bytes) => {
      const pct = p ? Math.round(p * 100) : -1;
      if (pct === last) return;
      last = pct;
      renderMediaProgress(id, 'phone', p ? p * 100 : 0, bytes ? Math.round(bytes / 1e6) : 0);
    }, () => mediaCancel[id]);
    renderMediaProgress(id, 'phone', 100);
    // cache everything else the watch view needs offline: captions, transcript, thumbnail
    try { await idbPut('offline', 'w' + id, await api(`/videos/${id}/watch`)); } catch {}
    try {
      const ld = await api(`/videos/${id}/lines`);
      await idbPut('offline', id, { video: ld.video, lines: ld.lines, savedAt: Date.now() });
      if (ld.video && ld.video.thumbnail_url) { try { await fetch(ld.video.thumbnail_url, { mode: 'no-cors' }); } catch {} }
    } catch {}
    toast('video saved — works fully offline');
    loadVideosQuiet();
  } catch (e) {
    if (/cancell?ed/i.test(e.message)) toast('download stopped — resume any time');
    else { toast('download failed: ' + e.message, 4000); logClient('download', e, { id }); }
  }
  mediaDL[id] = false;
  renderMediaRow(id);
}
async function renderTranscribeRow(id) {
  const row = $('#transcribeRow');
  if (!row) return;
  if (!navigator.onLine) { row.textContent = ''; return; }
  let s = null;
  try { s = await api(`/videos/${id}/transcribe`); } catch { row.textContent = ''; return; }
  clearTimeout(row._t);
  if (s.state === 'running') {
    row.innerHTML = `<span class="spin"></span> re-transcribing with Whisper · ${Math.round(s.pct || 0)}% — ${escapeHtml(s.detail || '')}`;
    row._t = setTimeout(() => { if (CURRENT === id) renderTranscribeRow(id); }, 4000);
    return;
  }
  if (s.state === 'done') {
    row.innerHTML = `✓ ${escapeHtml(s.detail || 're-transcribed with Whisper')}`;
    return;
  }
  const kind = (DETAIL_V && DETAIL_V.subs_kind) || 'auto';
  const err = s.state === 'error'
    ? `<span style="color:var(--no)">last run failed: ${escapeHtml(s.detail || '')}</span> · ` : '';
  row.innerHTML = `${err}captions: ${kind === 'manual' ? 'manual' : kind === 'whisper' ? 'Whisper' : 'auto'} ·
    <button class="backlink" onclick="retranscribe(${id})">re-transcribe with Whisper${kind === 'whisper' ? ' again' : ''}</button>`;
}
async function retranscribe(id) {
  if (!confirm('Re-transcribe the audio with Whisper?\n\nRuns on the Mac (no cost), ~2–4 min per 10 min of video, and replaces the current captions. Re-extract cards afterward for the cleaner text.')) return;
  try { await api(`/videos/${id}/transcribe`, { method: 'POST' }); }
  catch (e) { toast('couldn’t start: ' + e.message); return; }
  toast('transcription started — it runs in the background');
  renderTranscribeRow(id);
}
async function removeMedia(id) {
  await opfsDelete(id);
  try { localStorage.removeItem('msz:' + id); } catch {}
  try { await api(`/videos/${id}/media`, { method: 'DELETE' }); } catch {}
  toast('removed');
  renderMediaRow(id);
}

/* ---------------- tiny IndexedDB wrapper ---------------- */
let _db;
function idb() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open('ru-anki', 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      for (const s of ['offline', 'queue', 'srsCache', 'srsOut'])
        if (!db.objectStoreNames.contains(s)) db.createObjectStore(s);
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _db;
}
async function _tx(store, mode) { return (await idb()).transaction(store, mode).objectStore(store); }
function _p(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
async function idbGet(store, key) { return _p((await _tx(store, 'readonly')).get(key)); }
async function idbPut(store, key, val) { return _p((await _tx(store, 'readwrite')).put(val, key)); }
async function idbDel(store, key) { return _p((await _tx(store, 'readwrite')).delete(key)); }
async function idbAll(store) { return _p((await _tx(store, 'readonly')).getAll()); }
async function idbKeys(store) { return _p((await _tx(store, 'readonly')).getAllKeys()); }
/* cached watch/read payloads pile up in 'offline' (one per video ever opened, up
   to ~1 MB each). Keep only the most-recently-touched `keep`. */
async function pruneOfflineCache(keep = 24) {
  try {
    const keys = (await idbKeys('offline')).filter(k => typeof k === 'string' &&
      (k.startsWith('w') || k.startsWith('r')));
    if (keys.length <= keep) return;
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('offlineLRU') || '[]'); } catch {}
    const order = new Map(seen.map((k, i) => [k, i]));
    keys.sort((a, b) => (order.has(a) ? order.get(a) : 1e9) - (order.has(b) ? order.get(b) : 1e9));
    for (const k of keys.slice(keep)) await idbDel('offline', k);
  } catch {}
}
function touchOfflineLRU(key) {
  try {
    let seen = JSON.parse(localStorage.getItem('offlineLRU') || '[]');
    seen = [key, ...seen.filter(k => k !== key)].slice(0, 60);
    localStorage.setItem('offlineLRU', JSON.stringify(seen));
  } catch {}
}

/* ---------------- connectivity ---------------- */
// NET: 'ok' | 'anki' (server ok, Anki down) | 'noserver' (online but can't reach Mac)
//      | 'offline' (no internet at all) | 'checking'
let NET = 'checking', healthTimer = null;

async function probeHealth() {
  if (!navigator.onLine) { setNet('offline'); return; }
  setNet(NET === 'ok' || NET === 'anki' ? NET : 'checking');
  try {
    const r = await fetch('/health', { cache: 'no-store', signal: AbortSignal.timeout(6000) });
    if (!r.ok) throw 0;
    const h = await r.json();
    setNet(h.anki && h.anki.ok ? 'ok' : 'anki');
  } catch { setNet('noserver'); }
}
function setNet(state) {
  const changed = state !== NET;
  NET = state;
  const pill = $('#netpill'), word = $('#netword'), banner = $('#connBanner');
  pill.className = 'sub ' + ({ ok: 'ok', anki: 'warn', noserver: 'bad', offline: '', checking: '' }[state] || '');
  word.textContent = { ok: 'connected', anki: 'Anki down', noserver: 'no server',
                       offline: 'offline', checking: '…' }[state];
  const B = {
    anki: ['warn', '⚠ Connected to the Mac, but <b>Anki isn’t running</b> (or AnkiConnect isn’t installed). New cards will queue and upload once Anki is open. Tap to re-check.'],
    noserver: ['bad', '⚠ <b>Can’t reach the Mac.</b> Check: Tailscale VPN is <b>on</b> on this phone, the Mac is awake and on Tailscale, and the ru-anki server is running. Tap to re-check.'],
    offline: ['offline', 'offline'],
  }[state];
  if (B) { banner.hidden = false; banner.className = B[0]; banner.innerHTML = B[1]; }
  else banner.hidden = true;
  if (changed && state === 'ok') onReconnect();
}
function paintNet() { probeHealth(); }

function onReconnect() {
  flushQueue();
  flushSrs().then(() => { refreshQueuePill(); refreshStudyBanner(); syncOfflineSRS(true);
    if (STUDY && !$('#studyView').hidden && STUDY.offline) loadStudyQueue(); });
  if (CURRENT && !$('#detailView').hidden) { renderOfflineRow(CURRENT); loadCandidates(true); }
}
window.addEventListener('online', probeHealth);
window.addEventListener('offline', () => setNet('offline'));
document.addEventListener('visibilitychange', () => { if (!document.hidden) probeHealth(); });
window.addEventListener('focus', probeHealth);

/* ---------------- reload + back navigation ---------------- */
async function hardRefresh() {
  $('#refreshBtn').classList.add('spinning');
  try {
    if (window.caches) {
      const ks = await caches.keys();
      await Promise.all(ks.filter(k => k.startsWith('ru-anki-shell')).map(k => caches.delete(k)));
    }
    const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (r) { try { await r.update(); } catch {} }
  } catch {}
  location.reload();
}

// step back one level through the app's views; returns true if it did something
function navBack() {
  if (!$('#lyricSheet').hidden) { closeLyricSheet(); return true; }
  if (!$('#transSheet').hidden) { closeTransSheet(); return true; }
  if (!$('#inlineDecide').hidden) { closeInline(true); return true; }
  if (!$('#wordView').hidden) { closeWord(); return true; }
  if (!$('#pasteWrap').hidden) { closePaste(); return true; }
  if (!$('#modalWrap').hidden) { closeCardModal(); return true; }
  if (!$('#tocPanel').hidden) { $('#tocPanel').hidden = true; return true; }
  if (!$('#watchView').hidden) {
    if ($('#watchView').classList.contains('fs')) { fsManual = true; exitFs(); return true; }
    closeWatch(); return true;
  }
  if (!$('#vidDelView').hidden) { closeVidDelete(); return true; }
  if (!$('#cardsView').hidden) { closeCardList(); return true; }
  if (!$('#statsView').hidden) { closeStats(); return true; }
  if (!$('#readView').hidden) { closeReader(); return true; }
  if (!$('#studyView').hidden) { closeStudy(); return true; }
  if (!$('#detailView').hidden) { showList(); return true; }
  return false;
}
// trap the OS / browser back gesture so it walks back through views instead of leaving
try { history.pushState({ ru: 1 }, ''); } catch {}
addEventListener('popstate', () => { navBack(); try { history.pushState({ ru: 1 }, ''); } catch {} });

// swipe in from the very left edge of the screen = back
(() => {
  const mainEl = document.querySelector('main');
  let x0 = null, y0 = 0, live = false;
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || e.touches[0].clientX > 24) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; live = false;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (x0 === null) return;
    const t = e.touches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (!live && dx > 12 && Math.abs(dx) > Math.abs(dy) + 4) live = true;
    if (live && $('#watchView').hidden) {
      mainEl.classList.remove('edging');
      mainEl.style.transform = `translateX(${Math.min(dx, 90)}px)`;
    }
  }, { passive: true });
  addEventListener('touchend', e => {
    if (live) {
      mainEl.classList.add('edging');
      mainEl.style.transform = '';
      if (e.changedTouches[0].clientX - x0 > 70) history.back();
    }
    x0 = null; live = false;
  });
})();

/* ---------------- boot ---------------- */
// belt-and-suspenders: full-screen overlays must never be left showing
['#studyView', '#statsView', '#cardsView', '#vidDelView', '#readView', '#pasteWrap', '#tocPanel', '#transSheet', '#lyricSheet']
  .forEach(s => { const e = $(s); if (e) e.hidden = true; });

if ('serviceWorker' in navigator) {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return; reloading = true; location.reload();   // new version took over
  });
  navigator.serviceWorker.register('/sw.js').then(reg => {
    reg.update().catch(() => {});
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
}
// reader: track scroll for progress + resume
(() => {
  const b = $('#readBody');
  let t = 0;
  b.addEventListener('scroll', () => {
    updateReadProgress();
    if (Date.now() - t > 800) { t = Date.now(); readSaveProgress(); }
  }, { passive: true });
})();
addEventListener('pagehide', () => { savePos(); readSaveProgress(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    savePos(); readSaveProgress();
    // leaving the app / locking the screen: switch to background audio so it
    // keeps playing (a <video> / YouTube iframe won't survive this on iOS)
    if (!$('#watchView').hidden && !audioMode && WP && !WP.paused() && audioSrc) {
      autoSwapped = true;
      mountAudio(audioSrc, WP.time(), audioSrcIsBlob);
    }
  } else {
    // back in the app: if we auto-switched to audio, go back to the video
    if (audioMode && autoSwapped && !$('#watchView').hidden) {
      leaveAudioMode(WP ? WP.time() : 0);
    }
  }
});
$('#speeds').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  $('#speeds').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  try { WP && WP.rate(parseFloat(b.dataset.r)); } catch {}
};
// re-check the connection every 20s while the tab is visible
setInterval(() => { if (!document.hidden) probeHealth(); }, 20000);
// landscape → immersive video; portrait → back to the split view (unless toggled)
matchMedia('(orientation: landscape)').addEventListener('change', e => {
  if ($('#watchView').hidden) return;
  if (e.matches && !fsManual) enterFs();
  else if (!e.matches && !fsManual) exitFs();
  if ($('#watchView').classList.contains('fs')) bumpCtrls();
});
attachPlayerSwipe();
attachScrubber();
if (READING_ENABLED) $('#readingControls').hidden = false;
probeHealth();
refreshQueuePill();
flushQueue();
loadVideos();
setTimeout(() => syncOfflineSRS(), 4000);            // warm the offline review cache
setInterval(() => { if (!document.hidden) syncOfflineSRS(); }, 30 * 60 * 1000);
setTimeout(pruneOfflineCache, 8000);                 // keep the offline blob store bounded
</script>
