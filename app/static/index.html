<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta id="vp" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ru-anki">
<title>ru-anki</title>
<style>
  :root { color-scheme:dark;
          --bg:#101216; --fg:#ecebe7; --fg-dim:#b7bbc2; --muted:#7c828c;
          --line:#282d37; --line-soft:#20242c;
          --card:#181b21; --card-2:#20242c;
          --accent:#6aa9e0; --accent-soft:rgba(106,169,224,.15);
          --yes:#43b072; --no:#e0655b; --ok:#43b072; --okbg:#152c1e;
          --r:.7rem; --r-sm:.5rem;
          --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.22); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  ::selection { background:var(--accent-soft); }
  body { margin:0; font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); overflow-x:hidden;
         -webkit-font-smoothing:antialiased; touch-action:manipulation;  /* kill double-tap zoom everywhere */
         padding: env(safe-area-inset-top) 0 3rem; }
  a { color:var(--accent); text-decoration:none; }
  a:active { opacity:.7; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  header { padding:1.1rem 1.1rem .5rem; display:flex; align-items:baseline; gap:.55rem; }
  h1 { font-size:1.02rem; margin:0; font-weight:750; letter-spacing:-.01em; }
  header .sub { font-size:.78rem; color:var(--muted); }
  .hdr-right { margin-left:auto; align-self:center; display:flex; align-items:center; gap:.5rem; }
  .hdr-right .pill { margin-left:0; }
  .iconbtn { background:none; border:0; color:var(--muted); padding:.15rem; cursor:pointer;
             display:inline-flex; align-items:center; border-radius:var(--r-sm);
             transition:color .15s, transform .3s; }
  .iconbtn svg { width:1.2rem; height:1.2rem; fill:currentColor; display:block; }
  .iconbtn:active { color:var(--fg); }
  .iconbtn.spinning { color:var(--accent); animation:spin360 .7s linear infinite; }
  @keyframes spin360 { to { transform:rotate(360deg); } }
  main { padding:0 1.1rem; max-width:660px; margin:0 auto; }
  main.edging { transition:transform .2s ease; }

  input[type=text], input[type=search], select {
    width:100%; padding:.72rem .8rem; border:1px solid var(--line); border-radius:var(--r-sm);
    font-size:1rem; background:var(--card); color:var(--fg);
    transition:border-color .15s, box-shadow .15s; -webkit-appearance:none; appearance:none; }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none; }
  .minisel { width:auto; padding:.28rem 1.6rem .28rem .5rem; font-size:.8rem; border-radius:.45rem;
             background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                              linear-gradient(135deg,var(--muted) 50%,transparent 50%);
             background-position:calc(100% - 14px) 52%, calc(100% - 9px) 52%;
             background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  input::placeholder { color:var(--muted); }
  .addbar { display:flex; gap:.5rem; margin:.1rem 0 1rem; }
  .addbar input { flex:1; }
  .btn { padding:.7rem 1.05rem; border:1px solid var(--accent); background:var(--accent);
         color:#0b1016; font-weight:650; border-radius:var(--r-sm); font-size:.92rem;
         white-space:nowrap; cursor:pointer; transition:transform .1s, filter .15s, background .15s; }
  .btn:active { transform:scale(.985); filter:brightness(1.06); }
  .btn.ghost { background:var(--card-2); color:var(--fg-dim); border-color:var(--line); font-weight:600; }
  .btn.ghost:active { background:var(--line-soft); }
  .btn:disabled { opacity:.5; }
  .btn.sm { padding:.5rem .8rem; font-size:.85rem; }
  .btn .ic { width:1em; height:1em; fill:currentColor; vertical-align:-.14em; margin-right:.3em; }
  .backlink { background:none; border:none; color:var(--accent); font-size:.9rem;
              padding:.4rem 0; cursor:pointer; transition:opacity .15s; }
  .backlink:active { opacity:.6; }
  .backlink.danger { color:var(--no); display:block; margin:1.8rem auto .5rem; }
  .status { font-size:.82rem; color:var(--muted); margin:.4rem 0; min-height:1.1em; line-height:1.5; }
  .status:empty { margin:0; min-height:0; }
  .empty { color:var(--muted); text-align:center; padding:2.5rem 1rem; font-size:.9rem; }

  /* spinner */
  .spin { display:inline-block; width:1em; height:1em; border:2px solid currentColor;
          border-right-color:transparent; border-radius:50%;
          animation:spin .6s linear infinite; vertical-align:-.15em; }
  .spin.lg { width:1.5rem; height:1.5rem; border-width:3px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .center-spin { display:flex; justify-content:center; align-items:center; gap:.5rem;
                 padding:2rem 0; color:var(--muted); font-size:.9rem; }
  .rowhead { display:flex; align-items:baseline; justify-content:space-between; gap:.5rem;
             flex-wrap:wrap; }
  .rowhead h3 { margin:0; }
  .rowhead .backlink { font-size:.78rem; padding:0 0 0 .8rem; }
  .rvtoggle { background:none; border:none; color:var(--fg); font-size:.95rem; font-weight:700;
              padding:.1rem .1rem; cursor:pointer; letter-spacing:.01em; }
  #reviewPanel.collapsed #cards { display:none; }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration:1.2s; } }

  /* progress bar */
  .pbar { height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin:.6rem 0 .4rem; }
  .pfill { height:100%; background:var(--accent); border-radius:99px;
           transition: width .5s cubic-bezier(.3,.7,.3,1); }
  .pfill.done { background:var(--ok); }
  .pfill.err  { background:var(--no); }
  .pmeta { font-size:.78rem; color:var(--muted); }

  /* video list */
  .chan { font-size:.7rem; font-weight:700; color:var(--muted); text-transform:uppercase;
          letter-spacing:.07em; margin:1.4rem .2rem .45rem; }
  .chan:first-child { margin-top:.4rem; }
  .vcard { display:flex; gap:.75rem; align-items:flex-start; background:var(--card);
           border:1px solid var(--line-soft); border-radius:var(--r); padding:.6rem; margin:.5rem 0;
           cursor:pointer; transition: border-color .15s, background .15s, transform .1s;
           animation: cardIn .3s cubic-bezier(.2,.7,.3,1) both; }
  .vcard:active { transform:scale(.99); background:var(--card-2); border-color:var(--line); }
  .vcard.done  { border-left:3px solid var(--ok); }
  .vcard.error { border-left:3px solid var(--no); }
  .vcard img { width:118px; height:66px; object-fit:cover; border-radius:.4rem; flex:none;
               background:var(--line-soft); }
  .vcard .body { flex:1; min-width:0; }
  .vcard .vtitle { font-size:.9rem; font-weight:600; line-height:1.3; letter-spacing:-.005em; }
  .vcard .vmeta { font-size:.75rem; color:var(--muted); margin-top:.25rem; }
  .vcard .vmeta a { color:var(--fg-dim); }
  .vcard .vmeta .ext { white-space:nowrap; }
  .vcard .doneline { font-size:.78rem; color:var(--ok); font-weight:600; margin-top:.3rem; }
  .vcard.feat { flex-direction:column; gap:.55rem; align-items:stretch; padding:.65rem; }
  .vcard.feat img { width:100%; height:auto; aspect-ratio:16/9; }
  .vcard.feat .vtitle { font-size:1rem; }

  /* detail */
  .vhead { display:flex; gap:.75rem; margin:.5rem 0 .9rem; }
  .vhead img { width:118px; height:66px; object-fit:cover; border-radius:.45rem; flex:none;
               background:var(--line-soft); }
  .vhead .vtitle { font-size:.98rem; font-weight:700; line-height:1.3; letter-spacing:-.01em; }
  .vhead .vmeta { font-size:.77rem; color:var(--muted); margin-top:.3rem; }
  .vhead .vmeta a { color:var(--fg-dim); }
  .panel { background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r);
           padding:.9rem 1rem; margin:.7rem 0; }
  .panel.ok { background:var(--okbg); border-color:rgba(67,176,114,.35); }
  .panel h3 { margin:0 0 .55rem; font-size:.7rem; font-weight:700; text-transform:uppercase;
              letter-spacing:.07em; color:var(--muted); }

  .line { background:var(--card-2); border:1px solid var(--line-soft); border-radius:var(--r-sm);
          padding:.7rem .8rem; margin:.45rem 0; cursor:pointer; line-height:1.5;
          transition:border-color .15s, background .15s; }
  .line:active { border-color:var(--accent); }
  .line .t { font-size:.7rem; color:var(--muted); margin-bottom:.15rem; }
  .line b { font-weight:700; background:var(--accent-soft); color:var(--fg);
            border-radius:3px; padding:.05em .15em; }

  /* review cards */
  .card { background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r);
          padding:.95rem 1rem; margin:.65rem 0; position:relative; touch-action:pan-y;
          transition: background-color .3s ease, border-color .3s ease, box-shadow .15s;
          animation: cardIn .32s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes cardIn { from { opacity:0; transform:translateY(8px); } }
  .fq { font-weight:600; }
  .fq.mid { color:#e0913a; }
  .fq.uncommon { color:var(--muted); }
  .fq.rare { color:var(--ok); }
  .swipeflag { position:absolute; top:.65rem; font-size:.72rem; font-weight:800;
               letter-spacing:.04em; text-transform:uppercase; opacity:0;
               pointer-events:none; transition:opacity .1s; }
  .swipeflag.left  { left:.9rem;  color:var(--yes); }   /* swipe left = make card */
  .swipeflag.right { right:.9rem; color:var(--no); }    /* swipe right = discard  */
  .card.sw-yes { box-shadow:inset 0 0 0 2px var(--yes); }
  .card.sw-no  { box-shadow:inset 0 0 0 2px var(--no); }
  .card.sw-yes .swipeflag.left  { opacity:var(--sw,.4); }
  .card.sw-no  .swipeflag.right { opacity:var(--sw,.4); }
  /* flash the actioned card to a solid colour, then collapse it away */
  .card.act { color:#fff; border-color:transparent; transform:scale(1.015);
              transition: background-color .12s ease, transform .12s ease, box-shadow .12s ease; }
  .card.act.yes { background:#2f9e5e; box-shadow:0 4px 18px rgba(47,158,94,.35); }
  .card.act.no  { background:#d0463b; box-shadow:0 4px 18px rgba(208,70,59,.32); }
  .card.act .tr, .card.act .meta { color:rgba(255,255,255,.9); }
  .card.act .sent b { color:#fff; }
  .card.act .decide { opacity:0; transition:opacity .1s; }
  .card.leaving { overflow:hidden;
    transition: height .19s cubic-bezier(.4,0,.2,1), opacity .16s ease, transform .17s ease,
                padding .19s cubic-bezier(.4,0,.2,1), margin .19s cubic-bezier(.4,0,.2,1); }
  .card.leaving.yes { transform:scale(.94); }
  .card.leaving.no  { transform:translateX(16px) scale(.96); }
  .card.dup { opacity:.5; }
  .card.dup .decide .n { flex:1; border-color:var(--line); color:var(--muted); }
  .dupbadge { color:var(--muted); font-style:italic; }
  .sent { font-size:1.06rem; line-height:1.5; }
  .sent b { font-weight:750; }
  .tr { color:var(--accent); margin-top:.45rem; font-size:1rem; }
  .meta { font-size:.74rem; color:var(--muted); margin-top:.45rem; }
  .decide { display:flex; gap:.5rem; margin-top:.85rem; }
  .decide button { flex:1; padding:.68rem; border-radius:var(--r-sm); font-size:.9rem;
                   font-weight:650; border:1px solid; cursor:pointer; transition:filter .12s, transform .1s; }
  .decide button:active { transform:scale(.98); }
  .decide .y { background:var(--yes); border-color:var(--yes); color:#08160d; }
  .decide .n { background:transparent; border-color:var(--line); color:var(--fg-dim); }
  .decide .n:active { border-color:var(--no); color:var(--no); }

  .pill { margin-left:auto; border:1px solid var(--line); color:var(--fg-dim);
          background:var(--card); border-radius:999px; padding:.22rem .65rem; font-size:.73rem;
          cursor:pointer; }
  #netpill { display:inline-flex; align-items:center; gap:.35rem; padding:0; border:0; background:none; }
  .netdot { width:.5em; height:.5em; border-radius:50%; background:var(--muted);
            box-shadow:0 0 0 3px transparent; transition:box-shadow .3s; }
  #netpill.ok  .netdot { background:var(--ok); box-shadow:0 0 0 3px rgba(67,176,114,.18); }
  #netpill.warn .netdot { background:#e0913a; box-shadow:0 0 0 3px rgba(224,145,58,.18); }
  #netpill.bad .netdot { background:var(--no); box-shadow:0 0 0 3px rgba(224,101,91,.18); }
  #connBanner { position:fixed; left:0; right:0; top:0; z-index:30;
                font-size:.85rem; line-height:1.4; padding:.6rem 1rem;
                padding-top:calc(.6rem + env(safe-area-inset-top));
                text-align:center; color:#fff; cursor:pointer;
                box-shadow:0 2px 12px rgba(0,0,0,.25); }
  #connBanner[hidden] { display:none; }
  #connBanner.bad  { background:var(--no); }
  #connBanner.warn { background:#c07d2a; }
  #connBanner.offline { background:#3a3f47; font-size:.68rem; line-height:1; letter-spacing:.08em;
                        text-transform:uppercase; padding:.2rem 1rem;
                        padding-top:calc(.2rem + env(safe-area-inset-top)); box-shadow:none; }

  #modalWrap { position:fixed; inset:0; background:rgba(6,8,11,.6); z-index:20;
               align-items:center; justify-content:center; padding:1rem;
               -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #modalWrap[hidden] { display:none; }
  #modalWrap:not([hidden]) { display:flex; }
  .modal { background:var(--card-2); border:1px solid var(--line); border-radius:.85rem;
           padding:1.15rem 1.2rem; width:100%; max-width:460px; box-shadow:var(--sh);
           animation: cardIn .18s ease both; }
  .modal h3 { margin:0 0 .35rem; font-size:1rem; }
  .modalsent { font-size:1.12rem; line-height:1.85; margin:.4rem 0 .5rem; }
  .modalsent .w { padding:.08rem .18rem; border-radius:.3rem; cursor:pointer; transition:background .1s; }
  .modalsent .w.sel { background:var(--accent); color:#0b1016; }
  .modalsent .w.sel.warn { background:#e0913a; color:#1a1206; }
  .modalhint { font-size:.8rem; color:var(--no); margin:.1rem 0 .6rem; min-height:1em; }
  #modalPreview { margin:.7rem 0 .2rem; min-height:1.2em; }
  #modalPreview .pv { background:var(--bg); border:1px solid var(--line); border-radius:.55rem;
                      padding:.6rem .7rem; }
  #modalPreview .pv .sent { font-size:1rem; }
  #modalPreview .pv .sent b { font-weight:700; }
  #modalPreview .pv .tr { color:var(--accent); font-size:1rem; margin-top:.25rem; }
  #modalPreview .wait { font-size:.82rem; color:var(--muted); display:flex; gap:.4rem; align-items:center; }
  .modalbtns { display:flex; justify-content:flex-end; gap:1rem; align-items:center;
               margin-top:.8rem; }
  #modalSpan { margin-top:.2rem; }

  /* watch view */
  .watch-cta { width:100%; margin:.4rem 0 .2rem; }
  #watchView { position:fixed; inset:0; background:var(--bg); z-index:15;
               display:flex; flex-direction:column;
               padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
               touch-action:manipulation; }   /* no double-tap zoom in the player */
  #watchView button, #watchView .tap-layer, #watchView .cap-overlay,
  #watchView .capw { touch-action:manipulation; }
  #watchView .transcript { touch-action:pan-y; }
  #watchView svg { width:1.15em; height:1.15em; vertical-align:-.18em; pointer-events:none; }
  #watchView .fs-seek svg, #watchView .wctrls svg { fill:currentColor; }
  #watchView[hidden] { display:none; }
  .watchbar { display:flex; align-items:center; justify-content:space-between;
              padding:.4rem .8rem; flex:none; }
  .speeds button { background:none; border:1px solid var(--line); color:var(--muted);
                   border-radius:.45rem; padding:.22rem .5rem; font-size:.76rem; margin-left:.3rem;
                   cursor:pointer; transition:border-color .15s, color .15s; }
  .speeds button.on { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .player-wrap { position:relative; width:100%; background:#000; flex:none;
                 aspect-ratio:16/9; }
  .player-wrap #ytplayer, .player-wrap iframe, .player-wrap video { position:absolute;
                 inset:0; width:100%; height:100%; border:0; background:#000;
                 object-fit:contain; }
  .tap-layer { position:absolute; inset:0; z-index:2; background:transparent; border:0;
               cursor:pointer; }
  .wctrls { display:flex; flex-wrap:wrap; gap:.5rem; padding:.55rem .9rem; flex:none; }
  .wctrls button { flex:1; padding:.62rem; border:1px solid var(--line); background:var(--card-2);
                   color:var(--fg-dim); border-radius:var(--r-sm); font-size:.86rem; cursor:pointer;
                   display:inline-flex; align-items:center; justify-content:center; gap:.35rem;
                   transition:border-color .15s, background .15s; }
  .wctrls button:active { background:var(--line-soft); border-color:var(--accent); }
  #audioBtn { flex-basis:100%; }
  #audioBtn.on { background:var(--accent-soft); border-color:var(--accent); color:var(--fg); }

  #audioStage { display:none; }
  #watchView.audiomode #ytplayer { display:none; }
  #watchView.audiomode #audioStage {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:1.1rem; position:absolute; inset:0; z-index:1; background:#000;
      padding:1.5rem; text-align:center; }
  #audioStage img[src=""], #audioStage img:not([src]) { display:none; }
  #audioStage img { width:min(58%, 240px); border-radius:.6rem; opacity:.92; }
  #audioStage .audiolabel { color:#fff; font-size:.92rem; display:flex; flex-direction:column; gap:.25rem; }
  #audioStage .audiolabel span { color:var(--muted); font-size:.78rem; }
  .cap-overlay { position:absolute; left:0; right:0; bottom:.5rem; text-align:center;
                 z-index:3; pointer-events:none; padding:0 .7rem; color:#fff; font-weight:600;
                 text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.6); }
  .cap-overlay:not(:empty) { font-size:clamp(.95rem,4.2vw,1.35rem); line-height:1.4; }
  .cap-overlay .capw { pointer-events:auto; cursor:pointer; padding:.03em .12em; border-radius:.25rem; }
  .cap-overlay .capw.has-card { color:#8fe6b3; }
  .cap-overlay .capw.pending { background:rgba(230,185,60,.30); box-shadow:inset 0 -2px 0 #e6b93c;
                               border-radius:3px; }
  .cap-overlay .capw:active { background:var(--accent); color:#0b1016; }
  .watchhint { flex:none; text-align:center; font-size:.7rem; color:var(--muted);
               padding:.4rem 0 .3rem; }
  .watchhint .dot { display:inline-block; width:.65em; height:.65em; border-radius:50%;
                    background:var(--ok); vertical-align:-.03em; margin:0 .15em; }
  .watchhint .dot.y { background:#e6b93c; }
  .transcript { flex:1; overflow-y:auto; padding:.4rem .9rem 2.5rem;
                -webkit-overflow-scrolling:touch; }
  .transcript::-webkit-scrollbar { width:0; }
  .transcript .cue { font-size:1.05rem; line-height:1.9; padding:.4rem .5rem;
                     border-radius:var(--r-sm); color:var(--muted);
                     transition:color .2s, background .2s; }
  .transcript .cue.on { color:var(--fg); background:var(--card-2);
                        box-shadow:inset 3px 0 0 var(--accent); }
  .transcript .cue-ts { background:none; border:none; color:var(--accent);
                        font-size:.7rem; padding:0 .4rem 0 0; vertical-align:.12em; cursor:pointer; }
  .transcript .cw { cursor:pointer; padding:.02em .06em; border-radius:.25rem; }
  .transcript .cue.on .cw:active { background:var(--accent); color:#0b1016; }
  .transcript .cw.has-card { color:var(--ok); font-weight:650; }
  .transcript .cw.pending { background:rgba(230,185,60,.18); box-shadow:inset 0 -2px 0 rgba(230,185,60,.8);
                            color:var(--fg); border-radius:3px; }

  /* inline approve/deny popover for a suggested card, shown over the watch view */
  #inlineDecide { position:fixed; z-index:40; max-width:min(78vw,300px);
                  background:var(--card); border:1px solid var(--line); border-radius:var(--r-sm);
                  box-shadow:var(--sh); padding:.65rem .7rem; }
  #inlineDecide[hidden] { display:none; }
  #inlineDecide .id-head { font-size:.92rem; line-height:1.35; margin-bottom:.55rem; }
  #inlineDecide .id-head span { color:var(--muted); }
  #inlineDecide .id-btns { display:flex; gap:.5rem; }
  #inlineDecide button { flex:1; padding:.5rem .55rem; border-radius:var(--r-sm); font-size:.85rem;
                         font-weight:650; border:1px solid; cursor:pointer; }
  #inlineDecide .id-yes { background:var(--yes); border-color:var(--yes); color:#08160d; }
  #inlineDecide .id-no  { background:transparent; border-color:var(--line); color:var(--fg-dim); }
  #inlineDecide .id-no:active { border-color:var(--no); color:var(--no); }

  /* immersive / fullscreen watch — video fills the view, caption stays on top */
  #watchView.fs { padding:0; background:#000; }
  #watchView.fs .watchbar, #watchView.fs .watchhint, #watchView.fs .transcript,
  #watchView.fs .wctrls { display:none; }
  #watchView.fs .player-wrap { flex:1; aspect-ratio:auto; height:100%; }
  #watchView.fs .cap-overlay { bottom:4.4rem; }
  #watchView.fs .cap-overlay:not(:empty) { font-size:clamp(1.05rem, 3.6vh, 1.9rem); }

  /* "turn your phone" nudge — iOS can't rotate for us */
  .rotate-hint { display:none; }
  #watchView.fs.needrotate .rotate-hint {
      display:flex; flex-direction:column; align-items:center; gap:.6rem;
      position:absolute; left:50%; top:calc(env(safe-area-inset-top) + .8rem);
      transform:translateX(-50%); z-index:5; color:#fff;
      background:rgba(16,17,20,.62); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.16); border-radius:.8rem; padding:.7rem 1rem;
      font-size:.8rem; text-align:center; pointer-events:none; }
  .rotate-hint svg { width:1.6rem; height:1.6rem; fill:currentColor;
      animation:rotnudge 1.8s ease-in-out infinite; }
  @keyframes rotnudge { 0%,60%,100% { transform:rotate(0); } 30% { transform:rotate(90deg); } }

  .fs-seek, .fs-exit { display:none; }
  #watchView.fs .fs-seek {
      display:flex; align-items:center; justify-content:center; z-index:6;
      position:absolute; bottom:calc(1.1rem + env(safe-area-inset-bottom));
      width:3rem; height:3rem; border-radius:50%; color:#fff;
      background:rgba(16,17,20,.4); border:1px solid rgba(255,255,255,.14);
      -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
      box-shadow:0 6px 20px rgba(0,0,0,.35); transition:opacity .3s ease, transform .1s; }
  #watchView.fs .fs-seek svg { width:1.5rem; height:1.5rem; }
  #watchView.fs .fs-seek:active { background:var(--accent); transform:scale(.92); }
  #watchView.fs .fs-seek.prev { left:calc(1rem + env(safe-area-inset-left)); }
  #watchView.fs .fs-seek.next { right:calc(1rem + env(safe-area-inset-right)); }
  #watchView.fs .fs-exit {
      display:flex; align-items:center; justify-content:center; z-index:6; position:absolute;
      top:calc(.9rem + env(safe-area-inset-top)); right:calc(.9rem + env(safe-area-inset-right));
      width:2.6rem; height:2.6rem; border-radius:50%; color:#fff;
      background:rgba(18,18,20,.5); border:1px solid rgba(255,255,255,.18);
      -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
      box-shadow:0 4px 16px rgba(0,0,0,.3); transition:opacity .3s ease, transform .1s; }
  #watchView.fs .fs-exit svg { width:1.3rem; height:1.3rem; }
  #watchView.fs .fs-exit:active { background:var(--accent); transform:scale(.92); }
  #watchView.fs.hidectrls .fs-seek,
  #watchView.fs.hidectrls .fs-exit { opacity:0; pointer-events:none; }

  /* landscape on a phone, not fullscreen: give the video the height, transcript the rest */
  @media (orientation:landscape) and (max-height:540px) {
    #watchView:not(.fs) { flex-flow:row wrap; align-content:flex-start; }
    #watchView:not(.fs) .watchbar { flex-basis:100%; }
    #watchView:not(.fs) .player-wrap { flex:0 0 auto; height:calc(100dvh - 2.6rem);
        width:auto; max-width:72vw; }
    #watchView:not(.fs) .wctrls { position:absolute; left:0; right:auto; bottom:0;
        width:72vw; max-width:72vw; z-index:4; background:linear-gradient(transparent, rgba(0,0,0,.5)); }
    #watchView:not(.fs) .wctrls button { background:rgba(20,20,20,.55); color:#fff;
        border-color:rgba(255,255,255,.22); }
    #watchView:not(.fs) .watchhint { display:none; }
    #watchView:not(.fs) .transcript { flex:1 1 40%; height:calc(100dvh - 2.6rem); }
  }

  .toast { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%);
           background:#2f333c; color:#f1f1f1; padding:.6rem 1rem; border-radius:.5rem; font-size:.9rem;
           opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; z-index:9; }
  .toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) {
    .card, .card.leaving, .vcard { animation:none; transition:opacity .15s ease; }
    .pfill { transition:none; }
  }
</style>
</head>
<body>
<header>
  <h1>ru-anki</h1>
  <span class="sub" id="netpill"><span class="netdot"></span><span id="netword">…</span></span>
  <span class="hdr-right">
    <button class="pill" id="queuePill" hidden onclick="flushQueue(true)"></button>
    <button class="iconbtn" id="refreshBtn" aria-label="reload the app" onclick="hardRefresh()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
    </button>

</header>
<div id="connBanner" hidden onclick="probeHealth()"></div>

<main>
  <!-- LIST VIEW -->
  <div id="listView">
    <div class="addbar">
      <input type="text" id="url" placeholder="Paste a YouTube link to add"
             autocapitalize="off" autocomplete="off" spellcheck="false"
             onkeydown="if(event.key==='Enter')addVideo()">
      <button class="btn" id="addBtn" onclick="addVideo()">Add</button>
    </div>
    <div class="status">
      model
      <select id="model" class="minisel">

      </select>

    </div>

  <!-- DETAIL VIEW -->
  <div id="detailView" hidden>
    <button class="backlink" onclick="history.back()">← all videos</button>
    <div class="vhead" id="vhead"></div>
    <button class="btn watch-cta" id="watchBtn" onclick="openWatch(CURRENT)">▶ Watch with captions</button>

    <div id="progressPanel"></div>

    <div class="panel">
      <h3>Look up a word</h3>
      <input type="search" id="q" placeholder="Type part of a word you heard"
             autocapitalize="off" autocomplete="off" spellcheck="false"
             oninput="debouncedSearch()">
      <div class="status" id="liveStatus"></div>
      <div id="results"></div>
    </div>

    <div class="panel" id="reviewPanel">
      <div class="rowhead">
        <button class="rvtoggle" id="reviewHead" onclick="toggleReview()">Review</button>
        <div>
          <button class="backlink" onclick="loadCandidates(true)">reload</button>

  <!-- WATCH VIEW -->

    <div class="watchbar">

      <div class="speeds" id="speeds">
        <button data-r="0.75">0.75×</button>

      <div class="rotate-hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 21.5C4 20 1.5 16.5 1.5 12.5H0l3-3 3 3H4.5c0 3.5 2 6.4 5 7.8zM16.5 2.5C20 4 22.5 7.5 22.5 11.5H24l-3 3-3-3h1.5c0-3.5-2-6.4-5-7.8zM12 7.3l4.7 4.7L12 16.7 7.3 12z"/></svg>
        turn your phone sideways
      </div>
      <div id="audioStage">
        <img id="audioArt" alt="">
        <div class="audiolabel">🎧 background audio<span>lock the screen — it keeps playing</span></div>
      </div>
      <button class="fs-seek prev" onclick="seekLine(-1)" aria-label="previous line">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6a1 1 0 0 1 2 0v4.6l7.5-4.9A1 1 0 0 1 19 6.5v11a1 1 0 0 1-1.5.8L10 13.4V18a1 1 0 0 1-2 0z"/></svg>
      </button>
      <button class="fs-seek next" onclick="seekLine(1)" aria-label="next line">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6a1 1 0 0 0-2 0v4.6L6.5 5.7A1 1 0 0 0 5 6.5v11a1 1 0 0 0 1.5.8l7.5-4.9V18a1 1 0 0 0 2 0z"/></svg>
      </button>
      <button class="fs-exit" onclick="exitFs()" aria-label="exit full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v3a2 2 0 0 1-2 2H4M20 9h-3a2 2 0 0 1-2-2V4M4 15h3a2 2 0 0 1 2 2v3M15 20v-3a2 2 0 0 1 2-2h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="wctrls">
      <button onclick="seekLine(-1)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6a1 1 0 0 1 2 0v4.6l7.5-4.9A1 1 0 0 1 19 6.5v11a1 1 0 0 1-1.5.8L10 13.4V18a1 1 0 0 1-2 0z"/></svg> prev line</button>
      <button onclick="seekLine(1)">next line <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6a1 1 0 0 0-2 0v4.6L6.5 5.7A1 1 0 0 0 5 6.5v11a1 1 0 0 0 1.5.8l7.5-4.9V18a1 1 0 0 0 2 0z"/></svg></button>
      <button id="fsBtn" onclick="toggleFs()" title="full screen">⛶ full screen</button>
      <button id="audioBtn" onclick="toggleAudioMode()">🎧 background audio</button>
    </div>
    <div class="watchhint">tap a word to card it · <span class="dot"></span> carded · <span class="dot y"></span> suggested · tap video to pause</div>
    <div id="transcript" class="transcript"></div>
    <div id="inlineDecide" hidden>
      <div class="id-head"><b id="idSpan"></b> <span id="idTr"></span></div>
      <div class="id-btns">
        <button class="id-no" onclick="inlineCommit('no')">✕ skip</button>

</main>

<!-- CARD MODAL -->
<div id="modalWrap" hidden onclick="if(event.target===this)history.back()">
  <div class="modal">
    <h3>Make a card</h3>
    <div id="modalSent" class="modalsent"></div>

           autocapitalize="off" autocomplete="off" spellcheck="false"
           oninput="if(MODAL){MODAL._edited=true;syncModalSpan()}">

    </div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let VIDEOS = [];
let CURRENT = null;          // video id in detail view
let DETAIL_V = null;
let listTimer = null, sse = null, tickTimer = null, searchTimer = null;
// watch view
let ytPlayer = null, ytApiP = null, capTimer = null, WP = null, localURL = null;
let WDATA = null, bgAudio = null, audioMode = false, audioURL = null;
let WCUES = [], WCANDS = {}, wActive = -1, wUserScroll = 0, wPausedForModal = false;

function toast(msg, ms=2400) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms);
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}

/* ---------------- ui helpers ---------------- */
function setBusy(btn, on, label) {
  if (!btn) return;
  if (on) {
    if (btn.dataset.label == null) btn.dataset.label = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>' + (label ? ' ' + label : '');
  } else {
    btn.disabled = false;
    if (btn.dataset.label != null) { btn.innerHTML = btn.dataset.label; delete btn.dataset.label; }
  }
}
const SPINNER = '<div class="center-spin"><span class="spin lg"></span></div>';

/* ---------------- list view ---------------- */
let listedOnce = false;
async function loadVideos() {
  if (!listedOnce) $('#videoList').innerHTML = SPINNER;
  try {
    VIDEOS = await api('/videos');
    listedOnce = true;
  } catch (e) {
    const off = await idbAll('offline');
    if (off.length) {
      VIDEOS = off.map(o => ({ ...o.video, lines: o.lines.length, _offline: true }));
      $('#videoList').innerHTML = '';
      renderList();
      $('#videoList').insertAdjacentHTML('afterbegin',
        '<div class="empty">offline — showing saved videos</div>');
    } else {
      $('#videoList').innerHTML = '<div class="empty">offline — no saved videos</div>';
    }
    return;
  }
  renderList();
  const busy = VIDEOS.some(v => ['queued','running'].includes(v.extract?.state));
  clearTimeout(listTimer);
  if (busy && !CURRENT) listTimer = setTimeout(loadVideos, 3000);
}

function progressPct(ex) {
  if (!ex) return 0;
  if (ex.state === 'done') return 100;
  if (ex.state === 'error') return 100;
  if (ex.state === 'queued' || !ex.chunks_total) return 6;
  return 6 + (ex.chunks_done / ex.chunks_total) * 92;
}
function bar(ex) {
  const cls = ex.state === 'done' ? ' done' : ex.state === 'error' ? ' err' : '';
  return `<div class="pbar"><div class="pfill${cls}" style="width:${progressPct(ex)}%"></div></div>`;
}
function extractLine(ex) {
  if (ex.state === 'queued') return 'queued…';
  if (ex.state === 'running') {
    const parts = [];
    if (ex.chunks_total) parts.push(`${ex.chunks_done}/${ex.chunks_total}`);
    if (ex.added != null) parts.push(`${ex.added} words`);
    parts.push(fmtTime(ex.elapsed));
    return 'extracting · ' + parts.join(' · ');
  }
  if (ex.state === 'error') return 'failed: ' + (ex.detail || 'unknown');
  return ex.detail || '';
}

function renderList() {
  const box = $('#videoList');
  if (!VIDEOS.length) {
    box.innerHTML = '<div class="empty">No videos yet. Paste a link above to start.</div>';
    return;
  }
  box.innerHTML = '';
  const newest = VIDEOS[0];
  const h = document.createElement('div');
  h.className = 'chan'; h.textContent = 'Most recent';
  box.appendChild(h);
  box.appendChild(videoCard(newest, true));

  const groups = {};
  for (const v of VIDEOS.slice(1)) (groups[v.channel || 'Unknown channel'] ||= []).push(v);
  for (const chan of Object.keys(groups).sort((a,b) => a.localeCompare(b))) {
    const ch = document.createElement('div');
    ch.className = 'chan'; ch.textContent = chan;
    box.appendChild(ch);
    for (const v of groups[chan]) box.appendChild(videoCard(v));
  }
}

function channelLink(v) {
  const name = escapeHtml(v.channel || 'Unknown channel');
  return v.channel_url
    ? `<a class="ext" href="${escapeHtml(v.channel_url)}" target="_blank" rel="noopener">${name}</a>`
    : name;
}
function videoCard(v, feat) {
  const ex = v.extract || {state:'idle'};
  const busy = ['queued','running'].includes(ex.state);
  const el = document.createElement('div');
  el.className = 'vcard' + (feat ? ' feat' : '')
    + (ex.state === 'done' || (!busy && v.pending >= 0 && ex.state !== 'error') ? ' done' : '')
    + (ex.state === 'error' ? ' error' : '');
  const thumb = v.thumbnail_url
    ? `<img loading="lazy" src="${escapeHtml(v.thumbnail_url)}" alt="">` : '<img alt="">';
  let statusHtml;
  if (busy) {
    statusHtml = `${bar(ex)}<div class="pmeta">${extractLine(ex)}</div>`;
  } else if (ex.state === 'error') {
    statusHtml = `<div class="pmeta" style="color:var(--no)">${escapeHtml(extractLine(ex))}</div>`;
  } else {
    const rev = v.pending ? `${v.pending} to review` : 'nothing to review';
    statusHtml = `<div class="doneline">✓ ${rev} · ${v.lines} lines</div>`;
  }
  el.innerHTML = `
    ${thumb}
    <div class="body">
      <div class="vtitle">${escapeHtml(v.title || '(untitled)')}</div>
      <div class="vmeta">${channelLink(v)}
        · <a class="ext" href="${escapeHtml(v.url)}" target="_blank" rel="noopener">YouTube ↗</a></div>
      ${statusHtml}
    </div>`;
  el.querySelectorAll('.ext').forEach(a => a.onclick = e => e.stopPropagation());
  el.onclick = () => openDetail(v.id);
  return el;
}

async function addVideo() {
  const url = $('#url').value.trim();
  if (!url) return;
  setBusy($('#addBtn'), true);
  $('#addStatus').textContent = '';
  try {
    const r = await api('/videos', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({url})
    });
    $('#url').value = '';
    const m = $('#model') ? $('#model').value : 'haiku';
    await api(`/videos/${r.video_id}/extract?model=${m}`, {method:'POST'});
    await openDetail(r.video_id);   // straight into the progress view
    loadVideosQuiet();              // refresh the list in the background
  } catch (e) {
    $('#addStatus').textContent = 'error: ' + e.message;
  } finally { setBusy($('#addBtn'), false); }
}

/* ---------------- detail view ---------------- */
function showList() {
  CURRENT = null;
  if (sse) { sse.close(); sse = null; }
  clearInterval(tickTimer); tickTimer = null;
  $('#detailView').hidden = true;
  $('#listView').hidden = false;
  loadVideos();
}

async function openDetail(id) {
  CURRENT = id;
  clearTimeout(listTimer);
  $('#listView').hidden = true;
  $('#detailView').hidden = false;
  $('#q').value = ''; $('#results').innerHTML = ''; $('#liveStatus').textContent = '';
  $('#cards').innerHTML = SPINNER; $('#progressPanel').innerHTML = '';
  let v = VIDEOS.find(x => x.id === id);
  if (!v) { try { v = await api(`/videos/${id}`); } catch { v = await offlineVideoMeta(id); } }
  DETAIL_V = v || {id};
  renderVHead(DETAIL_V);
  $('#watchBtn').hidden = !navigator.onLine && !(await opfsHas(id));
  try { $('#reviewPanel').classList.toggle('collapsed', localStorage.getItem('reviewCollapsed') === '1'); } catch {}
  await renderOfflineRow(id);
  renderMediaRow(id);
  const ex = (v && v.extract) || {state:'idle'};
  if (['queued','running'].includes(ex.state) && navigator.onLine) startProgress(v, ex);
  else renderProgressDone(ex);
  loadCandidates();
}

function renderVHead(v) {
  $('#vhead').innerHTML = `
    ${v.thumbnail_url ? `<img src="${escapeHtml(v.thumbnail_url)}" alt="">` : ''}
    <div style="flex:1;min-width:0">
      <div class="vtitle">${escapeHtml(v.title || '')}</div>
      <div class="vmeta">${channelLink(v)} · ${v.lines || 0} lines
        · <a href="${escapeHtml(v.url)}" target="_blank" rel="noopener">YouTube ↗</a></div>
    </div>`;
}

let progClientStart = 0;
function startProgress(v, ex) {
  progClientStart = Date.now() - (ex.elapsed || 0) * 1000;
  paintProgress(ex);
  if (sse) sse.close();
  sse = new EventSource(`/videos/${v.id}/extract/events`);
  sse.onmessage = e => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    if (d.state === 'idle') { sse.close(); sse = null; return; }
    if (d.elapsed) progClientStart = Date.now() - d.elapsed * 1000;
    paintProgress(d);
    if (d.added != null && d.added !== (v._lastAdded || 0)) { v._lastAdded = d.added; loadCandidates(); }
    if (d.state === 'done' || d.state === 'error') {
      sse.close(); sse = null;
      clearInterval(tickTimer); tickTimer = null;
      loadCandidates();
      loadVideosQuiet();
    }
  };
  sse.onerror = () => { /* EventSource auto-retries */ };
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    const el = $('#pElapsed');
    if (el) el.textContent = fmtTime((Date.now() - progClientStart) / 1000);
  }, 1000);
}
function paintProgress(ex) {
  const panel = $('#progressPanel');
  if (ex.state === 'done' || ex.state === 'error') { renderProgressDone(ex); return; }
  const starting = ex.state === 'queued' || !ex.chunks_total;
  panel.innerHTML = `
    <div class="panel">
      <h3><span class="spin"></span> ${starting ? 'Reading the video…' : 'Finding vocabulary'}</h3>
      ${bar(ex)}
      <div class="pmeta">
        ${ex.chunks_total ? `${ex.chunks_done}/${ex.chunks_total} sections · ` : ''}
        <b>${ex.added || 0}</b> words found ·
        <span id="pElapsed">${fmtTime(ex.elapsed)}</span>
      </div>
    </div>`;
}
function renderProgressDone(ex) {
  const panel = $('#progressPanel');
  if (!ex || ex.state === 'idle') { panel.innerHTML = ''; return; }
  if (ex.state === 'error') {
    panel.innerHTML = `<div class="panel"><h3 style="color:var(--no)">Extraction failed</h3>
      <div class="pmeta">${escapeHtml(ex.detail || '')}</div>
      <div style="margin-top:.5rem"><button class="btn sm" onclick="retryExtract()">Retry</button></div></div>`;
    return;
  }
  const u = ex.usage;
  const cost = u ? ` · ${(u.in/1000).toFixed(1)}k in / ${(u.out/1000).toFixed(1)}k out · ~$${u.cost_est.toFixed(3)}` : '';
  panel.innerHTML = `<div class="panel ok"><h3>✓ Extraction complete</h3>
    <div class="pmeta">${escapeHtml(ex.detail || '')}${ex.elapsed ? ' · '+fmtTime(ex.elapsed) : ''}${cost}</div>
    <div style="margin-top:.5rem"><button class="btn sm ghost" onclick="retryExtract()">Re-extract</button></div></div>`;
}
async function retryExtract() {
  try {
    await api(`/videos/${CURRENT}/extract`, {method:'POST'});
    const v = VIDEOS.find(x => x.id === CURRENT) || await api(`/videos/${CURRENT}`);
    startProgress(v, {state:'queued', added:0, elapsed:0});
  } catch (e) { toast('error: ' + e.message, 3500); }
}
async function loadVideosQuiet() {
  try { VIDEOS = await api('/videos'); } catch {}
}

/* ---------------- review ---------------- */
let loadingCands = false, loadCandsQueued = false;
async function loadCandidates(spin) {
  if (!CURRENT) return;
  if (loadingCands) { loadCandsQueued = true; return; }
  loadingCands = true;
  const box = $('#cards');
  const forId = CURRENT;
  if (spin && !box.querySelector('.card')) box.innerHTML = SPINNER;
  let rows;
  try {
    rows = await api(`/videos/${forId}/candidates?status=pending`);
  } catch {
    loadingCands = false;
    if (!box.querySelector('.card') && !box.querySelector('.leaving'))
      box.innerHTML = navigator.onLine
        ? '<div class="empty">couldn’t load — tap “reload”</div>'
        : '<div class="empty">review needs a connection</div>';
    return;
  }
  if (forId === CURRENT) reconcileCards(box, rows);
  loadingCands = false;
  if (loadCandsQueued) { loadCandsQueued = false; loadCandidates(); }
}

// Make the DOM match the server's pending list exactly: drop stale cards, add
// missing ones, leave anything mid-dismiss alone. Single source of truth.
function reconcileCards(box, rows) {
  box.querySelectorAll('.center-spin, .empty').forEach(el => el.remove());
  const wanted = new Map(rows.map(c => [String(c.id), c]));
  box.querySelectorAll('.card').forEach(el => {
    if (!wanted.has(el.dataset.id) && !el.classList.contains('leaving')) el.remove();
  });
  const present = new Set([...box.querySelectorAll('.card')].map(el => el.dataset.id));
  let added = 0;
  rows.forEach(c => {
    if (present.has(String(c.id))) return;
    try {
      const el = renderCard(c);
      el.style.animationDelay = Math.min(added++, 8) * 30 + 'ms';
      box.appendChild(el);
    } catch (e) { console.error('renderCard', c && c.id, e); }
  });
  refreshReviewHead();
}
function refreshReviewHead() {
  const box = $('#cards');
  const n = box.querySelectorAll('.card:not(.leaving)').length;
  const collapsed = $('#reviewPanel').classList.contains('collapsed');
  $('#reviewHead').textContent = `${collapsed ? '▸' : '▾'} Review (${n})`;
  if (!n && !box.querySelector('.card'))
    box.innerHTML = '<div class="empty">Nothing to review 🎉</div>';
}
function toggleReview() {
  const collapsed = $('#reviewPanel').classList.toggle('collapsed');
  try { localStorage.setItem('reviewCollapsed', collapsed ? '1' : ''); } catch {}
  refreshReviewHead();
}

async function resetAndReExtract() {

}
async function deleteVideo() {

  if (!confirm(`Delete "${v.title || 'this video'}"?\n\nRemoves the transcript and all suggestions. Cards you already made stay in Anki.`)) return;
  const id = CURRENT;

function renderCard(c) {
  const el = document.createElement('div');
  el.className = 'card' + (c.duplicate ? ' dup' : '');
  el.dataset.id = c.id;
  const badge = c.duplicate ? ' · <span class="dupbadge">already have a card</span>' : '';
  const fq = c.freq ? ` · <span class="fq ${c.freq.band}">${escapeHtml(c.freq.label)}</span>` : '';
  el.innerHTML = `
    <div class="swipeflag left">✓ make card</div>
    <div class="swipeflag right">✕ discard</div>
    <div class="sent">${c.front_html}</div>
    <div class="tr">${escapeHtml(c.translation || '')}</div>
    <div class="meta">${c.is_phrase ? 'phrase' : 'word'} · ${escapeHtml(c.span_text)}${fq}${c.bolded ? '' : ' · ⚠ not bolded'}${badge}</div>
    <div class="decide">
      ${c.duplicate ? '' : '<button class="y">Make card</button>'}
      <button class="n">Discard</button>
    </div>`;
  const y = el.querySelector('.y');
  if (y) y.onclick = () => decide(c.id, 'yes', el);
  el.querySelector('.n').onclick = () => decide(c.id, 'no', el);
  attachSwipe(el, c.id);
  return el;
}

/* swipe right = make card, left = discard */
function attachSwipe(el, id) {
  let x0 = null, y0 = 0, dx = 0, active = false, committed = false;
  el.addEventListener('pointerdown', e => {
    if (el.dataset.busy || (e.pointerType === 'mouse' && e.button !== 0)) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; active = committed = false;
    el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => {
    if (x0 === null || committed) return;
    const ax = e.clientX - x0, ay = e.clientY - y0;
    if (!active) {
      if (Math.abs(ax) < 8) return;
      if (Math.abs(ay) > Math.abs(ax)) { x0 = null; return; }   // vertical scroll
      active = true;
      try { el.setPointerCapture(e.pointerId); } catch {}
    }
    dx = ax;
    el.style.transform = `translateX(${dx}px) rotate(${dx * 0.025}deg)`;
    el.classList.toggle('sw-yes', dx < -40);
    el.classList.toggle('sw-no', dx > 40);
    const p = Math.min(Math.abs(dx) / 95, 1);
    el.style.setProperty('--sw', p.toFixed(2));
  });
  const end = e => {
    if (x0 === null) return;
    try { el.releasePointerCapture(e.pointerId); } catch {}
    if (active && Math.abs(dx) > 95 && !committed && !el.dataset.busy) {
      committed = true;
      swipeCommit(el, id, dx < 0 ? 'yes' : 'no', dx);
    } else {
      el.style.transition = 'transform .18s ease';
      el.style.transform = '';
      el.classList.remove('sw-yes', 'sw-no');
    }
    x0 = null; active = false;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
async function swipeCommit(el, id, decision, dx) {
  el.dataset.busy = '1';
  el.querySelectorAll('button').forEach(b => b.disabled = true);
  el.classList.add('act', decision);
  const dir = dx > 0 ? 1 : -1;
  el.style.transition = 'transform .26s ease, opacity .26s ease';
  requestAnimationFrame(() => {
    el.style.transform = `translateX(${dir * (innerWidth + 100)}px) rotate(${dir * 10}deg)`;
    el.style.opacity = '0';
  });
  try {
    await api(`/candidates/${id}/decision`, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({decision})
    });
    setTimeout(() => collapseGap(el), 200);
  } catch (e) {
    toast('couldn’t save — ' + e.message, 3500);
    el.remove();
    loadCandidates();
  }
}
function collapseGap(el) {
  el.style.height = el.offsetHeight + 'px';
  el.style.overflow = 'hidden';
  requestAnimationFrame(() => {
    el.style.transition = 'height .18s ease, margin .18s ease, padding .18s ease';
    el.style.height = '0px';
    el.style.marginTop = el.style.marginBottom = '0px';
    el.style.paddingTop = el.style.paddingBottom = '0px';
  });
  setTimeout(() => { el.remove(); refreshReviewHead(); }, 200);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function decide(id, decision, el) {
  if (el.dataset.busy) return;
  el.dataset.busy = '1';
  el.querySelectorAll('button').forEach(b => b.disabled = true);
  el.style.animation = 'none';
  el.style.height = el.offsetHeight + 'px';
  el.classList.add('act', decision);          // instant solid green / red flash
  try {
    await Promise.all([
      api(`/candidates/${id}/decision`, {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({decision})
      }),
      sleep(140),                              // let the flash register
    ]);
    collapseCard(el);                          // confirmed — slide away
  } catch (e) {
    toast('couldn’t save — ' + e.message, 3500);   // revert this card, in place
    el.classList.remove('act', decision);
    el.style.height = ''; el.style.animation = '';
    delete el.dataset.busy;
    el.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}
function collapseCard(el) {
  void el.offsetHeight;
  el.classList.add('leaving');
  requestAnimationFrame(() => {
    el.style.height = '0px';
    el.style.paddingTop = el.style.paddingBottom = '0px';
    el.style.marginTop = el.style.marginBottom = '0px';
    el.style.opacity = '0';
  });
  setTimeout(() => { el.remove(); refreshReviewHead(); }, 190);
}

/* ---------------- search (local-first, works offline) ---------------- */
const rnorm = s => String(s).toLowerCase().replace(/ё/g, 'е').trim();

function localSearch(lines, q, limit=40) {
  const qn = rnorm(q);
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    if (rnorm(lines[i].text).includes(qn)) {
      const ctx = lines.slice(Math.max(0, i-1), i+2).map(l => l.text).join(' ').trim();
      out.push({ id: lines[i].id, start_time: lines[i].t || lines[i].start_time,
                 text: ctx, html: highlightHTML(ctx, q) });
      if (out.length >= limit) break;
    }
  }
  return out;
}
function highlightHTML(text, q) {
  const ft = rnorm(text), fq = rnorm(q);
  if (!fq) return escapeHtml(text);
  let out = '', i = 0, j;
  while ((j = ft.indexOf(fq, i)) >= 0) {
    out += escapeHtml(text.slice(i, j)) + '<b>' + escapeHtml(text.slice(j, j+fq.length)) + '</b>';
    i = j + fq.length;
  }
  return out + escapeHtml(text.slice(i));
}

function debouncedSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 220); }
async function runSearch() {
  const q = $('#q').value.trim();
  const box = $('#results');
  if (!CURRENT || q.length < 2) { box.innerHTML = ''; return; }
  let rows;
  const off = await idbGet('offline', CURRENT);
  if (off) rows = localSearch(off.lines, q);
  else {
    try { rows = await api(`/videos/${CURRENT}/search?q=${encodeURIComponent(q)}`); }
    catch (e) { box.innerHTML = '<div class="empty">offline — save this video for offline search</div>'; return; }
  }
  box.innerHTML = rows.length ? '' : '<div class="empty">no matches</div>';
  for (const r of rows) {
    const el = document.createElement('div');
    el.className = 'line';
    el.innerHTML = `<div class="t">${r.start_time || ''}</div>${r.html || escapeHtml(r.text)}`;
    el.onclick = () => openCardModal(r);
    box.appendChild(el);
  }
}

/* ---------------- card modal (tap words to pick the phrase) ---------------- */
let MODAL = null;
const stripPunct = s => String(s).replace(/^[^\p{L}\d-]+|[^\p{L}\d-]+$/gu, '');

function openCardModal(row, forceWord) {
  const tokens = row.text.split(/(\s+)/);          // words + the gaps between them
  const wordTok = [];                              // token index of each Nth word
  tokens.forEach((t, i) => { if (t && !/^\s+$/.test(t)) wordTok.push(i); });
  MODAL = { tokens, wordTok, sentence: row.text, lineId: row.id,
            timestamp: row.start_time || null,
            anchor: null, focus: null, scatter: null, _edited: false,
            preview: null, previewFor: null, pvTimer: null, pvSeq: 0, _firstSync: true };
  $('#modalPreview').innerHTML = '';

  // pick the word to pre-select: an exact tapped word, else the searched prefix
  if (forceWord) {
    const fw = rnorm(stripPunct(forceWord));
    const hit = wordTok.findIndex(ti => rnorm(stripPunct(tokens[ti])) === fw);
    if (hit >= 0) { MODAL.anchor = hit; MODAL.focus = hit; }
  } else {
    const pfx = rnorm($('#q').value || '');
    const matches = pfx ? wordTok
      .map((ti, wi) => ({ wi, w: rnorm(stripPunct(tokens[ti])) }))
      .filter(x => x.w && x.w.startsWith(pfx)).map(x => x.wi) : [];
    if (matches.length === 1) { MODAL.anchor = matches[0]; MODAL.focus = matches[0]; }
    else if (matches.length > 1) { MODAL.scatter = new Set(matches); }
  }

  renderModalSent();
  syncModalSpan();
  $('#modalWrap').hidden = false;
}

function selectedWords() {
  if (MODAL.scatter) return MODAL.scatter;
  if (MODAL.anchor === null) return new Set();
  const b = MODAL.focus ?? MODAL.anchor;
  const out = new Set();
  for (let i = Math.min(MODAL.anchor, b); i <= Math.max(MODAL.anchor, b); i++) out.add(i);
  return out;
}
function selConsecutive() {
  const s = selectedWords();
  if (!s.size) return false;
  return Math.max(...s) - Math.min(...s) + 1 === s.size;
}

function renderModalSent() {
  const host = $('#modalSent');
  host.innerHTML = '';
  const sel = selectedWords();
  const scattered = !!MODAL.scatter;
  let wi = -1;
  MODAL.tokens.forEach(tok => {
    if (!tok || /^\s+$/.test(tok)) { host.appendChild(document.createTextNode(tok)); return; }
    wi++;
    const my = wi;
    const s = document.createElement('span');
    s.className = 'w' + (sel.has(my) ? ' sel' : '') + (sel.has(my) && scattered ? ' warn' : '');
    s.textContent = tok;
    s.onclick = () => pickWord(my);
    host.appendChild(s);
  });
}
function pickWord(wi) {
  if (MODAL.scatter || MODAL.anchor === null || MODAL.focus !== null) {
    MODAL.scatter = null; MODAL.anchor = wi; MODAL.focus = null;
  } else {
    MODAL.focus = wi;
  }
  MODAL._edited = false;
  renderModalSent();
  syncModalSpan();
}
function syncModalSpan() {
  const sel = selectedWords();
  if (!MODAL._edited) {
    let span = '';
    if (sel.size) {
      const lo = MODAL.wordTok[Math.min(...sel)], hi = MODAL.wordTok[Math.max(...sel)];
      span = stripPunct(MODAL.tokens.slice(lo, hi + 1).join(''));
    }
    $('#modalSpan').value = span;
  }
  const ok = MODAL._edited ? !!$('#modalSpan').value.trim() : selConsecutive();
  $('#modalOk').disabled = !ok;
  $('#modalHint').textContent = ok ? ''
    : (sel.size ? 'Those words aren’t next to each other — tap the phrase you want.'
                : 'Tap the word or phrase you want.');
  const now = MODAL._firstSync; MODAL._firstSync = false;
  updatePreview(ok ? $('#modalSpan').value.trim() : '', now);
}

const PVCACHE = new Map();
function updatePreview(span, immediate) {
  clearTimeout(MODAL.pvTimer);
  const box = $('#modalPreview');
  if (!span) { box.innerHTML = ''; MODAL.preview = MODAL.previewFor = null; return; }
  if (MODAL.previewFor === span) return;            // already showing / fetching this
  const ck = CURRENT + '|' + span + '|' + (MODAL.sentence || '');
  if (PVCACHE.has(ck)) {                            // instant on repeat
    const p = PVCACHE.get(ck);
    MODAL.preview = p; MODAL.previewFor = span;
    box.innerHTML = `<div class="pv"><div class="sent">${p.front_html}</div><div class="tr">${escapeHtml(p.translation || '')}</div></div>`;
    return;
  }
  MODAL.preview = null;
  if (!navigator.onLine) {
    box.innerHTML = '<div class="wait">ⓘ translation preview isn’t available offline — the card will be translated when it uploads</div>';
    return;
  }
  box.innerHTML = '<div class="wait"><span class="spin"></span> translating…</div>';
  const seq = ++MODAL.pvSeq;
  MODAL.pvTimer = setTimeout(async () => {
    try {
      const p = await api('/translate', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ video_id: CURRENT, span,
          subtitle_line_id: MODAL.lineId ?? null,
          timestamp: MODAL.timestamp, sentence: MODAL.sentence })
      });
      PVCACHE.set(ck, p);
      if (seq !== MODAL.pvSeq) return;              // superseded
      MODAL.preview = p; MODAL.previewFor = span;
      box.innerHTML = `<div class="pv">
        <div class="sent">${p.front_html}</div>
        <div class="tr">${escapeHtml(p.translation || '')}</div>
      </div>`;
    } catch (e) {
      if (seq === MODAL.pvSeq)
        box.innerHTML = `<div class="wait">couldn’t preview (${escapeHtml(e.message)}) — card will still translate on save</div>`;
    }
  }, immediate ? 0 : 200);
}

function closeCardModal(resume = true) {
  const wasWatch = MODAL && MODAL.watchCue != null;
  if (MODAL) clearTimeout(MODAL.pvTimer);
  $('#modalWrap').hidden = true; MODAL = null;
  if (resume && wasWatch && wPausedForModal && WP) {
    wPausedForModal = false; try { WP.play(); } catch {}
  }
}

async function confirmCard() {
  const span = $('#modalSpan').value.trim();
  if (!span) { toast('pick a word first'); return; }
  const pv = (MODAL.preview && MODAL.previewFor === span) ? MODAL.preview : null;
  const watchCue = MODAL.watchCue;
  const item = {
    client_id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6),
    video_id: CURRENT, span,
    subtitle_line_id: MODAL.lineId ?? null,
    timestamp: MODAL.timestamp,
    sentence: pv ? pv.sentence : MODAL.sentence,
    span_text: pv ? pv.span_text : null,
    translation: pv ? pv.translation : null,
    is_phrase: pv ? pv.is_phrase : null,
    created_at: Date.now(),
  };
  closeCardModal(false);
  await idbPut('queue', item.client_id, item);
  await refreshQueuePill();
  toast(pv ? `carded: ${pv.span_text} — ${pv.translation}`
           : (navigator.onLine ? 'card queued' : 'saved — translates when online'));

  if (watchCue != null && WP) {
    // replay the line you just carded
    wPausedForModal = false;
    markWordCarded(span);
    try { WP.seek(WCUES[watchCue].s); WP.play(); } catch {}
  } else {

  }
}

/* ---------------- watch view ---------------- */
function hms(sec) {
  sec = Math.max(0, Math.floor(sec));
  const p = n => String(n).padStart(2, '0');
  return `${p(sec / 3600 | 0)}:${p(sec % 3600 / 60 | 0)}:${p(sec % 60)}`;
}
function loadYTApi() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytApiP) return ytApiP;
  ytApiP = new Promise((res, rej) => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => rej(new Error('script blocked'));
    document.head.appendChild(s);
    setTimeout(() => rej(new Error('timed out')), 9000);
  });
  return ytApiP;
}

async function openWatch(id) {

/* ---- resume where you left off (per video, this device) ---- */
let lastPosSave = 0;
function loadPos(id) {
  try { const v = parseInt(localStorage.getItem('wp:' + id) || '0', 10);
        return v > 10 ? v : 0; } catch { return 0; }
}
function savePos() {
  if (!WDATA || !WP) return;
  const t = WP.time(), d = WP.dur();
  if (d && t > 5 && t < d - 8) {
    try { localStorage.setItem('wp:' + WDATA.video.id, String(Math.floor(t))); } catch {}
  }
}
function clearPos(id) { try { localStorage.removeItem('wp:' + id); } catch {} }

/* build the visible player (local <video> or YouTube iframe) for WDATA */
async function startPlayer(id, seekTo = 0) {
  const data = WDATA; if (!data) return;
  teardownVideo();
  if (await opfsHas(id)) {
    await useLocalVideo(id, data.video);
    if (seekTo && WP) {
      WP.seek(seekTo);
      if (WP.el) WP.el.addEventListener('loadedmetadata', () => WP.seek(seekTo), { once: true });
    }
    return;
  }
  try { await loadYTApi(); }
  catch { toast('couldn’t load the YouTube player'); closeWatch(); return; }
  ytPlayer = new YT.Player('ytplayer', {
    videoId: data.video.youtube_id,
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 0,
                  disablekb: 1, iv_load_policy: 3, origin: location.origin },
    events: {
      onReady: e => {
        WP = {
          time: () => e.target.getCurrentTime() || 0,
          dur: () => e.target.getDuration() || 0,
          play: () => e.target.playVideo(), pause: () => e.target.pauseVideo(),
          paused: () => e.target.getPlayerState() !== 1,
          seek: t => e.target.seekTo(t, true),
          rate: r => e.target.setPlaybackRate(r),
        };
        if (seekTo) { try { e.target.seekTo(seekTo, true); } catch {} }
        try { e.target.playVideo(); } catch {}
        clearInterval(capTimer); capTimer = setInterval(tick, 120);
        setupMediaSession(data.video);
      },
      onStateChange: e => { onPlayState(e.data === 1); if (e.data === 0) clearPos(data.video.id); },
      onError: () => { $('#capOverlay').textContent = '⚠ this video can’t be embedded'; },
    },
  });
}

async function useLocalVideo(id, meta) {
  try { if (localURL) URL.revokeObjectURL(localURL); } catch {}
  localURL = await opfsURL(id);
  const vid = document.createElement('video');
  vid.src = localURL; vid.playsInline = true; vid.setAttribute('playsinline', '');
  vid.setAttribute('webkit-playsinline', ''); vid.preload = 'auto';
  $('#ytplayer').appendChild(vid);
  WP = {
    time: () => vid.currentTime || 0, dur: () => vid.duration || 0,
    play: () => vid.play().catch(() => {}), pause: () => vid.pause(),
    paused: () => vid.paused, seek: t => { try { vid.currentTime = t; } catch {} },
    rate: r => { vid.playbackRate = r; }, el: vid,
  };
  vid.addEventListener('play', () => onPlayState(true));
  vid.addEventListener('pause', () => onPlayState(false));
  vid.addEventListener('ended', () => { onPlayState(false); clearPos(id); });
  clearInterval(capTimer); capTimer = setInterval(tick, 120);
  setupMediaSession(meta);
  vid.play().catch(() => {});
}

function teardownVideo() {
  if (ytPlayer) { try { ytPlayer.destroy(); } catch {} ytPlayer = null; }
  const v = $('#ytplayer').querySelector('video');
  if (v) { try { v.pause(); v.removeAttribute('src'); v.load(); } catch {} }
  $('#ytplayer').innerHTML = '';
  try { if (localURL) URL.revokeObjectURL(localURL); } catch {}
  localURL = null;
}
function teardownAudio() {
  if (bgAudio) {
    try { bgAudio.pause(); bgAudio.removeAttribute('src'); bgAudio.load(); bgAudio.remove(); } catch {}
    bgAudio = null;
  }
  try { if (audioURL) URL.revokeObjectURL(audioURL); } catch {}
  audioURL = null;

async function ensureAudioFile(id, btn) {
  const label = btn ? btn.textContent : '';
  try {
    let st = await api(`/videos/${id}/audio/status`);
    if (st.state !== 'done') {
      if (btn) btn.textContent = '🎧 fetching audio…';
      await api(`/videos/${id}/audio`, { method: 'POST' });
      for (let i = 0; i < 150; i++) {
        await sleep(1000);
        st = await api(`/videos/${id}/audio/status`);
        if (btn && st.pct) btn.textContent = `🎧 fetching audio ${Math.round(st.pct)}%`;
        if (st.state === 'done') break;
        if (st.state === 'error') {
          toast('audio download failed' + (st.detail ? ': ' + st.detail : ''), 4000);
          if (btn) btn.textContent = label; return null;

function onPlayState(playing) {
  $('#watchView').classList.toggle('paused', !playing);
  if (playing) { const c = $('#capOverlay'); if (c.textContent === 'tap to play') c.textContent = ''; }
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  bumpCtrls();
}

function setupMediaSession(meta) {
  if (!('mediaSession' in navigator)) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: meta.title || 'video', artist: meta.channel || 'ru-anki',
      artwork: meta.thumbnail_url ? [{ src: meta.thumbnail_url, sizes: '480x360', type: 'image/jpeg' }] : [],
    });
    const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch {} };
    set('play', () => { WP && WP.play(); });
    set('pause', () => { WP && WP.pause(); });
    set('previoustrack', () => seekLine(-1));
    set('nexttrack', () => seekLine(1));
    set('seekbackward', () => seekLine(-1));
    set('seekforward', () => seekLine(1));
  } catch {}
}

function cueIdxAt(t) {
  let lo = 0, hi = WCUES.length - 1, idx = -1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1;
    if (t < WCUES[m].s) hi = m - 1;
    else if (t >= WCUES[m].e) lo = m + 1;
    else { idx = m; break; }
  }
  if (idx < 0) for (let i = WCUES.length - 1; i >= 0; i--)
    if (WCUES[i].s <= t) { idx = i; break; }
  return idx;
}
function seekLine(dir) {
  if (!WP || !WCUES.length) return;
  const t = WP.time();
  let i = cueIdxAt(t);
  if (i < 0) i = 0;
  let target;
  if (dir < 0) target = (t - WCUES[i].s > 1.2) ? i : Math.max(0, i - 1);  // 1st tap: restart line
  else target = Math.min(WCUES.length - 1, i + 1);
  WP.seek(WCUES[target].s);
  WP.play();
}
function renderCaption(idx) {
  const c = $('#capOverlay');
  c.textContent = '';
  if (idx < 0 || !WCUES[idx]) return;
  (WCUES[idx].words || [{ t: WCUES[idx].text }]).forEach((w, wi) => {
    const sp = document.createElement('span');
    sp.className = 'capw' + (w.c ? ' has-card' : (w.p ? ' pending' : ''));
    if (w.p) sp.dataset.cand = w.p;
    sp.textContent = w.t;
    if (w.t) sp.onclick = ev => {
      ev.stopPropagation();
      (w.p && !w.c) ? inlineDecide(w.p, sp) : watchTapWord(idx, wi);
    };
    c.append(sp, document.createTextNode(' '));
  });
}
function tick() {
  if (!WP) return;
  if ('mediaSession' in navigator && WP.dur() > 0) {
    try { navigator.mediaSession.setPositionState({
      duration: WP.dur(), position: Math.min(WP.time(), WP.dur()),
      playbackRate: WP.el ? WP.el.playbackRate : 1 }); } catch {}
  }
  if (Date.now() - lastPosSave > 4000) { lastPosSave = Date.now(); savePos(); }
  const idx = cueIdxAt(WP.time());
  if (idx === wActive) return;
  wActive = idx;
  const c = $('#capOverlay');
  if (c.textContent !== 'tap to play') renderCaption(idx);
  const box = $('#transcript');
  box.querySelectorAll('.cue.on').forEach(e => e.classList.remove('on'));
  if (idx < 0) return;
  const el = box.querySelector(`.cue[data-i="${idx}"]`);
  if (!el) return;
  el.classList.add('on');
  if (Date.now() - wUserScroll > 3500)
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function renderTranscript() {
  const box = $('#transcript');
  box.innerHTML = '';
  WCUES.forEach((cue, i) => {
    const line = document.createElement('div');
    line.className = 'cue'; line.dataset.i = i;
    const ts = document.createElement('button');
    ts.className = 'cue-ts'; ts.textContent = fmtTime(cue.s);
    ts.onclick = () => { if (WP) { WP.seek(cue.s); WP.play(); } };
    line.appendChild(ts);
    (cue.words || []).forEach((w, wi) => {
      const sp = document.createElement('span');
      sp.className = 'cw' + (w.c ? ' has-card' : (w.p ? ' pending' : ''));
      if (w.p) sp.dataset.cand = w.p;
      sp.textContent = w.t;

}
function watchTapWord(ci, wi) {
  if (WP) { WP.pause(); wPausedForModal = true; }
  const around = [WCUES[ci - 1], WCUES[ci], WCUES[ci + 1]].filter(Boolean).map(c => c.text).join(' ');
  openCardModal({ id: null, text: around, start_time: hms(WCUES[ci].s) }, WCUES[ci].words[wi].t);
  if (MODAL) MODAL.watchCue = ci;
}
function markWordCarded(span) {
  const t = rnorm(stripPunct(span));
  const parts = new Set(t.split(/\s+/));
  const hit = txt => { const w = rnorm(stripPunct(txt)); return w === t || parts.has(w); };
  document.querySelectorAll('#transcript .cw, #capOverlay .capw').forEach(sp => {
    if (hit(sp.textContent)) sp.classList.add('has-card');
  });
  WCUES.forEach(c => (c.words || []).forEach(w => { if (hit(w.t)) w.c = true; }));
}

/* ---- inline approve/deny for a suggested (pending) card, from the watch view ---- */
function inlineDecide(candId, anchor) {
  const cand = WCANDS[candId];
  if (!cand) return;
  if (WP && !WP.paused()) { try { WP.pause(); } catch {} wPausedForModal = true; }
  const pop = $('#inlineDecide');
  $('#idSpan').textContent = cand.span || '';
  $('#idTr').textContent = cand.tr ? '— ' + cand.tr : '';
  pop.dataset.cand = candId;
  pop.hidden = false;
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(8, Math.min(left, innerWidth - pw - 8));
  let top = r.top - ph - 10;
  if (top < 8) top = Math.min(r.bottom + 10, innerHeight - ph - 8);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}
function closeInline(resume) {
  $('#inlineDecide').hidden = true;
  if (resume && wPausedForModal && WP) { wPausedForModal = false; try { WP.play(); } catch {} }
}
async function inlineCommit(decision) {
  const pop = $('#inlineDecide');
  const id = +pop.dataset.cand;
  pop.hidden = true;
  try {
    await api(`/candidates/${id}/decision`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ decision }),
    });
  } catch (e) {
    toast('couldn’t save — decide from the review list later', 3000);
    if (wPausedForModal && WP) { wPausedForModal = false; try { WP.play(); } catch {} }
    return;
  }
  document.querySelectorAll(
    `#transcript [data-cand="${id}"], #capOverlay [data-cand="${id}"]`
  ).forEach(s => {
    s.classList.remove('pending');
    if (decision === 'yes') s.classList.add('has-card');
  });
  WCUES.forEach(cue => (cue.words || []).forEach(w => {
    if (w.p === id) { delete w.p; if (decision === 'yes') w.c = true; }
  }));
  delete WCANDS[id];
  toast(decision === 'yes' ? '✓ added to Anki' : 'skipped');
  if (wPausedForModal && WP) { wPausedForModal = false; try { WP.play(); } catch {} }
}
document.addEventListener('pointerdown', e => {
  const pop = $('#inlineDecide');
  if (pop.hidden || pop.contains(e.target)) return;
  if (!e.target.closest('[data-cand]')) closeInline(true);
}, true);

/* ---------------- offline queue + flush ---------------- */
async function refreshQueuePill() {
  const n = (await idbAll('queue')).length;
  const pill = $('#queuePill');
  if (!n) { pill.hidden = true; return; }
  pill.hidden = false;
  pill.innerHTML = flushing
    ? `<span class="spin"></span> uploading ${n}…`
    : `${n} card${n>1?'s':''} to upload`;
}
let flushing = false;
async function flushQueue(manual) {
  if (flushing || !navigator.onLine) { if (manual && !navigator.onLine) toast('still offline'); return; }
  const items = await idbAll('queue');
  if (!items.length) return;
  flushing = true;
  refreshQueuePill();
  try {
    const res = await api('/cards/flush', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ items })
    });
    let ok = 0, retry = 0, dropped = 0;
    const byId = Object.fromEntries(items.map(i => [i.client_id, i]));
    for (const r of res.results) {
      if (r.ok) { await idbDel('queue', r.client_id); ok++; continue; }
      // server reachable but this item failed (dup, deleted video, …).
      // keep retrying a few times, then give up so the pill can clear.
      const it = byId[r.client_id]; if (!it) continue;
      it.tries = (it.tries || 0) + 1; it.last_error = r.error;
      if (it.tries >= 4) { await idbDel('queue', r.client_id); dropped++; }
      else { await idbPut('queue', r.client_id, it); retry++; }
    }
    await refreshQueuePill();
    const bits = [];
    if (ok) bits.push(`${ok} added to Anki`);
    if (retry) bits.push(`${retry} will retry`);
    if (dropped) bits.push(`${dropped} gave up (${res.results.find(r=>!r.ok)?.error || 'error'})`);
    if (bits.length) toast(bits.join(' · '), dropped || retry ? 4000 : 2400);
  } catch (e) {
    if (manual) toast('upload failed — Anki reachable? will retry', 3000);
  } finally { flushing = false; refreshQueuePill(); }
}

/* ---------------- offline VIDEO FILE (OPFS) ---------------- */
async function opfsDir() {
  const root = await navigator.storage.getDirectory();
  return root.getDirectoryHandle('media', { create: true });
}
async function opfsHas(id) {
  try { await (await opfsDir()).getFileHandle(id + '.mp4'); return true; } catch { return false; }
}
async function opfsSize(id) {
  try { return (await (await (await opfsDir()).getFileHandle(id + '.mp4')).getFile()).size; }
  catch { return 0; }
}
async function opfsURL(id) {
  const f = await (await (await opfsDir()).getFileHandle(id + '.mp4')).getFile();
  return URL.createObjectURL(f);
}
async function opfsDelete(id) {
  try { await (await opfsDir()).removeEntry(id + '.mp4'); } catch {}
}
async function opfsSave(id, onProgress) {
  const res = await fetch(`/videos/${id}/media`);
  if (!res.ok) throw new Error('server has no file yet');
  const total = +res.headers.get('content-length') || 0;
  const fh = await (await opfsDir()).getFileHandle(id + '.mp4', { create: true });
  const w = await fh.createWritable();
  const reader = res.body.getReader();
  let got = 0;
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      await w.write(value);
      got += value.length;
      if (onProgress) onProgress(total ? got / total : 0, got);
    }
    await w.close();
  } catch (e) { try { await w.abort(); } catch {} await opfsDelete(id); throw e; }
  return got;
}

async function downloadMedia(id) {

        if (s.state === 'done') break;

/* ---------------- tiny IndexedDB wrapper ---------------- */
let _db;
function idb() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open('ru-anki', 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore('offline');
      r.result.createObjectStore('queue');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _db;
}
async function _tx(store, mode) { return (await idb()).transaction(store, mode).objectStore(store); }
function _p(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
async function idbGet(store, key) { return _p((await _tx(store, 'readonly')).get(key)); }
async function idbPut(store, key, val) { return _p((await _tx(store, 'readwrite')).put(val, key)); }
async function idbDel(store, key) { return _p((await _tx(store, 'readwrite')).delete(key)); }
async function idbAll(store) { return _p((await _tx(store, 'readonly')).getAll()); }

/* ---------------- connectivity ---------------- */
// NET: 'ok' | 'anki' (server ok, Anki down) | 'noserver' (online but can't reach Mac)
//      | 'offline' (no internet at all) | 'checking'
let NET = 'checking', healthTimer = null;

async function probeHealth() {
  if (!navigator.onLine) { setNet('offline'); return; }
  setNet(NET === 'ok' || NET === 'anki' ? NET : 'checking');
  try {
    const r = await fetch('/health', { cache: 'no-store', signal: AbortSignal.timeout(6000) });
    if (!r.ok) throw 0;
    const h = await r.json();
    setNet(h.anki && h.anki.ok ? 'ok' : 'anki');
  } catch { setNet('noserver'); }
}
function setNet(state) {
  const changed = state !== NET;
  NET = state;
  const pill = $('#netpill'), word = $('#netword'), banner = $('#connBanner');
  pill.className = 'sub ' + ({ ok: 'ok', anki: 'warn', noserver: 'bad', offline: '', checking: '' }[state] || '');
  word.textContent = { ok: 'connected', anki: 'Anki down', noserver: 'no server',
                       offline: 'offline', checking: '…' }[state];
  const B = {
    anki: ['warn', '⚠ Connected to the Mac, but <b>Anki isn’t running</b> (or AnkiConnect isn’t installed). New cards will queue and upload once Anki is open. Tap to re-check.'],
    noserver: ['bad', '⚠ <b>Can’t reach the Mac.</b> Check: Tailscale VPN is <b>on</b> on this phone, the Mac is awake and on Tailscale, and the ru-anki server is running. Tap to re-check.'],
    offline: ['offline', 'offline'],
  }[state];
  if (B) { banner.hidden = false; banner.className = B[0]; banner.innerHTML = B[1]; }
  else banner.hidden = true;
  if (changed && state === 'ok') onReconnect();
}
function paintNet() { probeHealth(); }

function onReconnect() {
  flushQueue();
  if (CURRENT && !$('#detailView').hidden) { renderOfflineRow(CURRENT); loadCandidates(true); }
}
window.addEventListener('online', probeHealth);
window.addEventListener('offline', () => setNet('offline'));
document.addEventListener('visibilitychange', () => { if (!document.hidden) probeHealth(); });
window.addEventListener('focus', probeHealth);

/* ---------------- reload + back navigation ---------------- */
async function hardRefresh() {
  $('#refreshBtn').classList.add('spinning');
  try {
    if (window.caches) {
      const ks = await caches.keys();
      await Promise.all(ks.filter(k => k.startsWith('ru-anki-shell')).map(k => caches.delete(k)));
    }
    const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (r) { try { await r.update(); } catch {} }
  } catch {}
  location.reload();
}

// step back one level through the app's views; returns true if it did something
function navBack() {
  if (!$('#inlineDecide').hidden) { closeInline(true); return true; }
  if (!$('#modalWrap').hidden) { closeCardModal(); return true; }
  if (!$('#watchView').hidden) {
    if ($('#watchView').classList.contains('fs')) { fsManual = true; exitFs(); return true; }
    closeWatch(); return true;
  }
  if (!$('#detailView').hidden) { showList(); return true; }
  return false;
}
// trap the OS / browser back gesture so it walks back through views instead of leaving
try { history.pushState({ ru: 1 }, ''); } catch {}
addEventListener('popstate', () => { navBack(); try { history.pushState({ ru: 1 }, ''); } catch {} });

// swipe in from the very left edge of the screen = back
(() => {
  const mainEl = document.querySelector('main');
  let x0 = null, y0 = 0, live = false;
  addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || e.touches[0].clientX > 24) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; live = false;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (x0 === null) return;
    const t = e.touches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (!live && dx > 12 && Math.abs(dx) > Math.abs(dy) + 4) live = true;
    if (live && $('#watchView').hidden) {
      mainEl.classList.remove('edging');
      mainEl.style.transform = `translateX(${Math.min(dx, 90)}px)`;
    }
  }, { passive: true });
  addEventListener('touchend', e => {
    if (live) {
      mainEl.classList.add('edging');
      mainEl.style.transform = '';
      if (e.changedTouches[0].clientX - x0 > 70) history.back();
    }
    x0 = null; live = false;
  });
})();

/* ---------------- boot ---------------- */
if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('/sw.js').catch(() => {});
addEventListener('pagehide', () => savePos());
document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(); });
$('#speeds').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  $('#speeds').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  try { WP && WP.rate(parseFloat(b.dataset.r)); } catch {}
};
// re-check the connection every 20s while the tab is visible
setInterval(() => { if (!document.hidden) probeHealth(); }, 20000);
// landscape → immersive video; portrait → back to the split view (unless toggled)
matchMedia('(orientation: landscape)').addEventListener('change', e => {
  if ($('#watchView').hidden) return;
  if (e.matches && !fsManual) enterFs();
  else if (!e.matches && !fsManual) exitFs();
  updateRotateHint();
  if ($('#watchView').classList.contains('fs')) bumpCtrls();
});
probeHealth();
refreshQueuePill();
flushQueue();
loadVideos();
</script>
</body>
</html>
