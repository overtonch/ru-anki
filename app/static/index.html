<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta id="vp" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ru-anki">
<title>ru-anki</title>
<style>
  :root { color-scheme:dark;
          --bg:#101216; --fg:#ecebe7; --fg-dim:#b7bbc2; --muted:#7c828c;
          --line:#282d37; --line-soft:#20242c;
          --card:#181b21; --card-2:#20242c;
          --accent:#6aa9e0; --accent-soft:rgba(106,169,224,.15);
          --yes:#43b072; --no:#e0655b; --ok:#43b072; --okbg:#152c1e;
          --r:.7rem; --r-sm:.5rem;
          --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.22); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  ::selection { background:var(--accent-soft); }
  body { margin:0; font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); overflow-x:hidden;
         -webkit-font-smoothing:antialiased; touch-action:manipulation;  /* kill double-tap zoom everywhere */
         padding: env(safe-area-inset-top) 0 3rem; }
  a { color:var(--accent); text-decoration:none; }
  a:active { opacity:.7; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  header { padding:1.1rem 1.1rem .5rem; display:flex; align-items:baseline; gap:.55rem; }
  h1 { font-size:1.02rem; margin:0; font-weight:750; letter-spacing:-.01em; }
  header .sub { font-size:.78rem; color:var(--muted); }
  .hdr-right { margin-left:auto; align-self:center; display:flex; align-items:center; gap:.5rem; }
  .hdr-right .pill { margin-left:0; }
  .iconbtn { background:none; border:0; color:var(--muted); padding:.15rem; cursor:pointer;
             display:inline-flex; align-items:center; border-radius:var(--r-sm);
             transition:color .15s, transform .3s; }
  .iconbtn svg { width:1.2rem; height:1.2rem; fill:currentColor; display:block; }
  .iconbtn:active { color:var(--fg); }
  .iconbtn.spinning { color:var(--accent); animation:spin360 .7s linear infinite; }
  @keyframes spin360 { to { transform:rotate(360deg); } }
  main { padding:0 1.1rem; max-width:660px; margin:0 auto; }
  main.edging { transition:transform .2s ease; }

  input[type=text], input[type=search], select {
    width:100%; padding:.72rem .8rem; border:1px solid var(--line); border-radius:var(--r-sm);
    font-size:1rem; background:var(--card); color:var(--fg);
    transition:border-color .15s, box-shadow .15s; -webkit-appearance:none; appearance:none; }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none; }
  .minisel { width:auto; padding:.28rem 1.6rem .28rem .5rem; font-size:.8rem; border-radius:.45rem;
             background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                              linear-gradient(135deg,var(--muted) 50%,transparent 50%);
             background-position:calc(100% - 14px) 52%, calc(100% - 9px) 52%;
             background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  input::placeholder { color:var(--muted); }
  .addbar { display:flex; gap:.5rem; margin:.1rem 0 1rem; }
  .addbar input { flex:1; }
  .btn { padding:.7rem 1.05rem; border:1px solid var(--accent); background:var(--accent);
         color:#0b1016; font-weight:650; border-radius:var(--r-sm); font-size:.92rem;
         white-space:nowrap; cursor:pointer; transition:transform .1s, filter .15s, background .15s; }
  .btn:active { transform:scale(.985); filter:brightness(1.06); }
  .btn.ghost { background:var(--card-2); color:var(--fg-dim); border-color:var(--line); font-weight:600; }
  .btn.ghost:active { background:var(--line-soft); }
  .btn:disabled { opacity:.5; }
  .btn.sm { padding:.5rem .8rem; font-size:.85rem; }
  .btn .ic { width:1em; height:1em; fill:currentColor; vertical-align:-.14em; margin-right:.3em; }
  .backlink { background:none; border:none; color:var(--accent); font-size:.9rem;
              padding:.4rem 0; cursor:pointer; transition:opacity .15s; }
  .backlink:active { opacity:.6; }
  .backlink.danger { color:var(--no); display:block; margin:1.8rem auto .5rem; }
  .status { font-size:.82rem; color:var(--muted); margin:.4rem 0; min-height:1.1em; line-height:1.5; }
  .status:empty { margin:0; min-height:0; }
  .empty { color:var(--muted); text-align:center; padding:2.5rem 1rem; font-size:.9rem; }

  /* spinner */
  .spin { display:inline-block; width:1em; height:1em; border:2px solid currentColor;
          border-right-color:transparent; border-radius:50%;
          animation:spin .6s linear infinite; vertical-align:-.15em; }
  .spin.lg { width:1.5rem; height:1.5rem; border-width:3px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .center-spin { display:flex; justify-content:center; align-items:center; gap:.5rem;
                 padding:2rem 0; color:var(--muted); font-size:.9rem; }
  .rowhead { display:flex; align-items:baseline; justify-content:space-between; gap:.5rem;
             flex-wrap:wrap; }
  .rowhead h3 { margin:0; }
  .rowhead .backlink { font-size:.78rem; padding:0 0 0 .8rem; }
  .rvtoggle { background:none; border:none; color:var(--fg); font-size:.95rem; font-weight:700;
              padding:.1rem .1rem; cursor:pointer; letter-spacing:.01em; }
  #reviewPanel.collapsed #cards { display:none; }
  /* a book's "detail" page is just the suggested-words review — no "type a word
     you heard" box, no player rows */
  #detailView.text-mode #lookupPanel,
  #detailView.text-mode #watchBtn,
  #detailView.text-mode #offlineRow,
  #detailView.text-mode #mediaRow,
  #detailView.text-mode #transcribeRow { display:none; }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration:1.2s; } }

  /* progress bar */
  .pbar { height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin:.6rem 0 .4rem; }
  .pfill { height:100%; background:var(--accent); border-radius:99px;
           transition: width .5s cubic-bezier(.3,.7,.3,1); }
  .pfill.done { background:var(--ok); }
  .pfill.err  { background:var(--no); }
  .pmeta { font-size:.78rem; color:var(--muted); }

  /* video list */
  .chan { font-size:.7rem; font-weight:700; color:var(--muted); text-transform:uppercase;
          letter-spacing:.07em; margin:1.4rem .2rem .45rem; }
  .chan:first-child { margin-top:.4rem; }
  .vcard { display:flex; gap:.75rem; align-items:flex-start; background:var(--card);
           border:1px solid var(--line-soft); border-radius:var(--r); padding:.6rem; margin:.5rem 0;
           cursor:pointer; transition: border-color .15s, background .15s, transform .1s;
           animation: cardIn .3s cubic-bezier(.2,.7,.3,1) both; }
  .vcard:active { transform:scale(.99); background:var(--card-2); border-color:var(--line); }
  .vcard.done  { border-left:3px solid var(--ok); }
  .vcard.error { border-left:3px solid var(--no); }
  .vcard img { width:118px; height:66px; object-fit:cover; border-radius:.4rem; flex:none;
               background:var(--line-soft); }
  .vcard .body { flex:1; min-width:0; }
  .vcard .vtitle { font-size:.9rem; font-weight:600; line-height:1.3; letter-spacing:-.005em; }
  .vcard .vmeta { font-size:.75rem; color:var(--muted); margin-top:.25rem; }
  .vcard .vmeta a { color:var(--fg-dim); }
  .vcard .vmeta .ext { white-space:nowrap; }
  .vcard .doneline { font-size:.78rem; color:var(--ok); font-weight:600; margin-top:.3rem; }
  .vcard.feat { flex-direction:column; gap:.55rem; align-items:stretch; padding:.65rem; }
  .vcard.feat img { width:100%; height:auto; aspect-ratio:16/9; }
  .vcard.feat .vtitle { font-size:1rem; }

  /* detail */
  .vhead { display:flex; gap:.75rem; margin:.5rem 0 .9rem; }
  .vhead img { width:118px; height:66px; object-fit:cover; border-radius:.45rem; flex:none;
               background:var(--line-soft); }
  .vhead .vtitle { font-size:.98rem; font-weight:700; line-height:1.3; letter-spacing:-.01em; }
  .vhead .vmeta { font-size:.77rem; color:var(--muted); margin-top:.3rem; }
  .vhead .vmeta a { color:var(--fg-dim); }
  .panel { background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r);
           padding:.9rem 1rem; margin:.7rem 0; }
  .panel.ok { background:var(--okbg); border-color:rgba(67,176,114,.35); }
  .panel h3 { margin:0 0 .55rem; font-size:.7rem; font-weight:700; text-transform:uppercase;
              letter-spacing:.07em; color:var(--muted); }

  .line { background:var(--card-2); border:1px solid var(--line-soft); border-radius:var(--r-sm);
          padding:.7rem .8rem; margin:.45rem 0; cursor:pointer; line-height:1.5;
          transition:border-color .15s, background .15s; }
  .line:active { border-color:var(--accent); }
  .line .t { font-size:.7rem; color:var(--muted); margin-bottom:.15rem; }
  .line b { font-weight:700; background:var(--accent-soft); color:var(--fg);
            border-radius:3px; padding:.05em .15em; }

  /* review cards */
  .card { background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r);
          padding:.95rem 1rem; margin:.65rem 0; position:relative; touch-action:pan-y;
          transition: background-color .3s ease, border-color .3s ease, box-shadow .15s;
          animation: cardIn .32s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes cardIn { from { opacity:0; transform:translateY(8px); } }
  .card .clip { display:block; position:relative; width:100%; padding:0; border:0;
                background:var(--card-2); border-radius:var(--r-sm); overflow:hidden;
                cursor:pointer; margin:0 0 .7rem; aspect-ratio:16/9; }
  .card .clip img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .2s; }
  .card .clip:active img { transform:scale(1.02); }
  .card .clip-t { position:absolute; left:.5rem; bottom:.5rem; font-size:.74rem;
                  font-weight:650; color:#fff; background:rgba(0,0,0,.62);
                  border-radius:.35rem; padding:.15em .5em;
                  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  .card .clip.noimg { aspect-ratio:auto; background:none; width:auto; display:inline-block; }
  .card .clip.noimg img { display:none; }
  .card .clip.noimg .clip-t { position:static; display:inline-block; color:var(--accent);
                  background:none; padding:0; -webkit-backdrop-filter:none; backdrop-filter:none; }
  .fq { font-weight:600; }
  .fq.mid { color:#e0913a; }
  .fq.uncommon { color:var(--muted); }
  .fq.rare { color:var(--ok); }
  .rec { color:var(--accent); font-weight:600; }
  .wordlink { background:none; border:0; padding:0; font:inherit; color:var(--fg-dim);
              border-bottom:1px dotted var(--muted); cursor:pointer; }
  .pickbtn { display:block; margin:.15rem 0 .35rem; background:none; border:0; padding:0;
             color:var(--accent); font-size:.76rem; cursor:pointer; }
  .pickbtn.on { color:var(--muted); }
  .sentopts { margin:.2rem 0 .55rem; display:flex; flex-direction:column; gap:.3rem; }
  .sentopts .wait { font-size:.8rem; color:var(--muted); display:flex; gap:.4rem; align-items:center; }
  .sentopt { display:flex; gap:.5rem; align-items:flex-start; padding:.45rem .55rem;
             border:1px solid var(--line-soft); border-radius:var(--r-sm);
             background:var(--card-2); cursor:pointer; }
  .sentopt:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); }
  .sentopt input { margin-top:.2rem; flex:none; accent-color:var(--accent); }
  .sentopt .so-body { flex:1; min-width:0; }
  .sentopt .so-txt { font-size:.92rem; line-height:1.4; }
  .sentopt .so-txt b { font-weight:750; }
  .sentopt .so-meta { display:block; font-size:.68rem; color:var(--muted); margin-top:.2rem; }
  .sentopt .tag { color:var(--ok); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .sortrow { font-size:.74rem; color:var(--muted); margin:.1rem 0 .3rem;
             display:flex; align-items:center; gap:.4rem; }
  #reviewPanel.collapsed .sortrow { display:none; }
  .swipeflag { position:absolute; top:.65rem; font-size:.72rem; font-weight:800;
               letter-spacing:.04em; text-transform:uppercase; opacity:0;
               pointer-events:none; transition:opacity .1s; }
  .swipeflag.left  { left:.9rem;  color:var(--yes); }   /* swipe left = make card */
  .swipeflag.right { right:.9rem; color:var(--no); }    /* swipe right = discard  */
  .card.sw-yes { box-shadow:inset 0 0 0 2px var(--yes); }
  .card.sw-no  { box-shadow:inset 0 0 0 2px var(--no); }
  .card.sw-yes .swipeflag.left  { opacity:var(--sw,.4); }
  .card.sw-no  .swipeflag.right { opacity:var(--sw,.4); }
  /* flash the actioned card to a solid colour, then collapse it away */
  .card.act { color:#fff; border-color:transparent; transform:scale(1.015);
              transition: background-color .12s ease, transform .12s ease, box-shadow .12s ease; }
  .card.act.yes { background:#2f9e5e; box-shadow:0 4px 18px rgba(47,158,94,.35); }
  .card.act.no  { background:#d0463b; box-shadow:0 4px 18px rgba(208,70,59,.32); }
  .card.act .tr, .card.act .meta { color:rgba(255,255,255,.9); }
  .card.act .sent b { color:#fff; }
  .card.act .decide { opacity:0; transition:opacity .1s; }
  .card.leaving { overflow:hidden;
    transition: height .19s cubic-bezier(.4,0,.2,1), opacity .16s ease, transform .17s ease,
                padding .19s cubic-bezier(.4,0,.2,1), margin .19s cubic-bezier(.4,0,.2,1); }
  .card.leaving.yes { transform:scale(.94); }
  .card.leaving.no  { transform:translateX(16px) scale(.96); }
  .card.dup { opacity:.5; }
  .card.dup .decide .n { flex:1; border-color:var(--line); color:var(--muted); }
  .dupbadge { color:var(--muted); font-style:italic; }
  .sent { font-size:1.06rem; line-height:1.5; }
  .sent b { font-weight:750; }
  .tr { color:var(--accent); margin-top:.45rem; font-size:1rem; }
  .meta { font-size:.74rem; color:var(--muted); margin-top:.45rem; }
  .decide { display:flex; gap:.5rem; margin-top:.85rem; }
  .decide button { flex:1; padding:.68rem; border-radius:var(--r-sm); font-size:.9rem;
                   font-weight:650; border:1px solid; cursor:pointer; transition:filter .12s, transform .1s; }
  .decide button:active { transform:scale(.98); }
  .decide .y { background:var(--yes); border-color:var(--yes); color:#08160d; }
  .decide .n { background:transparent; border-color:var(--line); color:var(--fg-dim); }
  .decide .n:active { border-color:var(--no); color:var(--no); }

  .pill { margin-left:auto; border:1px solid var(--line); color:var(--fg-dim);
          background:var(--card); border-radius:999px; padding:.22rem .65rem; font-size:.73rem;
          cursor:pointer; }
  #netpill { display:inline-flex; align-items:center; gap:.35rem; padding:0; border:0; background:none; }
  .netdot { width:.5em; height:.5em; border-radius:50%; background:var(--muted);
            box-shadow:0 0 0 3px transparent; transition:box-shadow .3s; }
  #netpill.ok  .netdot { background:var(--ok); box-shadow:0 0 0 3px rgba(67,176,114,.18); }
  #netpill.warn .netdot { background:#e0913a; box-shadow:0 0 0 3px rgba(224,145,58,.18); }
  #netpill.bad .netdot { background:var(--no); box-shadow:0 0 0 3px rgba(224,101,91,.18); }
  #connBanner { position:fixed; left:0; right:0; top:0; z-index:30;
                font-size:.85rem; line-height:1.4; padding:.6rem 1rem;
                padding-top:calc(.6rem + env(safe-area-inset-top));
                text-align:center; color:#fff; cursor:pointer;
                box-shadow:0 2px 12px rgba(0,0,0,.25); }
  #connBanner[hidden] { display:none; }
  #connBanner.bad  { background:var(--no); }
  #connBanner.warn { background:#c07d2a; }
  #connBanner.offline { background:#3a3f47; font-size:.68rem; line-height:1; letter-spacing:.08em;
                        text-transform:uppercase; padding:.2rem 1rem;
                        padding-top:calc(.2rem + env(safe-area-inset-top)); box-shadow:none; }

  #modalWrap { position:fixed; inset:0; background:rgba(6,8,11,.6); z-index:20;
               align-items:center; justify-content:center; padding:1rem;
               -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #modalWrap[hidden] { display:none; }
  #modalWrap:not([hidden]) { display:flex; }
  .modal { background:var(--card-2); border:1px solid var(--line); border-radius:.85rem;
           padding:1.15rem 1.2rem; width:100%; max-width:460px; box-shadow:var(--sh);
           animation: cardIn .18s ease both; }
  .modal h3 { margin:0 0 .35rem; font-size:1rem; }
  .modalsent { font-size:1.12rem; line-height:1.85; margin:.4rem 0 .5rem; }
  .modalsent .w { padding:.08rem .18rem; border-radius:.3rem; cursor:pointer; transition:background .1s; }
  .modalsent .w.sel { background:var(--accent); color:#0b1016; }
  .modalsent .w.sel.warn { background:#e0913a; color:#1a1206; }
  .modalhint { font-size:.8rem; color:var(--no); margin:.1rem 0 .6rem; min-height:1em; }
  #modalPreview { margin:.7rem 0 .2rem; min-height:1.2em; }
  #modalPreview .pv { background:var(--bg); border:1px solid var(--line); border-radius:.55rem;
                      padding:.6rem .7rem; }
  #modalPreview .pv .sent { font-size:1rem; }
  #modalPreview .pv .sent b { font-weight:700; }
  #modalPreview .pv .tr { color:var(--accent); font-size:1rem; margin-top:.25rem; }
  #modalPreview .pv-acc { color:var(--fg); font-size:1.05rem; margin-top:.35rem; font-weight:600; }
  #modalPreview .pv-quick { color:var(--muted); font-size:.85rem; margin-top:.3rem; }
  #modalPreview .pv.quick .tr { color:var(--fg-dim); }
  #modalPreview .qtag { font-size:.62rem; text-transform:uppercase; letter-spacing:.06em;
                        color:var(--muted); border:1px solid var(--line); border-radius:.3rem;
                        padding:.02em .3em; vertical-align:.12em; }
  #modalPreview .wait { font-size:.82rem; color:var(--muted); display:flex; gap:.4rem; align-items:center; }
  .modalbtns { display:flex; justify-content:flex-end; gap:1rem; align-items:center;
               margin-top:.8rem; }
  #modalSpan { margin-top:.2rem; }

  .editnote { display:none; }
  /* compact card modal — opened by tapping a single word in the player */
  #modalWrap.compact #modalSent { display:none; }
  #modalWrap.compact .editnote { display:block; }
  #modalWrap.compact #modalSpan { margin-top:0; text-align:center; font-size:1.25rem;
                                  font-weight:650; padding:.6rem; }
  #modalWrap.compact #modalPreview { margin:.55rem 0 0; }
  #modalWrap.compact #modalPreview .pv { text-align:center; }
  #modalWrap.compact #modalPreview .pv .sent { display:none; }
  #modalWrap.compact #modalPreview .pv .tr { font-size:1.15rem; margin:0; }
  #modalWrap.compact #modalPreview .wait { justify-content:center; }
  #modalWrap.compact .editnote { font-size:.72rem; color:var(--muted); text-align:center;
                                 margin:.35rem 0 0; }

  /* watch view */
  .watch-cta { width:100%; margin:.4rem 0 .2rem; }
  #watchView { position:fixed; inset:0; background:var(--bg); z-index:15;
               display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none;
               padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
               touch-action:manipulation; }   /* no double-tap zoom in the player */
  html.watching, html.watching body { overflow:hidden; overscroll-behavior:none; }
  html.fs-black, html.fs-black body { background:#000; }
  #watchView button, #watchView .tap-layer, #watchView .cap-overlay,
  #watchView .capw { touch-action:manipulation; }
  #watchView .transcript { touch-action:pan-y; }
  #watchView svg { width:1.15em; height:1.15em; vertical-align:-.18em; pointer-events:none; }
  #watchView .wctrls svg { fill:currentColor; }
  #watchView[hidden] { display:none; }
  .watchbar { display:flex; align-items:center; justify-content:space-between;
              padding:.4rem .8rem; flex:none; }
  .speeds button { background:none; border:1px solid var(--line); color:var(--muted);
                   border-radius:.45rem; padding:.22rem .5rem; font-size:.76rem; margin-left:.3rem;
                   cursor:pointer; transition:border-color .15s, color .15s; }
  .speeds button.on { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .player-wrap { position:relative; width:100%; background:#000; flex:none;
                 aspect-ratio:16/9; }
  .player-wrap #ytplayer, .player-wrap iframe, .player-wrap video { position:absolute;
                 inset:0; width:100%; height:100%; border:0; background:#000;
                 object-fit:contain; }
  .tap-layer { position:absolute; inset:0; z-index:2; background:transparent; border:0;
               cursor:pointer; touch-action:pan-y; }
  #seekFlash { position:absolute; top:50%; left:50%; z-index:5;
               transform:translate(-50%,-50%) scale(.9);
               background:rgba(16,17,20,.62); color:#fff; border-radius:2rem;
               padding:.5rem .95rem; font-size:.85rem; font-weight:650; letter-spacing:.02em;
               opacity:0; pointer-events:none;
               -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
               transition:opacity .15s ease, transform .15s ease; }
  #seekFlash.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .player-wrap.swiping #capOverlay { opacity:.4; transition:opacity .1s; }
  .wctrls { display:flex; flex-wrap:wrap; gap:.5rem; padding:.55rem .9rem; flex:none; }
  .wctrls button { flex:1; padding:.62rem; border:1px solid var(--line); background:var(--card-2);
                   color:var(--fg-dim); border-radius:var(--r-sm); font-size:.86rem; cursor:pointer;
                   display:inline-flex; align-items:center; justify-content:center; gap:.35rem;
                   transition:border-color .15s, background .15s; }
  .wctrls button:active { background:var(--line-soft); border-color:var(--accent); }
  #audioBtn { flex-basis:100%; }
  #audioBtn.on { background:var(--accent-soft); border-color:var(--accent); color:var(--fg); }

  #audioStage { display:none; }
  #watchView.audiomode #ytplayer { display:none; }
  #watchView.audiomode #audioStage {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:1.1rem; position:absolute; inset:0; z-index:1; background:#000;
      padding:1.5rem; text-align:center; }
  #audioStage img[src=""], #audioStage img:not([src]) { display:none; }
  #audioStage img { width:min(58%, 240px); border-radius:.6rem; opacity:.92; }
  #audioStage .audiolabel { color:#fff; font-size:.92rem; display:flex; flex-direction:column; gap:.25rem; }
  #audioStage .audiolabel span { color:var(--muted); font-size:.78rem; }
  .cap-overlay { position:absolute; left:0; right:0; bottom:.5rem; text-align:center;
                 z-index:3; pointer-events:none; padding:0 .7rem; color:#fff; font-weight:600;
                 text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.6); }
  .cap-overlay:not(:empty) { font-size:clamp(.95rem,4.2vw,1.35rem); line-height:1.4; }
  .cap-overlay .capw { pointer-events:auto; cursor:pointer; padding:.03em .12em; border-radius:.25rem; }
  .cap-overlay .capw.has-card { color:#8fe6b3; }
  .cap-overlay .capw.pending { background:rgba(230,185,60,.30); box-shadow:inset 0 -2px 0 #e6b93c;
                               border-radius:3px; }
  .cap-overlay .capw:active { background:var(--accent); color:#0b1016; }
  .watchhint { flex:none; text-align:center; font-size:.7rem; color:var(--muted);
               padding:.4rem 0 .3rem; }
  .watchhint .dot { display:inline-block; width:.65em; height:.65em; border-radius:50%;
                    background:var(--ok); vertical-align:-.03em; margin:0 .15em; }
  .watchhint .dot.y { background:#e6b93c; }
  .transcript { flex:1; overflow-y:auto; padding:.4rem .9rem 2.5rem;
                -webkit-overflow-scrolling:touch; }
  .transcript::-webkit-scrollbar { width:0; }
  .transcript .cue { font-size:1.05rem; line-height:1.9; padding:.4rem .5rem;
                     border-radius:var(--r-sm); color:var(--muted);
                     transition:color .2s, background .2s; }
  .transcript .cue.on { color:var(--fg); background:var(--card-2);
                        box-shadow:inset 3px 0 0 var(--accent); }
  .transcript .cue-ts { background:none; border:none; color:var(--accent);
                        font-size:.7rem; padding:0 .4rem 0 0; vertical-align:.12em; cursor:pointer; }
  .transcript .cw { cursor:pointer; padding:.02em .06em; border-radius:.25rem;
                    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .transcript .cue.on .cw:active { background:var(--accent); color:#0b1016; }
  .transcript .cw.has-card { color:var(--ok); font-weight:650; }
  .transcript .cw.pending { background:rgba(230,185,60,.18); box-shadow:inset 0 -2px 0 rgba(230,185,60,.8);
                            color:var(--fg); border-radius:3px; }
  .transcript .cw.sel { background:var(--accent); color:#0b1016; box-shadow:none; }

  /* ---- song mode: audio + karaoke lyrics ---- */
  #loopBtn { display:none; }
  #watchView.song-mode #loopBtn { display:inline-flex; }
  #watchView.song-mode #audioBtn, #watchView.song-mode #fsBtn { display:none; }
  #loopBtn.on { background:var(--accent-soft); border-color:var(--accent); color:var(--fg); }
  #watchView.song-mode .player-wrap { aspect-ratio:auto; height:min(34vh, 300px); }
  #watchView.song-mode.audiomode #audioStage { gap:.6rem; }
  #watchView.song-mode #audioStage img { width:min(46%, 190px); box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #watchView.song-mode .watchhint { display:none; }
  #watchView.song-mode .transcript { padding:1rem 1.1rem 40vh; text-align:center; scroll-behavior:smooth; }
  #watchView.song-mode .transcript .cue { font-size:1.16rem; line-height:1.7; color:var(--muted);
                        padding:.5rem .4rem; opacity:.5; }
  #watchView.song-mode .transcript .cue.on { opacity:1; color:var(--fg); background:transparent;
                        box-shadow:none; font-weight:650; font-size:1.32rem; }
  #watchView.song-mode .transcript .cue-ts { display:none; }
  #watchView.song-mode .transcript .cw { padding:.04em .1em; }
  #watchView.song-mode .transcript .cue { position:relative; }
  .ly-icon { display:none; }
  #watchView.song-mode .transcript .cue .ly-icon {
      display:inline-block; margin-left:.4rem; font-size:.82rem; opacity:.32;
      background:none; border:0; cursor:pointer; vertical-align:.06em;
      -webkit-tap-highlight-color:transparent; transition:opacity .15s, transform .1s; }
  #watchView.song-mode .transcript .cue.on .ly-icon { opacity:.7; }
  .ly-icon:active { transform:scale(.85); }
  .ly-icon.has { opacity:.8 !important; filter:saturate(1.3); }

  /* inline approve/deny popover for a suggested card, shown over the watch view */
  #transSheet, #lyricSheet { position:fixed; inset:0; z-index:42; background:rgba(6,8,11,.55);
                display:flex; align-items:flex-end; justify-content:center;
                -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #transSheet[hidden], #lyricSheet[hidden] { display:none; }
  #transSheet .ts-card, #lyricSheet .ts-card { width:100%; max-width:40rem; background:var(--card);
                border:1px solid var(--line); border-bottom:0;
                border-radius:1rem 1rem 0 0; padding:1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
                animation:tsIn .2s ease; max-height:82vh; overflow-y:auto; }
  @keyframes tsIn { from { transform:translateY(100%); } }
  #lyricSheet .ly-ru { font-size:1.05rem; line-height:1.55; color:var(--fg); font-weight:600;
                       border-left:2px solid var(--accent); padding-left:.7rem; margin-bottom:.9rem; }
  #lyricSheet .ly-tr { font-size:1.12rem; line-height:1.5; color:var(--fg); margin-bottom:.7rem; }
  #lyricSheet .ly-gist { font-size:.92rem; line-height:1.6; color:var(--fg-dim); margin-bottom:.8rem; }
  #lyricSheet .ly-notes { list-style:none; display:flex; flex-direction:column; gap:.55rem; }
  #lyricSheet .ly-notes li { font-size:.88rem; line-height:1.55; color:var(--fg-dim);
                       background:var(--card-2); border:1px solid var(--line-soft);
                       border-radius:var(--r-sm); padding:.55rem .65rem; padding-left:1.7rem; position:relative; }
  #lyricSheet .ly-notes li::before { content:"✦"; position:absolute; left:.6rem; top:.55rem; color:var(--accent); font-size:.8rem; }
  #lyricSheet .ly-load { display:flex; gap:.5rem; align-items:center; color:var(--muted); font-size:.9rem; padding:.6rem 0; }
  #lyricSheet .ts-btns { display:flex; gap:.5rem; margin-top:1.1rem; }
  #lyricSheet .ts-btns button { flex:1; padding:.65rem; border-radius:var(--r-sm);
                border:1px solid var(--line); background:var(--card-2); color:var(--fg-dim); font-size:.9rem; cursor:pointer; }
  #lyricSheet .ts-btns .ts-card-btn { color:var(--accent); border-color:rgba(90,150,220,.4); }
  #transSheet .ts-ru { font-size:.95rem; line-height:1.6; color:var(--muted);
                       border-left:2px solid var(--line); padding-left:.7rem; margin-bottom:.9rem; }
  #transSheet .ts-en { font-size:1.12rem; line-height:1.6; color:var(--fg); min-height:1.4em;
                       display:flex; gap:.5rem; align-items:baseline; flex-wrap:wrap; }
  #transSheet .ts-btns { display:flex; gap:.5rem; margin-top:1.1rem; }
  #transSheet .ts-btns button { flex:1; padding:.65rem; border-radius:var(--r-sm);
                border:1px solid var(--line); background:var(--card-2); color:var(--fg-dim);
                font-size:.9rem; cursor:pointer; }
  #transSheet .ts-btns .ts-card-btn { color:var(--accent); border-color:rgba(90,150,220,.4); }
  #inlineDecide { position:fixed; z-index:40; max-width:min(78vw,300px);
                  background:var(--card); border:1px solid var(--line); border-radius:var(--r-sm);
                  box-shadow:var(--sh); padding:.65rem .7rem; }
  #inlineDecide[hidden] { display:none; }
  #inlineDecide .id-head { font-size:.92rem; line-height:1.35; margin-bottom:.35rem; }
  #inlineDecide .id-head span { color:var(--muted); }
  #inlineDecide .id-freq { font-size:.75rem; margin-bottom:.55rem; min-height:1px; }
  #inlineDecide .id-freq:empty { display:none; }
  #inlineDecide .id-btns { display:flex; gap:.5rem; }
  #inlineDecide button { flex:1; padding:.5rem .55rem; border-radius:var(--r-sm); font-size:.85rem;
                         font-weight:650; border:1px solid; cursor:pointer; }
  #inlineDecide .id-yes { background:var(--yes); border-color:var(--yes); color:#08160d; }
  #inlineDecide .id-no  { background:transparent; border-color:var(--line); color:var(--fg-dim); }
  #inlineDecide .id-no:active { border-color:var(--no); color:var(--no); }
  #inlineDecide .id-more { display:block; width:100%; margin-top:.5rem; background:none;
                           border:0; color:var(--accent); font-size:.76rem; cursor:pointer; text-align:left; }

  /* immersive / fullscreen watch — video fills the view, caption stays on top */
  #watchView.fs { padding:0; background:#000;
                  overflow:hidden; overscroll-behavior:none;
                  touch-action:none; -webkit-user-select:none; user-select:none; }
  #watchView.fs .watchbar, #watchView.fs .watchhint, #watchView.fs .transcript,
  #watchView.fs .wctrls { display:none; }
  #watchView.fs .player-wrap { flex:1; aspect-ratio:auto; height:100%; }
  /* portrait fullscreen: pin the video to the top, leave one clean black area
     below for the captions + the seek-swipe (no centred letterbox top & bottom) */
  @media (orientation:portrait) {
    #watchView.fs .player-wrap video, #watchView.fs .player-wrap iframe,
    #watchView.fs .player-wrap #ytplayer {
      top:calc(env(safe-area-inset-top) + .2rem); bottom:auto; height:auto;
      aspect-ratio:16/9; object-fit:contain; }
  }
  #watchView.fs .cap-overlay { bottom:4.4rem; }
  /* while paused the scrubber owns the bottom strip — lift captions clear of it */
  #watchView.paused .cap-overlay { bottom:3rem; }
  #watchView.paused.fs .cap-overlay { bottom:6.4rem; }
  #watchView.fs .cap-overlay:not(:empty) { font-size:clamp(1.05rem, 3.6vh, 1.9rem); }

  .fs-exit { display:none; }
  #watchView.fs .fs-exit {
      display:flex; align-items:center; justify-content:center; z-index:6; position:absolute;
      top:calc(.9rem + env(safe-area-inset-top)); right:calc(.9rem + env(safe-area-inset-right));
      width:2.6rem; height:2.6rem; border-radius:50%; color:#fff;
      background:rgba(18,18,20,.5); border:1px solid rgba(255,255,255,.18);
      -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
      box-shadow:0 4px 16px rgba(0,0,0,.3); transition:opacity .3s ease, transform .1s; }
  #watchView.fs .fs-exit svg { width:1.3rem; height:1.3rem; }
  #watchView.fs .fs-exit:active { background:var(--accent); transform:scale(.92); }
  #watchView.fs.hidectrls .fs-exit { opacity:0; pointer-events:none; }

  /* scrubber — a thin progress line while paused. It never intercepts a touch;
     only the knob is draggable. Grabbing the knob "arms" the bar so you can then
     also tap along the track. Auto-disarms after a few seconds / on play. */
  .scrubber { position:absolute; left:0; right:0; bottom:0; z-index:7;
              padding:.55rem 1rem calc(.55rem + env(safe-area-inset-bottom));
              background:linear-gradient(transparent, rgba(0,0,0,.5));
              opacity:0; pointer-events:none; transition:opacity .2s; touch-action:none; }
  #watchView.paused .scrubber { opacity:1; }
  #watchView.paused .scrubber.armed { pointer-events:auto; }
  .scrub-track { position:relative; height:3px; border-radius:99px;
                 background:rgba(255,255,255,.3); transition:height .12s; }
  .scrub-fill { position:absolute; left:0; top:0; bottom:0; width:0;
                background:rgba(255,255,255,.55); border-radius:99px; transition:width .1s linear; }
  .scrub-knob { position:absolute; top:50%; left:0; width:14px; height:14px; margin-left:-7px;
                border-radius:50%; background:#fff; transform:translateY(-50%);
                box-shadow:0 1px 5px rgba(0,0,0,.6); transition:left .1s linear, width .12s, height .12s;
                pointer-events:auto; }
  #watchView.paused .scrub-knob::after { content:""; position:absolute; inset:-16px; }  /* fat touch target */
  .scrub-time { color:#fff; font-size:.72rem; margin-top:.4rem; opacity:0; height:0; overflow:hidden;
                transition:opacity .12s; font-variant-numeric:tabular-nums; text-shadow:0 1px 3px rgba(0,0,0,.9); }
  .scrubber.armed .scrub-track { height:6px; }
  .scrubber.armed .scrub-fill { background:var(--accent); }
  .scrubber.armed .scrub-knob { width:18px; height:18px; margin-left:-9px; }
  .scrubber.armed .scrub-time { opacity:1; height:auto; }
  .scrubber.dragging .scrub-fill, .scrubber.dragging .scrub-knob { transition:none; }
  .scrub-preview { position:absolute; bottom:calc(100% - .2rem); transform:translateX(-50%);
                   opacity:0; pointer-events:none; transition:opacity .12s; text-align:center; }
  .scrubber.scrubbing .scrub-preview { opacity:1; }
  .scrub-preview img { display:block; width:9.5rem; max-width:38vw; aspect-ratio:16/9; object-fit:cover;
                       border-radius:.4rem; background:#000; border:1px solid rgba(255,255,255,.25); }
  .scrub-preview span { display:block; margin-top:.15rem; color:#fff; font-size:.7rem;
                        font-variant-numeric:tabular-nums; text-shadow:0 1px 3px rgba(0,0,0,.9); }

  /* landscape on a phone, not fullscreen: give the video the height, transcript the rest */
  @media (orientation:landscape) and (max-height:540px) {
    #watchView:not(.fs) { flex-flow:row wrap; align-content:flex-start; }
    #watchView:not(.fs) .watchbar { flex-basis:100%; }
    #watchView:not(.fs) .player-wrap { flex:0 0 auto; height:calc(100dvh - 2.6rem);
        width:auto; max-width:72vw; }
    #watchView:not(.fs) .wctrls { position:absolute; left:0; right:auto; bottom:0;
        width:72vw; max-width:72vw; z-index:4; background:linear-gradient(transparent, rgba(0,0,0,.5)); }
    #watchView:not(.fs) .wctrls button { background:rgba(20,20,20,.55); color:#fff;
        border-color:rgba(255,255,255,.22); }
    #watchView:not(.fs) .watchhint { display:none; }
    #watchView:not(.fs) .transcript { flex:1 1 40%; height:calc(100dvh - 2.6rem); }
  }

  /* ---------------- reading ---------------- */
  .lib-card { display:flex; gap:.75rem; align-items:center; background:var(--card);
              border:1px solid var(--line-soft); border-radius:var(--r);
              padding:.7rem .8rem; margin:.5rem 0; cursor:pointer;
              transition:transform .1s, background .15s, border-color .15s; }
  .lib-card:active { transform:scale(.99); background:var(--card-2); }
  .lib-card .bk { width:34px; height:46px; flex:none; border-radius:.2rem;
                  background:linear-gradient(135deg,var(--accent),#3f6d94);
                  display:flex; align-items:center; justify-content:center;
                  color:#0b1016; font-size:1.1rem; box-shadow:var(--sh); }
  .lib-card .body { flex:1; min-width:0; }
  .lib-card .t { font-size:.92rem; font-weight:600; line-height:1.3; }
  .lib-card .m { font-size:.75rem; color:var(--muted); margin-top:.2rem; }
  .lib-card .rbar { height:3px; background:var(--line); border-radius:2px; margin-top:.4rem; overflow:hidden; }
  .lib-card .rbar i { display:block; height:100%; background:var(--accent); }
  .chan.arch-head { opacity:.7; font-size:.72rem; margin-top:1.4rem; }
  .lib-card.arch { cursor:default; opacity:.85; }
  .lib-card.arch .bk { background:var(--line); color:var(--muted); }
  .arch-acts { display:flex; gap:.5rem; margin-top:.45rem; }
  .arch-acts button { font-size:.74rem; padding:.32rem .6rem; border-radius:.4rem;
                      border:1px solid var(--line); background:var(--card-2); color:var(--fg-dim); cursor:pointer; }
  .arch-acts button.danger { color:var(--no); border-color:color-mix(in srgb, var(--no) 45%, var(--line)); }

  #readView, #wordView { position:fixed; inset:0; z-index:15; background:var(--bg);
              flex-direction:column;
              padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #readView[hidden], #wordView[hidden] { display:none; }
  #readView:not([hidden]), #wordView:not([hidden]) { display:flex; }

  /* ---- in-app SRS ---- */
  #studyBanner { display:flex; align-items:center; gap:.7rem; width:100%; text-align:left;
                 background:linear-gradient(135deg, var(--accent), #3f6d94); color:#0b1016;
                 border:0; border-radius:var(--r); padding:.85rem 1rem; margin:.2rem 0 .6rem;
                 cursor:pointer; font:inherit; box-shadow:var(--sh);
                 transition:background .2s, color .2s, box-shadow .2s; }
  #studyBanner:active { transform:scale(.99); }
  #studyBanner .sb-ico { font-size:1.4rem; }
  #studyBanner .sb-main { flex:1; min-width:0; }
  #studyBanner .sb-t { font-weight:750; font-size:1rem; }
  #studyBanner .sb-m { font-size:.8rem; opacity:.8; }
  #studyBanner .sb-go { font-size:1.3rem; font-weight:700; }
  #studyBanner[hidden] { display:none; }
  /* caught-up: quiet, "done" look instead of the call-to-action gradient */
  #studyBanner.done { background:var(--card-2); color:var(--fg-dim);
                      border:1px solid rgba(67,176,114,.35); box-shadow:none; padding:.7rem 1rem; }
  #studyBanner.done .sb-t { font-weight:650; color:var(--ok); }
  #studyBanner.done .sb-m { opacity:.7; }
  #studyBanner.done .sb-go { color:var(--muted); font-size:1rem; }
  .home-links { display:flex; gap:.5rem; margin:-.2rem 0 .7rem; }
  .home-links[hidden] { display:none; }
  .home-links button { flex:1; background:var(--card-2); border:1px solid var(--line-soft);
                       color:var(--fg-dim); border-radius:var(--r-sm); padding:.5rem; font-size:.85rem; cursor:pointer; }
  .home-links button:active { background:var(--line-soft); }

  #studyView { position:fixed; inset:0; z-index:14; background:var(--bg); flex-direction:column;
               padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #studyView[hidden] { display:none; }
  #studyView:not([hidden]) { display:flex; }
  #statsView { position:fixed; inset:0; z-index:16; background:var(--bg); flex-direction:column;
               padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #statsView[hidden] { display:none; }
  #statsView:not([hidden]) { display:flex; }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; margin:.6rem 0 1.4rem; }
  .stat-cell { background:var(--card-2); border:1px solid var(--line-soft); border-radius:var(--r-sm);
               padding:.7rem .5rem; text-align:center; }
  .stat-cell .v { font-size:1.5rem; font-weight:750; }
  .stat-cell .k { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:.2rem; }
  .stat-h { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;
            margin:1.2rem 0 .5rem; }
  .cal { display:flex; gap:2px; align-items:flex-end; height:80px; }
  .cal i { flex:1; background:var(--accent); border-radius:1px; min-height:2px; opacity:.85; }
  .cal i.z { background:var(--line); opacity:1; }
  .cal-x { display:flex; justify-content:space-between; font-size:.68rem; color:var(--muted); margin-top:.3rem; }
  .mix { display:flex; height:14px; border-radius:99px; overflow:hidden; background:var(--line); }
  .mix i.mnew { background:#e6b93c; } .mix i.mlearn { background:#5b9bd5; }
  .mix i.mrev { background:var(--accent); } .mix i.mmat { background:var(--ok); }
  .mix-legend { display:flex; flex-wrap:wrap; gap:.7rem; font-size:.75rem; color:var(--muted); margin-top:.5rem; }
  .mix-legend span::before { content:"●"; margin-right:.3rem; }
  .mix-legend .lnew::before { color:#e6b93c; } .mix-legend .llearn::before { color:#5b9bd5; }
  .mix-legend .lrev::before { color:var(--accent); } .mix-legend .lmat::before { color:var(--ok); }
  .stat-cell.tap { cursor:pointer; } .stat-cell.tap:active { background:var(--line-soft); }
  .mix-legend span.tap { cursor:pointer; text-decoration:underline; text-decoration-style:dotted; }

  #cardsView, #vidDelView { position:fixed; inset:0; z-index:16; background:var(--bg); flex-direction:column;
               padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #cardsView[hidden], #vidDelView[hidden] { display:none; }
  #cardsView:not([hidden]), #vidDelView:not([hidden]) { display:flex; }
  #vidDelView { z-index:17; }
  .vd-head { padding:.9rem .95rem .3rem; font-size:.95rem; line-height:1.5; color:var(--fg-dim); }
  .vd-head b { color:var(--fg); }
  .vd-actions { display:flex; flex-direction:column; gap:.5rem; padding:.5rem .95rem .7rem;
                border-bottom:1px solid var(--line-soft); }
  .vd-actions button { padding:.7rem .9rem; border-radius:var(--r-sm); border:1px solid var(--line);
                background:var(--card-2); color:var(--fg); font-size:.9rem; text-align:left;
                display:flex; flex-direction:column; gap:.15rem; cursor:pointer; }
  .vd-actions button .sub { font-size:.76rem; color:var(--muted); }
  .vd-actions button.keep { border-color:var(--accent); background:var(--accent-soft); }
  .vd-actions button.danger { border-color:color-mix(in srgb, var(--no) 55%, var(--line)); }
  .vd-actions button.danger .lbl { color:var(--no); }
  .vd-actions button:active { filter:brightness(1.15); }
  #vdBody .cl-count { position:sticky; top:0; background:var(--bg); }

  .cl-row .cl-exp .cl-sent b { color:var(--accent); font-weight:700; }
  .cl-row .cl-exp .cl-acc { color:var(--muted); font-size:.8rem; margin-top:.2rem; }

  .cl-row .cl-exp .cl-acts button { flex:1; padding:.45rem; border-radius:var(--r-sm); border:1px solid var(--line);
                                    background:var(--card-2); color:var(--fg-dim); font-size:.82rem; cursor:pointer; }
  .cl-row .cl-exp .cl-acts button.cl-del:active { border-color:var(--no); color:var(--no); }

  .cl-row .cl-edit { display:none; margin-top:.6rem; }

  .cl-edit label { display:block; font-size:.72rem; color:var(--muted); margin-bottom:.5rem; text-transform:uppercase; letter-spacing:.04em; }
  .cl-edit input, .cl-edit textarea { display:block; width:100%; margin-top:.15rem; background:var(--card-2);
      border:1px solid var(--line); color:var(--fg); border-radius:.35rem; padding:.4rem .5rem; font:inherit; font-size:.9rem; }
  .cl-edit textarea { resize:vertical; }
  .cl-edit .ce-save { color:var(--accent); border-color:rgba(90,150,220,.4); }
  .studybar { display:flex; align-items:center; gap:.5rem; padding:.5rem .9rem; flex:none;
              border-bottom:1px solid var(--line-soft); }
  .studybar .prog { flex:1; text-align:center; font-size:.82rem; color:var(--muted);
                    font-variant-numeric:tabular-nums; }
  .studybar .prog b { color:var(--fg); }
  .studybar .sbtn { background:none; border:1px solid var(--line); color:var(--muted);
                    border-radius:.4rem; padding:.25rem .55rem; font-size:.8rem; cursor:pointer; }
  .studybar .sbtn:disabled { opacity:.35; }
  .studybody { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
               display:flex; flex-direction:column; }
  .study-scroll { flex:1; overflow-y:auto; padding:1.4rem 1.15rem 1rem;
                  display:flex; flex-direction:column; gap:1rem; }
  .study-q { font-size:1.4rem; line-height:1.5; text-align:center; margin:auto 0; }
  .study-q b { color:var(--accent); font-weight:750; }
  .study-a { border-top:1px solid var(--line); padding-top:1rem; text-align:center; }
  .study-a .a-tr { font-size:1.5rem; font-weight:650; }
  .study-a .a-acc { color:var(--muted); font-size:1rem; margin-top:.25rem; }
  .study-a .a-clip { display:block; margin:1rem auto 0; max-width:15rem; width:100%;
                     border-radius:.5rem; overflow:hidden; border:1px solid var(--line);
                     background:var(--card-2); cursor:pointer; position:relative; }
  .study-a .a-clip img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; }
  .study-a .a-clip .a-play { position:absolute; left:.4rem; bottom:.4rem; font-size:.75rem;
                             background:rgba(0,0,0,.6); color:#fff; padding:.15rem .45rem; border-radius:.3rem; }
  .study-a .a-clip.noimg img { display:none; }
  .study-a .a-clip.noimg::after { content:"▶ watch this moment"; display:block; padding:.7rem; font-size:.85rem; color:var(--accent); }
  .study-a .a-replay { background:var(--card-2); border:1px solid var(--line); color:var(--fg);
                       border-radius:99px; padding:.4rem .9rem; font-size:.85rem; cursor:pointer; margin-bottom:.6rem; }
  .study-a .a-replay:active { border-color:var(--accent); }
  .study-listen { margin:auto 0; text-align:center; }
  .study-listen .listen-btn { background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent);
                              border-radius:99px; padding:1rem 2rem; font-size:1.2rem; font-weight:650; cursor:pointer; }
  .study-listen .listen-btn:active { transform:scale(.97); }
  .study-listen .listen-hint { color:var(--muted); font-size:.85rem; margin-top:.8rem; }
  .study-a .a-links { margin-top:.8rem; font-size:.82rem; }
  .study-a .a-links button { background:none; border:0; color:var(--accent); cursor:pointer; font:inherit;
                             text-decoration:underline; padding:.2rem; }
  .study-foot { flex:none; padding:.7rem .8rem calc(.7rem + env(safe-area-inset-bottom));
                border-top:1px solid var(--line-soft); background:var(--bg); }
  .study-show { width:100%; padding:.95rem; border-radius:var(--r-sm); border:1px solid var(--accent);
                background:var(--accent-soft); color:var(--accent); font-size:1rem; font-weight:650; cursor:pointer; }
  .study-tap { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .study-tap:active { background:var(--card-2); }
  .study-rate { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
  .study-rate button { padding:.7rem .3rem; border-radius:var(--r-sm); border:1px solid var(--line);
                       background:var(--card-2); color:var(--fg); cursor:pointer; display:flex;
                       flex-direction:column; align-items:center; gap:.15rem; }
  .study-rate button .rl { font-size:.9rem; font-weight:650; }
  .study-rate button .ri { font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  .study-rate button.again { border-color:rgba(224,90,90,.5); }
  .study-rate button.again .rl { color:var(--no); }
  .study-rate button.good { border-color:rgba(67,176,114,.45); }
  .study-rate button.good .rl { color:var(--ok); }
  .study-rate button:active { background:var(--line-soft); }
  .study-done { text-align:center; margin:auto; padding:2rem 1rem; }
  .study-done .big { font-size:2.4rem; }
  .study-done .msg { font-size:1.1rem; font-weight:600; margin-top:.6rem; }
  .study-done .sub { color:var(--muted); font-size:.85rem; margin-top:.4rem; }
  .study-done .study-set { display:block; margin-top:1.1rem; font-size:.85rem; color:var(--fg-dim);
                           text-decoration:none; }
  .study-done .study-set input { vertical-align:-.1em; margin-right:.4rem; }
  .wordbody { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:1rem 1.1rem 3rem; }
  .wordbody .w-hd { font-size:1.6rem; font-weight:750; }
  .wordbody .w-tr { color:var(--accent); font-size:1.05rem; margin-top:.2rem; }
  .wordbody .w-pill { display:inline-block; font-size:.68rem; text-transform:uppercase;
                      letter-spacing:.06em; padding:.15em .5em; border-radius:.35rem;
                      margin-top:.5rem; border:1px solid var(--line); color:var(--muted); }
  .wordbody .w-pill.carded { color:var(--ok); border-color:rgba(67,176,114,.4); }
  .wordbody .w-pill.pending { color:#e6b93c; border-color:rgba(230,185,60,.4); }
  .wordbody .w-discard { display:block; margin-top:.7rem; font-size:.78rem;
                         background:transparent; border:1px solid var(--line);
                         color:var(--muted); border-radius:.35rem; padding:.3em .7em; cursor:pointer; }
  .wordbody .w-discard:active { border-color:var(--no); color:var(--no); }
  .wordbody .w-fam { margin-top:.7rem; font-size:.8rem; color:var(--muted); }
  .wordbody .w-fam b { color:var(--fg-dim); font-weight:600; }
  .wordbody .w-vid { margin-top:1.3rem; }
  .wordbody .w-vid .w-vt { font-size:.9rem; font-weight:650; display:flex; gap:.5rem; align-items:center; }
  .wordbody .w-vid .w-vt .n { color:var(--muted); font-weight:400; font-size:.8rem; }
  .wordbody .w-hit { display:block; width:100%; text-align:left; background:var(--card-2);
                     border:1px solid var(--line-soft); border-radius:var(--r-sm);
                     padding:.55rem .7rem; margin:.4rem 0; cursor:pointer; line-height:1.45;
                     font-size:.9rem; color:var(--fg); }
  .wordbody .w-hit:active { border-color:var(--accent); }
  .wordbody .w-hit .t { color:var(--accent); font-size:.72rem; margin-right:.4rem; font-variant-numeric:tabular-nums; }
  .readbar { display:flex; align-items:center; gap:.5rem; padding:.5rem .9rem;
             border-bottom:1px solid var(--line-soft); flex:none; }
  .readbar .rtitle { flex:1; min-width:0; font-size:.82rem; color:var(--fg-dim);
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }
  .ricon { background:none; border:0; color:var(--muted); padding:.25rem .35rem; cursor:pointer;
           display:inline-flex; align-items:baseline; gap:.05rem; }
  .ricon svg { width:1.15rem; height:1.15rem; fill:none; }
  #rReviewBtn { position:relative; font-size:1rem; }
  .rbadge { position:absolute; top:-2px; right:-4px; background:var(--accent); color:#0b1016;
            font-size:.6rem; font-weight:700; line-height:1; padding:.12rem .22rem;
            border-radius:.5rem; min-width:.9rem; text-align:center; }
  .rbadge:empty { display:none; }
  #fontBtn span:first-child { font-size:1rem; font-weight:700; }
  #fontBtn span:last-child { font-size:.7rem; }
  .rprogress { height:2px; background:var(--line-soft); flex:none; }
  .rprogress .rfill { height:100%; background:var(--accent); width:0; transition:width .2s; }
  .readbody { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
              padding:1.4rem 1.15rem 3rem;
              font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
              font-size:var(--rfs,1.12rem); line-height:1.75; color:var(--fg);
              max-width:38rem; margin:0 auto; width:100%; }
  #readView[data-fs="s"]  { --rfs:1rem; }
  #readView[data-fs="m"]  { --rfs:1.12rem; }
  #readView[data-fs="l"]  { --rfs:1.28rem; }
  #readView[data-fs="xl"] { --rfs:1.46rem; }
  .readbody p, .readbody .rp { margin:0 0 1.05em; }
  .readbody .rw { cursor:pointer; border-radius:3px; padding:0 .04em;
                  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
                  -webkit-tap-highlight-color:transparent; }
  .readbody .rw:active { background:var(--accent); color:#0b1016; }
  .readbody .rw.carded, .readbody .rw.has-card { color:#8fe6b3; font-weight:600; }
  .readbody .rw.pending { background:rgba(230,185,60,.22); box-shadow:inset 0 -2px 0 rgba(230,185,60,.8);
                          border-radius:3px; }
  .readbody .rw.sel { background:var(--accent); color:#0b1016; box-shadow:none; }
  .readbody .rh { font-weight:750; font-size:1.05em; margin:1.4em 0 .7em; display:block; color:var(--muted);
                  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
                  letter-spacing:.02em; }
  .readbody .rh:first-child { margin-top:0; }
  .readnav { display:flex; align-items:center; justify-content:space-between;
             padding:.5rem 1rem; border-top:1px solid var(--line-soft); flex:none;
             font-size:.8rem; color:var(--muted); }
  .readnav[hidden] { display:none; }
  .readnav .backlink { font-size:.82rem; }
  .readnav .backlink[disabled] { opacity:.3; pointer-events:none; }
  #tocPanel { position:absolute; top:0; right:0; bottom:0; width:min(80vw,320px);
              background:var(--card); border-left:1px solid var(--line); z-index:5;
              padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
              display:flex; flex-direction:column; box-shadow:-8px 0 30px rgba(0,0,0,.4);
              animation:tocIn .18s ease; }
  @keyframes tocIn { from { transform:translateX(100%); } }
  #tocPanel[hidden] { display:none; }
  .toc-head { padding:1rem 1.1rem .6rem; font-size:.7rem; text-transform:uppercase;
              letter-spacing:.07em; color:var(--muted); font-weight:700; }
  #tocList { overflow-y:auto; flex:1; }
  #tocList button { display:block; width:100%; text-align:left; background:none; border:0;
                    color:var(--fg-dim); padding:.7rem 1.1rem; font-size:.88rem;
                    border-bottom:1px solid var(--line-soft); cursor:pointer; line-height:1.35; }
  #tocList button.on { color:var(--accent); background:var(--accent-soft); }
  #tocList button:active { background:var(--card-2); }

  #pasteWrap { position:fixed; inset:0; background:rgba(6,8,11,.6); z-index:20;
               align-items:center; justify-content:center; padding:1rem;
               -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #pasteWrap[hidden] { display:none; }
  #pasteWrap:not([hidden]) { display:flex; }
  #pasteWrap textarea { width:100%; margin-top:.5rem; padding:.7rem .8rem; font-size:.95rem;
                        border:1px solid var(--line); border-radius:var(--r-sm);
                        background:var(--card); color:var(--fg); resize:vertical;
                        font-family:inherit; -webkit-appearance:none; }

  .toast { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%);

</style>

<body>
<header>
  <h1>ru-anki</h1>
  <span class="sub" id="netpill"><span class="netdot"></span><span id="netword">…</span></span>
  <span class="hdr-right">
    <button class="pill" id="queuePill" hidden onclick="flushQueue(true); flushSrs().then(()=>{refreshQueuePill();refreshStudyBanner();})"></button>
    <button class="iconbtn" id="refreshBtn" aria-label="reload the app" onclick="hardRefresh()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
    </button>
  </span>
</header>
<div id="connBanner" hidden onclick="probeHealth()"></div>

<main>
  <!-- LIST VIEW -->
  <div id="listView">
    <div class="addbar">
      <input type="text" id="url" placeholder="Paste a video, song (YouTube / Apple Music), article or book link"
             autocapitalize="off" autocomplete="off" spellcheck="false"
             onkeydown="if(event.key==='Enter')addVideo()">
      <button class="btn" id="addBtn" onclick="addVideo()">Add</button>
      <button class="btn ghost" id="addSongBtn" onclick="addSong()" title="add as a song — pulls synced lyrics">🎵</button>
    </div>
    <div class="status">
      model
      <select id="model" class="minisel">
        <option value="sonnet">Sonnet 5</option>
        <option value="haiku">Haiku 4.5</option>
      </select>
      <span id="addStatus"></span>
    </div>
    <!-- reading feature — kept, hidden behind READING_ENABLED -->
    <div class="status" id="readingControls" hidden>
      <button class="backlink" onclick="$('#fileInput').click()">＋ import a book / text</button>
      <button class="backlink" id="pasteBtn" onclick="openPaste()">paste</button>
      <input type="file" id="fileInput" accept=".epub,.txt,text/plain,application/epub+zip"
             hidden onchange="importFile(this.files[0])">
    </div>
    <button id="studyBanner" hidden onclick="openStudy()">
      <span class="sb-ico">🧠</span>
      <span class="sb-main"><span class="sb-t" id="studyBannerT">Study</span>
        <span class="sb-m" id="studyBannerM"></span></span>
      <span class="sb-go">→</span>
    </button>
    <div class="home-links" id="homeLinks" hidden>
      <button onclick="openCardList('all','All cards')">🗂 all cards</button>
      <button onclick="openStats()">📊 stats</button>
      <button id="orphanLink" hidden onclick="openCardList('orphan','Cards with no source')"></button>
    </div>
    <div id="videoList"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="detailView" hidden>
    <button class="backlink" onclick="history.back()">← back</button>
    <div class="vhead" id="vhead"></div>
    <button class="btn watch-cta" id="watchBtn" onclick="openWatch(CURRENT)">▶ Watch with captions</button>
    <button class="btn watch-cta" id="readBtn" hidden onclick="openReader(CURRENT)">📖 Read</button>
    <div id="offlineRow" class="status"></div>
    <div id="mediaRow" class="status"></div>
    <div id="transcribeRow" class="status"></div>
    <div id="progressPanel"></div>

    <div class="panel" id="lookupPanel">
      <h3>Look up a word</h3>
      <input type="search" id="q" placeholder="Type part of a word you heard"
             autocapitalize="off" autocomplete="off" spellcheck="false"
             oninput="debouncedSearch()">
      <div class="status" id="liveStatus"></div>
      <div id="results"></div>
    </div>

    <div class="panel" id="reviewPanel">
      <div class="rowhead">
        <button class="rvtoggle" id="reviewHead" onclick="toggleReview()">Review</button>
        <div>
          <button class="backlink" onclick="loadCandidates(true)">reload</button>
          <button class="backlink" onclick="resetAndReExtract()">discard all &amp; re-extract</button>
        </div>
      </div>
      <div class="sortrow" id="sortRow">
        sort
        <select class="minisel" id="reviewSort" onchange="setReviewSort(this.value)">
          <option value="yield">most repeated</option>
          <option value="rare">rarest</option>
          <option value="common">most common</option>
          <option value="order">in order</option>
        </select>
      </div>
      <div id="cards"></div>
    </div>

    <button class="backlink danger" onclick="deleteVideo()">Delete this video</button>
  </div>

  <!-- WATCH VIEW -->
  <div id="watchView" hidden>
    <div class="watchbar">
      <button class="backlink" onclick="history.back()">← back</button>
      <div class="speeds" id="speeds">
        <button data-r="0.75">0.75×</button>
        <button data-r="1" class="on">1×</button>
        <button data-r="1.25">1.25×</button>
      </div>
    </div>
    <div class="player-wrap">
      <div id="ytplayer"></div>
      <button class="tap-layer" onclick="tapVideo()" aria-label="play / pause"></button>
      <div id="capOverlay" class="cap-overlay"></div>
      <div id="seekFlash"></div>
      <div id="audioStage">
        <img id="audioArt" alt="">
        <div class="audiolabel">🎧 background audio<span>lock the screen — it keeps playing</span></div>
      </div>
      <button class="fs-exit" onclick="exitFs()" aria-label="exit full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v3a2 2 0 0 1-2 2H4M20 9h-3a2 2 0 0 1-2-2V4M4 15h3a2 2 0 0 1 2 2v3M15 20v-3a2 2 0 0 1 2-2h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="scrubber" id="scrubber">
        <div class="scrub-preview" id="scrubPreview"><img id="scrubPreviewImg" alt=""><span id="scrubPreviewT"></span></div>
        <div class="scrub-track" id="scrubTrack"><div class="scrub-fill" id="scrubFill"></div><div class="scrub-knob" id="scrubKnob"></div></div>
        <div class="scrub-time" id="scrubTime"></div>
      </div>
    </div>
    <div class="wctrls">

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const READING_ENABLED = true;   // reading: URL/paste/EPUB import + tap-to-card reader
let VIDEOS = [];
let TEXTS = [];
let ARCHIVED = [];
let READ = null;             // legacy paste/epub reader
let READER_MODE = false, READER_ID = null, READER_CH = [];
let CURRENT = null;          // video id in detail view
let DETAIL_V = null;
let listTimer = null, sse = null, tickTimer = null, searchTimer = null;
// watch view
let ytPlayer = null, ytApiP = null, capTimer = null, WP = null, localURL = null;
let WDATA = null, bgAudio = null, audioMode = false, audioURL = null, audioUserPaused = false;
let audioSrc = null, audioSrcIsBlob = false, autoSwapped = false;
let SONG_MODE = false, SONG_LOOP = false;
let WCUES = [], WCANDS = {}, wActive = -1, wUserScroll = 0, wPausedForModal = false, capHidden = false;

function toast(msg, ms=2400) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms);
}
async function api(path, opts) {
  let r;
  try {
    r = await fetch(path, opts);
  } catch (e) {
    if (navigator.onLine && !/client-log/.test(path)) logClient('api.fetch', e, { path });
    throw e;
  }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status >= 500) logClient('api.http' + r.status, new Error(body.detail || r.statusText), { path });
    throw new Error(body.detail || r.statusText);
  }
  return body;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
// ship JS errors to the server log so bugs are diagnosable after the fact
let _logCount = 0;
function logClient(tag, err, ctx) {
  if (_logCount++ > 40) return;
  try {
    const msg = err && (err.stack || err.message || err.reason || String(err)) || 'unknown';
    const payload = JSON.stringify({ tag, msg: String(msg), ctx: ctx || {},
      ua: navigator.userAgent, url: location.pathname + location.search });
    if (navigator.sendBeacon)
      navigator.sendBeacon('/client-log', new Blob([payload], { type: 'application/json' }));
    else
      fetch('/client-log', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: payload, keepalive: true }).catch(() => {});
  } catch {}
}
addEventListener('error', e => logClient('window.error', e.error || e.message,
  { src: e.filename, line: e.lineno, col: e.colno }));
addEventListener('unhandledrejection', e => logClient('unhandledrejection', e.reason));
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}

/* ---------------- ui helpers ---------------- */
function setBusy(btn, on, label) {
  if (!btn) return;
  if (on) {
    if (btn.dataset.label == null) btn.dataset.label = btn.innerHTML;
    btn.disabled = true;
    // build the spinner once; later calls only touch the label text node so the
    // CSS animation never restarts (that was the "stutter" on fast updates)
    if (!btn.querySelector('.spin'))
      btn.innerHTML = '<span class="spin"></span><span class="busy-label"></span>';
    const l = btn.querySelector('.busy-label');
    if (l) l.textContent = label ? ' ' + label : '';
  } else {
    btn.disabled = false;
    if (btn.dataset.label != null) { btn.innerHTML = btn.dataset.label; delete btn.dataset.label; }
  }
}
const SPINNER = '<div class="center-spin"><span class="spin lg"></span></div>';

/* ---------------- list view ---------------- */
let listedOnce = false;
async function loadVideos() {
  if (!listedOnce) $('#videoList').innerHTML = SPINNER;
  if (READING_ENABLED) { try { TEXTS = await api('/texts'); } catch {} }
  try {
    VIDEOS = await api('/videos');
    listedOnce = true;
    api('/videos?archived=1').then(a => { ARCHIVED = a || []; renderList(); }).catch(() => {});
  } catch (e) {
    VIDEOS = await offlineVideoList();
    $('#videoList').innerHTML = '';
    renderList();
    if (VIDEOS.length || TEXTS.length)
      $('#videoList').insertAdjacentHTML('afterbegin',
        `<div class="empty">offline — showing saved ${READING_ENABLED ? 'items' : 'videos'}</div>`);
    return;
  }
  renderList();
  refreshStudyBanner();
  const busy = VIDEOS.some(v => ['queued','running'].includes(v.extract?.state));
  clearTimeout(listTimer);
  if (busy && !CURRENT) listTimer = setTimeout(loadVideos, 3000);
}

function progressPct(ex) {
  if (!ex) return 0;
  if (ex.state === 'done') return 100;
  if (ex.state === 'error') return 100;
  if (ex.state === 'queued' || !ex.chunks_total) return 6;
  return 6 + (ex.chunks_done / ex.chunks_total) * 92;
}
function bar(ex) {
  const cls = ex.state === 'done' ? ' done' : ex.state === 'error' ? ' err' : '';
  return `<div class="pbar"><div class="pfill${cls}" style="width:${progressPct(ex)}%"></div></div>`;
}
function extractLine(ex) {
  if (ex.state === 'queued') return 'queued…';
  if (ex.state === 'running') {
    const parts = [];
    if (ex.chunks_total) parts.push(`${ex.chunks_done}/${ex.chunks_total}`);
    if (ex.added != null) parts.push(`${ex.added} words`);
    parts.push(fmtTime(ex.elapsed));
    return 'extracting · ' + parts.join(' · ');
  }
  if (ex.state === 'error') return 'failed: ' + (ex.detail || 'unknown');
  return ex.detail || '';
}

function renderList() {
  const box = $('#videoList');
  const vids = VIDEOS.filter(v => v.kind !== 'text' && v.kind !== 'song');
  const songs = VIDEOS.filter(v => v.kind === 'song');
  const texts = VIDEOS.filter(v => v.kind === 'text');
  if (!vids.length && !songs.length && !texts.length && !TEXTS.length) {
    box.innerHTML = '<div class="empty">Nothing yet. Paste a video link, or a book / article link, above.</div>';
    return;
  }
  box.innerHTML = '';
  const head = t => { const h = document.createElement('div'); h.className = 'chan'; h.textContent = t; box.appendChild(h); };

  if (songs.length) {
    head('Music');
    for (const v of songs) box.appendChild(songCard(v));
  }
  if (vids.length) {
    head('Videos');
    box.appendChild(videoCard(vids[0], true));
    const groups = {};
    for (const v of vids.slice(1)) (groups[v.channel || 'Unknown channel'] ||= []).push(v);
    for (const chan of Object.keys(groups).sort((a,b) => a.localeCompare(b))) {
      head(chan);
      for (const v of groups[chan]) box.appendChild(videoCard(v));
    }
  }
  if (texts.length || TEXTS.length) {
    head('Reading');
    for (const v of texts) box.appendChild(readCard(v));
    for (const t of TEXTS) box.appendChild(textCard(t));
  }
  if (ARCHIVED.length) {
    const h = document.createElement('div');
    h.className = 'chan arch-head';
    h.textContent = `Archived (${ARCHIVED.length}) — cards kept`;
    box.appendChild(h);
    for (const v of ARCHIVED) box.appendChild(archivedCard(v));
  }
}

function archivedCard(v) {
  const el = document.createElement('div');
  el.className = 'lib-card arch';
  const n = v.card_count || 0;
  el.innerHTML = `
    <div class="bk">📦</div>
    <div class="body">
      <div class="t">${escapeHtml(v.title || 'Untitled')}</div>
      <div class="m">${n} card${n === 1 ? '' : 's'} still linked here</div>
      <div class="arch-acts">
        <button onclick="event.stopPropagation();unarchiveVideo(${v.id})">restore to home</button>
        <button class="danger" onclick="event.stopPropagation();openVidDelete(${v.id})">delete…</button>
      </div>
    </div>`;
  return el;
}
async function unarchiveVideo(id) {
  try { await api(`/videos/${id}/unhide`, { method: 'POST' }); }
  catch (e) { toast('couldn’t restore — ' + e.message, 2500); return; }
  toast('restored to home');
  loadVideos();
}

function songCard(v) {
  const el = document.createElement('div');
  el.className = 'lib-card';
  const ex = v.extract || { state: 'idle' };
  const tr = v.transcribe || {};
  const bits = [v.channel,
    tr.state === 'running' ? 'transcribing lyrics…'
      : ex.state === 'running' || ex.state === 'queued' ? 'finding words…'
      : v.pending ? `${v.pending} to review`
      : v.lines ? 'ready' : null].filter(Boolean);
  el.innerHTML = `
    <div class="bk">🎵</div>
    <div class="body">
      <div class="t">${escapeHtml(v.title || 'Untitled')}</div>
      <div class="m">${escapeHtml(bits.join(' · '))}</div>
    </div>`;
  el.onclick = () => openDetail(v.id);
  return el;
}

function readCard(v) {
  const el = document.createElement('div');
  el.className = 'lib-card';
  const ex = v.extract || { state: 'idle' };
  let pos = 0;
  try { pos = Math.max(0, Math.min(100, +localStorage.getItem('rdpos:' + v.id) || 0)); } catch {}
  const bits = [v.channel,
    ex.state === 'running' || ex.state === 'queued' ? 'finding words…'
      : v.pending ? `${v.pending} to review` : null].filter(Boolean);
  el.innerHTML = `
    <div class="bk">📖</div>
    <div class="body">
      <div class="t">${escapeHtml(v.title || 'Untitled')}</div>
      <div class="m">${escapeHtml(bits.join(' · '))}${pos ? ` · ${pos}% read` : ''}</div>
      ${pos ? `<div class="rbar"><i style="width:${pos}%"></i></div>` : ''}
    </div>`;
  el.onclick = () => openReader(v.id);       // straight into the text
  return el;
}

function textCard(t) {
  const el = document.createElement('div');
  el.className = 'lib-card';
  let pos = 0;
  try {
    const rp = JSON.parse(localStorage.getItem('rp:' + t.id) || 'null');
    if (rp && t.chapters) pos = Math.min(100, Math.round(((rp.ch + (rp.frac || 0)) / t.chapters) * 100));
  } catch {}
  const meta = [t.author, t.chapters > 1 ? `${t.chapters} chapters` : null,
                `${Math.round((t.char_count || 0) / 1000)}k chars`].filter(Boolean).join(' · ');
  el.innerHTML = `
    <div class="bk">📖</div>
    <div class="body">
      <div class="t">${escapeHtml(t.title || 'Untitled')}</div>
      <div class="m">${escapeHtml(meta)}${pos ? ` · ${pos}% read` : ''}</div>
      ${pos ? `<div class="rbar"><i style="width:${pos}%"></i></div>` : ''}
    </div>`;
  el.onclick = () => openText(t.id);
  return el;
}

function channelLink(v) {
  const name = escapeHtml(v.channel || 'Unknown channel');
  return v.channel_url
    ? `<a class="ext" href="${escapeHtml(v.channel_url)}" target="_blank" rel="noopener">${name}</a>`
    : name;
}
function videoCard(v, feat) {
  const ex = v.extract || {state:'idle'};
  const busy = ['queued','running'].includes(ex.state);
  const el = document.createElement('div');
  el.className = 'vcard' + (feat ? ' feat' : '')
    + (ex.state === 'done' || (!busy && v.pending >= 0 && ex.state !== 'error') ? ' done' : '')
    + (ex.state === 'error' ? ' error' : '');
  const thumb = v.thumbnail_url
    ? `<img loading="lazy" src="${escapeHtml(v.thumbnail_url)}" alt="">` : '<img alt="">';
  let statusHtml;
  if (busy) {
    statusHtml = `${bar(ex)}<div class="pmeta">${extractLine(ex)}</div>`;
  } else if (ex.state === 'error') {
    statusHtml = `<div class="pmeta" style="color:var(--no)">${escapeHtml(extractLine(ex))}</div>`;
  } else {
    const rev = v.pending ? `${v.pending} to review`
              : (v._offline ? 'saved offline' : 'nothing to review');
    statusHtml = `<div class="doneline">✓ ${rev}${v.lines ? ` · ${v.lines} lines` : ''}</div>`;
  }
  el.innerHTML = `
    ${thumb}
    <div class="body">
      <div class="vtitle">${escapeHtml(v.title || '(untitled)')}</div>
      <div class="vmeta">${channelLink(v)}
        · <a class="ext" href="${escapeHtml(v.url)}" target="_blank" rel="noopener">YouTube ↗</a></div>
      ${statusHtml}
    </div>`;
  el.querySelectorAll('.ext').forEach(a => a.onclick = e => e.stopPropagation());
  el.onclick = () => openDetail(v.id);
  return el;
}

const VIDEO_HOSTS = /(youtube\.com|youtu\.be|vk(?:video)?\.(?:com|ru)|m\.vkvideo\.ru|rutube\.ru|dzen\.ru|ok\.ru)/i;
const MUSIC_HOSTS = /music\.apple\.com/i;
async function addVideo() {
  const url = $('#url').value.trim();
  if (!url) return;
  if (MUSIC_HOSTS.test(url)) return addSong();
  setBusy($('#addBtn'), true);
  $('#addStatus').textContent = '';
  const isText = /^https?:\/\//.test(url) && !VIDEO_HOSTS.test(url);
  try {
    if (isText) {
      $('#addStatus').textContent = 'fetching text…';
      const r = await api('/texts/from-url', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ url, chapters: 5 }),
      });
      $('#url').value = '';
      const m = $('#model') ? $('#model').value : 'sonnet';
      await api(`/videos/${r.id}/extract?model=${m}`, { method: 'POST' });
      await openDetail(r.id);
      loadVideosQuiet();
    } else {
      const r = await api('/videos', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      $('#url').value = '';
      const m = $('#model') ? $('#model').value : 'haiku';
      await api(`/videos/${r.video_id}/extract?model=${m}`, { method: 'POST' });
      await openDetail(r.video_id);
      loadVideosQuiet();
    }
  } catch (e) {
    $('#addStatus').textContent = 'error: ' + e.message;
  } finally { setBusy($('#addBtn'), false); }
}

async function addSong() {
  const url = $('#url').value.trim();
  if (!url) { $('#url').focus(); return; }
  setBusy($('#addBtn'), true);
  $('#addSongBtn').disabled = true;
  $('#addStatus').textContent = 'finding lyrics…';
  try {
    const r = await api('/songs', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    $('#url').value = '';
    $('#addStatus').textContent = r.note || (r.synced ? 'synced lyrics' : 'transcribing…');
    // the server's song pipeline downloads audio, (Whispers if needed) and
    // extracts vocab on its own — nothing more to kick off here
    await openDetail(r.id);
    loadVideosQuiet();
  } catch (e) {
    $('#addStatus').textContent = 'error: ' + e.message;
  } finally {
    setBusy($('#addBtn'), false);
    $('#addSongBtn').disabled = false;
  }
}

/* ---------------- detail view ---------------- */
function showList() {
  CURRENT = null;
  if (sse) { sse.close(); sse = null; }
  clearInterval(tickTimer); tickTimer = null;
  $('#detailView').hidden = true;
  $('#listView').hidden = false;
  loadVideos();
}

async function openDetail(id) {
  CURRENT = id;
  clearTimeout(listTimer);
  $('#listView').hidden = true;
  $('#detailView').hidden = false;
  $('#q').value = ''; $('#results').innerHTML = ''; $('#liveStatus').textContent = '';
  $('#cards').innerHTML = SPINNER; $('#progressPanel').innerHTML = '';
  let v = VIDEOS.find(x => x.id === id);
  if (!v) { try { v = await api(`/videos/${id}`); } catch { v = await offlineVideoMeta(id); } }
  DETAIL_V = v || {id};
  const isText = DETAIL_V.kind === 'text';
  const isSong = DETAIL_V.kind === 'song';
  $('#detailView').classList.toggle('text-mode', isText);
  $('#detailView').classList.toggle('song-detail', isSong);
  renderVHead(DETAIL_V);
  $('#readBtn').hidden = !isText;
  if (isText) {
    $('#watchBtn').hidden = true;
  } else if (isSong) {
    $('#watchBtn').hidden = !navigator.onLine && !(await opfsHas(id));
    $('#watchBtn').textContent = '🎵 Listen with lyrics';
    $('#offlineRow').innerHTML = ''; $('#mediaRow').innerHTML = '';
    renderTranscribeRow(id);
  } else {
    const localOK = await opfsHas(id);
    $('#watchBtn').hidden = !navigator.onLine && !localOK;
    $('#watchBtn').textContent = (DETAIL_V.youtube_id || localOK)
      ? '▶ Watch with captions'
      : (navigator.onLine ? '▶ Stream with captions' : '▶ Watch with captions');
    await renderOfflineRow(id);
    renderMediaRow(id);
    renderTranscribeRow(id);
  }
  try { $('#reviewPanel').classList.toggle('collapsed', localStorage.getItem('reviewCollapsed') === '1'); } catch {}
  const ex = (v && v.extract) || {state:'idle'};
  if (['queued','running'].includes(ex.state) && navigator.onLine) startProgress(v, ex);
  else renderProgressDone(ex);
  loadCandidates();
}

function renderVHead(v) {
